$kind: http-request
method: POST
url: '{{baseUrl}}/api/v1/profile/addresses/validate-consistency'
order: 1000
headers:
  - key: 'Content-Type'
    value: 'application/json'
  - key: 'X-Internal-Token'
    value: '{{internalToken}}'
  - key: 'X-User-ID'
    value: '{{userId}}'
  - key: 'X-User-Role'
    value: 'CUSTOMER'
body:
  type: json
  content: |-
    {
      "street_address": "29 Mai Lão Bạng",
      "ward_code": "WARD-TL-013",
      "province_code": "75"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Expected HTTP 200', () => pm.response.to.have.status(200));
      pm.test('Verified mapping', () => { const b=pm.response.json(); pm.expect(b.is_consistent).to.eql(true); pm.expect(b.warning_level).to.eql('VERIFIED'); });
