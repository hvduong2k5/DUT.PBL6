$kind: http-request
name: 'Legacy HTTP simulation route is rejected; gRPC tested separately'
method: POST
url: '{{baseUrl}}/api/v1/profile/addresses/{{addressId}}'
order: 1000
headers:
  - key: 'X-Internal-Token'
    value: '{{internalToken}}'
  - key: 'X-User-ID'
    value: '{{userId}}'
  - key: 'X-User-Role'
    value: 'CUSTOMER'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Expected HTTP 405', () => pm.response.to.have.status(405));
      pm.test('HTTP simulation route removed',()=>pm.expect(pm.response.code).to.eql(405));
