$kind: http-request
method: GET
url: '{{baseUrl}}/api/v1/profile'
order: 4000
headers:
  - key: 'X-Internal-Token'
    value: '{{internalToken}}'
  - key: 'X-User-ID'
    value: 'd0000000-0000-0000-0000-000000000099'
  - key: 'X-User-Role'
    value: 'CUSTOMER'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Expected HTTP 404', () => pm.response.to.have.status(404));
