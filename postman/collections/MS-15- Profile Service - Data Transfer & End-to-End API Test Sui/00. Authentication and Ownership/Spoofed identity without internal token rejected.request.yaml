$kind: http-request
method: GET
url: '{{baseUrl}}/api/v1/profile'
order: 2000
headers:
  - key: 'X-User-ID'
    value: '{{userId}}'
  - key: 'X-User-Role'
    value: 'ADMIN'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Expected HTTP 401', () => pm.response.to.have.status(401));
