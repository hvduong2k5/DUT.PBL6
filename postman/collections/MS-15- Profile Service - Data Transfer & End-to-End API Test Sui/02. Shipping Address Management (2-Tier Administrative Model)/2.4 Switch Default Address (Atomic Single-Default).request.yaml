$kind: http-request
method: PATCH
url: '{{baseUrl}}/api/v1/profile/addresses/{{secondAddressId}}/default'
order: 4000
headers:
  - key: 'X-Internal-Token'
    value: '{{internalToken}}'
  - key: 'X-User-ID'
    value: '{{userId}}'
  - key: 'X-User-Role'
    value: 'CUSTOMER'
  - key: 'If-Match'
    value: '{{secondETag}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Expected HTTP 200', () => pm.response.to.have.status(200));
      const list=pm.response.json(); pm.test('Exactly one default',()=>{pm.expect(list.filter(a=>a.is_default).length).to.eql(1); pm.expect(list.find(a=>a.is_default).id).to.eql(pm.collectionVariables.get('secondAddressId'));}); const a=list.find(a=>a.id===pm.collectionVariables.get('secondAddressId')); pm.collectionVariables.set('secondETag','"'+a.version+'"');
