$kind: http-request
method: PUT
url: '{{baseUrl}}/api/v1/profile/addresses/{{addressId}}'
order: 3000
headers:
  - key: 'Content-Type'
    value: 'application/json'
  - key: 'X-Internal-Token'
    value: '{{internalToken}}'
  - key: 'X-User-ID'
    value: '{{userId}}'
  - key: 'X-User-Role'
    value: 'CUSTOMER'
  - key: 'If-Match'
    value: '{{addressETag}}'
body:
  type: json
  content: |-
    {
      "recipient_name": "Test Recipient",
      "phone_number": "0905123456",
      "street_address": "15 Lê Lợi",
      "ward_code": "WARD-TH-001",
      "ward_name": "Forged name",
      "province_code": "75",
      "province_name": "Forged province",
      "label": "HOME"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Expected HTTP 200', () => pm.response.to.have.status(200));
      pm.collectionVariables.set('addressETag',pm.response.headers.get('ETag')); pm.test('Version increment',()=>pm.expect(pm.response.json().version).to.eql(2));
