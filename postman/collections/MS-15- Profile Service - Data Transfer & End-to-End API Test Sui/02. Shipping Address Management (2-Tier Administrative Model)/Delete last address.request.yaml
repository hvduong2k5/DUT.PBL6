$kind: http-request
method: DELETE
url: '{{baseUrl}}/api/v1/profile/addresses/{{addressId}}'
order: 5100
headers:
  - key: 'X-Internal-Token'
    value: '{{internalToken}}'
  - key: 'X-User-ID'
    value: '{{userId}}'
  - key: 'X-User-Role'
    value: 'CUSTOMER'
  - key: 'If-Match'
    value: '{{addressETag}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Expected HTTP 200', () => pm.response.to.have.status(200));
      pm.test('No addresses remain',()=>pm.expect(pm.response.json()).to.eql([]));
