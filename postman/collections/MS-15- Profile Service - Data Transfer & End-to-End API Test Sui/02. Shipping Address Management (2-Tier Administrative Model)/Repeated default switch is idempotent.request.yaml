$kind: http-request
method: PUT
url: '{{baseUrl}}/api/v1/profile/addresses/{{secondAddressId}}/default'
order: 4100
headers:
  - key: 'X-Internal-Token'
    value: '{{internalToken}}'
  - key: 'X-User-ID'
    value: '{{userId}}'
  - key: 'X-User-Role'
    value: 'CUSTOMER'
  - key: 'If-Match'
    value: '{{secondETag}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Expected HTTP 200', () => pm.response.to.have.status(200));
      const a=pm.response.json().find(a=>a.id===pm.collectionVariables.get('secondAddressId')); pm.test('No version increment on retry',()=>pm.expect('"'+a.version+'"').to.eql(pm.collectionVariables.get('secondETag')));
