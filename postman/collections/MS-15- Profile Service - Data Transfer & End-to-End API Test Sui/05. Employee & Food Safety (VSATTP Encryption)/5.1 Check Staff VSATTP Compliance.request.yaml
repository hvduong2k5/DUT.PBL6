$kind: http-request
method: GET
url: '{{baseUrl}}/api/v1/admin/employees/compliance'
order: 1000
headers:
  - key: 'X-Internal-Token'
    value: '{{internalToken}}'
  - key: 'X-User-ID'
    value: '{{userId}}'
  - key: 'X-User-Role'
    value: 'HR_ADMIN'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Expected HTTP 200', () => pm.response.to.have.status(200));
      pm.test('Compliance list',()=>pm.expect(pm.response.json()).to.be.an('array'));
