$kind: http-request
method: GET
url: '{{baseUrl}}/api/v1/profile/guest-claims/TEST-CLAIM-B'
order: 2000
headers:
  - key: 'X-Internal-Token'
    value: '{{internalToken}}'
  - key: 'X-User-ID'
    value: '{{userId}}'
  - key: 'X-User-Role'
    value: 'CUSTOMER'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Expected HTTP 404', () => pm.response.to.have.status(404));
