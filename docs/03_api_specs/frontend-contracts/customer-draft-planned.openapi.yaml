openapi: "3.1.0"
info:
  title: "Customer Web API - Draft and Planned"
  version: "0.1.0"
  license:
    name: "Proprietary"
    identifier: "LicenseRef-Proprietary"
  description: "Non-stable proposal for backend review. Every operation requires an explicit product/security decision before implementation compatibility is promised. Draft means a concrete proposal exists; planned means the capability is identified but policy or workflow remains incomplete."
servers:
  -
    url: "https://api.omama.vn"
tags:
  -
    name: "Media"
    description: "Media proposed operations for the customer web application."
  -
    name: "Orders"
    description: "Orders proposed operations for the customer web application."
  -
    name: "After-sales"
    description: "After-sales proposed operations for the customer web application."
  -
    name: "Customer support"
    description: "Customer support proposed operations for the customer web application."
  -
    name: "Authentication"
    description: "Authentication proposed operations for the customer web application."
  -
    name: "B2B"
    description: "B2B proposed operations for the customer web application."
  -
    name: "Loyalty"
    description: "Loyalty proposed operations for the customer web application."
  -
    name: "Notifications"
    description: "Notifications proposed operations for the customer web application."
  -
    name: "Notification-preferences"
    description: "Notification-preferences proposed operations for the customer web application."
paths:
  "/api/v1/media/upload-sessions":
    post:
      tags:
        - "Media"
      operationId: "postMediaUploadSessions"
      summary: "Create a direct-upload session with type, size and ownership policy."
      x-lifecycle: "draft"
      x-decision-required: true
      x-backlog:
        - "EPIC_14"
        - "EPIC_16"
        - "EPIC_18"
      x-ui-states:
        - "loading"
        - "success"
        - "error"
        - "unauthorized"
        - "forbidden"
      security:
        -
          bearerAuth: []
        -
          customerSession: []
      parameters:
        -
          $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: "Proposed successful response."
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "uploadSessionId"
                  - "uploadUrl"
                  - "expiresAt"
                  - "requiredHeaders"
                properties:
                  uploadSessionId:
                    type: "string"
                  uploadUrl:
                    type: "string"
                    format: "uri"
                  expiresAt:
                    type: "string"
                    format: "date-time"
                  requiredHeaders:
                    type: "object"
                    required: []
                    properties: {}
                    additionalProperties: false
                additionalProperties: false
              examples:
                success:
                  value:
                    uploadSessionId: "UPL-01"
                    uploadUrl: "https://storage.example.com/signed"
                    expiresAt: "2026-10-05T09:15:00Z"
                    requiredHeaders: {}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              required:
                - "purpose"
                - "fileName"
                - "mediaType"
                - "sizeBytes"
              properties:
                purpose:
                  type: "string"
                fileName:
                  type: "string"
                mediaType:
                  type: "string"
                sizeBytes:
                  type: "integer"
              additionalProperties: false
            example:
              purpose: "RETURN_EVIDENCE"
              fileName: "package.jpg"
              mediaType: "image/jpeg"
              sizeBytes: 420000
  "/api/v1/media/upload-sessions/{uploadSessionId}/complete":
    post:
      tags:
        - "Media"
      operationId: "postMediaUploadSessionsUploadSessionIdComplete"
      summary: "Confirm upload and start malware/content validation."
      x-lifecycle: "draft"
      x-decision-required: true
      x-backlog:
        - "EPIC_14"
        - "EPIC_16"
        - "EPIC_18"
      x-ui-states:
        - "loading"
        - "success"
        - "error"
        - "unauthorized"
        - "forbidden"
