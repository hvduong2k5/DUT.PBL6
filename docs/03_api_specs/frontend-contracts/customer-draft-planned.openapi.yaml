    get:
      tags:
        - "Orders"
      operationId: "getOrdersOrderIdReturnsEligibility"
      summary: "Evaluate after-sales eligibility from the authoritative order snapshot."
      x-lifecycle: "draft"
      x-decision-required: true
      x-backlog:
        - "EPIC_08"
      x-ui-states:
        - "loading"
        - "success"
        - "empty"
        - "error"
        - "unauthorized"
        - "forbidden"
      security:
        -
          bearerAuth: []
        -
          customerSession: []
      parameters:
        -
          name: "orderId"
          in: "path"
          required: true
          schema:
            type: "string"
            minLength: 1
        -
          name: "q"
          in: "query"
          required: false
          description: "Case-insensitive search text for supported identifiers and labels."
          schema:
            type: "string"
            maxLength: 200
        -
          name: "status"
          in: "query"
          required: false
          description: "Domain status filter. Allowed values are defined by the endpoint response status vocabulary."
          schema:
            type: "string"
        -
          name: "page"
          in: "query"
          required: false
          schema:
            type: "integer"
            minimum: 1
            default: 1
        -
          name: "pageSize"
          in: "query"
          required: false
          schema:
            type: "integer"
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: "Proposed successful response."
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "orderId"
                  - "eligible"
                  - "policyWindowEndsAt"
                  - "lines"
                properties:
                  orderId:
                    type: "string"
                  eligible:
                    type: "boolean"
                  policyWindowEndsAt:
                    type: "string"
                    format: "date-time"
                  lines:
                    type: "array"
                    items: {}
                additionalProperties: false
              examples:
                success:
                  value:
                    orderId: "ORD-20261015-0042"
                    eligible: true
                    policyWindowEndsAt: "2026-10-22T00:00:00Z"
                    lines: []
                empty:
                  value:
                    orderId: "ORD-20261015-0042"
                    eligible: true
                    policyWindowEndsAt: "2026-10-22T00:00:00Z"
                    lines: []
