          in: "path"
          required: true
          schema:
            type: "string"
            minLength: 1
        -
          $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: "Proposed successful response."
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "employeeId"
                  - "status"
                  - "revision"
