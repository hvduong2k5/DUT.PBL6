openapi: "3.1.0"
info:
  title: "Internal Employee Web API - Draft and Planned"
  version: "0.1.0"
  license:
    name: "Proprietary"
    identifier: "LicenseRef-Proprietary"
  description: "Non-stable proposal for backend review. Every operation requires an explicit product/security decision before implementation compatibility is promised. Draft means a concrete proposal exists; planned means the capability is identified but policy or workflow remains incomplete."
servers:
  -
    url: "https://api.omama.vn"
tags:
  -
    name: "Access management"
    description: "Access management proposed operations for the admin web application."
  -
    name: "Product management"
    description: "Product management proposed operations for the admin web application."
  -
    name: "Orders"
    description: "Orders proposed operations for the admin web application."
  -
    name: "Packing"
    description: "Packing proposed operations for the admin web application."
  -
    name: "Shipping"
    description: "Shipping proposed operations for the admin web application."
  -
    name: "Payments"
    description: "Payments proposed operations for the admin web application."
  -
    name: "After-sales"
    description: "After-sales proposed operations for the admin web application."
  -
    name: "Customer support"
    description: "Customer support proposed operations for the admin web application."
  -
    name: "Inventory"
    description: "Inventory proposed operations for the admin web application."
paths:
  "/api/v1/admin/access/employees/invitations":
    post:
      tags:
        - "Access management"
      operationId: "postAdminAccessEmployeesInvitations"
      summary: "Invite an employee account linked to an existing employee profile."
      x-lifecycle: "draft"
      x-decision-required: true
      x-backlog:
        - "EPIC_22"
      x-ui-states:
        - "loading"
        - "success"
        - "error"
        - "unauthorized"
        - "forbidden"
      security:
        -
          bearerAuth: []
        -
          adminSession: []
      parameters:
        -
          $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: "Proposed successful response."
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "accountId"
                  - "status"
                  - "revision"
                properties:
                  accountId:
                    type: "string"
                  status:
                    type: "string"
                  revision:
                    type: "integer"
                additionalProperties: false
              examples:
                success:
                  value:
                    accountId: "ACC-0012"
                    status: "INVITED"
                    revision: 1
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              required:
                - "employeeId"
                - "email"
                - "roleAssignments"
              properties:
                employeeId:
                  type: "string"
                email:
                  type: "string"
                  format: "email"
                roleAssignments:
                  type: "array"
                  items: {}
              additionalProperties: false
            example:
              employeeId: "EMP-0012"
              email: "employee@example.com"
              roleAssignments: []
  "/api/v1/admin/access/employees/{employeeId}/status":
    patch:
      tags:
        - "Access management"
      operationId: "patchAdminAccessEmployeesEmployeeIdStatus"
      summary: "Lock, unlock, disable, or reactivate employee access."
