                success:
                  value:
                    employeeId: "EMP-0012"
                    revision: 5
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              required:
                - "assignments"
                - "expectedRevision"
              properties:
                assignments:
                  type: "array"
                  items:
                    type: "object"
                    required:
                      - "roleCode"
                      - "scope"
                      - "effectiveFrom"
                      - "effectiveUntil"
                    properties:
                      roleCode:
                        type: "string"
                      scope:
                        type: "object"
                        required:
                          - "type"
                        properties:
                          type:
                            type: "string"
                        additionalProperties: false
                      effectiveFrom:
                        type: "string"
                        format: "date-time"
                      effectiveUntil:
                        type:
                          - "string"
                          - "null"
                        description: "effectiveUntil may be null."
                    additionalProperties: false
                expectedRevision:
                  type: "integer"
              additionalProperties: false
            example:
              assignments:
                -
                  roleCode: "PACKING"
                  scope:
                    type: "ASSIGNED_ONLY"
                  effectiveFrom: "2026-10-05T00:00:00Z"
                  effectiveUntil: null
              expectedRevision: 4
