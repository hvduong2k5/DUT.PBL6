  "/api/v1/admin/orders/{orderId}/actions":
    post:
      tags:
        - "Orders"
      operationId: "postAdminOrdersOrderIdActions"
      summary: "Apply an authorized order transition with business precondition checks."
      x-lifecycle: "draft"
      x-decision-required: true
      x-backlog:
        - "EPIC_08"
      x-ui-states:
        - "loading"
        - "success"
        - "error"
        - "unauthorized"
        - "forbidden"
      security:
        -
          bearerAuth: []
        -
          adminSession: []
      parameters:
        -
          name: "orderId"
          in: "path"
          required: true
          schema:
            type: "string"
            minLength: 1
        -
          $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: "Proposed successful response."
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "orderId"
                  - "status"
                  - "revision"
                properties:
                  orderId:
                    type: "string"
                  status:
                    type: "string"
                  revision:
                    type: "integer"
                additionalProperties: false
              examples:
                success:
                  value:
                    orderId: "ORD-01"
                    status: "CONFIRMED"
                    revision: 5
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              required:
                - "action"
                - "expectedRevision"
                - "idempotencyKey"
              properties:
                action:
                  type: "string"
                expectedRevision:
                  type: "integer"
                idempotencyKey:
                  type: "string"
              additionalProperties: false
            example:
              action: "CONFIRM"
              expectedRevision: 4
              idempotencyKey: "17142f65-dad7-44a8-8867-5afabfe2486b"
  "/api/v1/admin/packing/tasks/{taskId}/assignments":
