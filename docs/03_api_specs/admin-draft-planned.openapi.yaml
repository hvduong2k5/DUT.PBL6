                  type: "string"
                note:
                  type: "string"
                expectedRevision:
                  type: "integer"
              additionalProperties: false
            example:
              decision: "APPROVE"
              note: "Da doi chieu"
              expectedRevision: 1
components:
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
    adminSession:
      type: "apiKey"
      in: "cookie"
      name: "admin_session"
  parameters:
    IdempotencyKey:
      name: "Idempotency-Key"
      in: "header"
      required: false
      description: "Required for retryable create/action operations. Same key and same payload must return the same outcome."
      schema:
        type: "string"
        format: "uuid"
  schemas:
    Error:
      type: "object"
      required:
        - "code"
        - "message"
        - "requestId"
      properties:
        code:
          type: "string"
          description: "Stable machine-readable error code."
        message:
          type: "string"
          description: "Safe user-facing message in Vietnamese or the negotiated locale."
        requestId:
          type: "string"
          description: "Correlation identifier for support and logs."
        errors:
          type: "array"
          items:
            type: "object"
            required:
              - "field"
              - "code"
              - "message"
            properties:
              field:
                type: "string"
              code:
                type: "string"
              message:
                type: "string"
            additionalProperties: false
        retryAfterSeconds:
          type: "integer"
          minimum: 1
        details:
          type: "object"
          additionalProperties: true
      additionalProperties: false
    AdminProductWriteResponse:
      type: "object"
      description: "ApiResponse envelope cho mọi thao tác ghi catalog admin."
      required:
        - "success"
        - "code"
        - "message"
        - "data"
        - "timestamp"
      properties:
        success:
          type: "boolean"
          enum: [true]
        code:
          type: "string"
          example: "SUCCESS"
        message:
          type: "string"
          description: "Thông điệp tiếng Việt hiển thị được cho người dùng."
        data:
          $ref: "#/components/schemas/AdminProductDetail"
        requestId:
          type: "string"
        timestamp:
          type: "string"
          format: "date-time"
      additionalProperties: false
    AdminProductDetail:
      type: "object"
      description: "Chi tiết sản phẩm sau thao tác ghi, gồm toàn bộ nội dung admin có thể chỉnh sửa."
      required:
        - "productId"
        - "name"
        - "slug"
      properties:
        productId:
          type: "string"
          format: "uuid"
        categoryId:
          type: "string"
          format: "uuid"
        categoryName:
          type: "string"
        name:
          type: "string"
        slug:
          type: "string"
        description:
          type: "string"
          nullable: true
        ingredients:
          type: "string"
          nullable: true
        storageGuide:
          type: "string"
          nullable: true
        ocopStar:
          type: "integer"
          minimum: 3
          maximum: 5
          nullable: true
        ocopCertificateNo:
          type: "string"
          nullable: true
        story:
          type: "string"
          nullable: true
        approvalStatus:
          type: "string"
          enum: ["DRAFT", "PENDING", "APPROVED", "REJECTED"]
        listingStatus:
          type: "string"
          enum: ["ACTIVE", "SUSPENDED", "ARCHIVED"]
        imageUrls:
          type: "array"
          items:
            type: "string"
            format: "uri"
        variants:
          type: "array"
          items:
            $ref: "#/components/schemas/AdminProductVariant"
        createdAt:
          type: "string"
          format: "date-time"
        updatedAt:
          type: "string"
          format: "date-time"
        version:
          type: "integer"
          format: "int64"
          description: "Revision mới sau khi ghi; client dùng cho lần PATCH tiếp theo."
      additionalProperties: false
    AdminProductVariant:
      type: "object"
      properties:
        variantId:
          type: "string"
          format: "uuid"
        productId:
          type: "string"
          format: "uuid"
        skuCode:
          type: "string"
        name:
          type: "string"
        weightValue:
          type: "number"
        weightUnit:
          type: "string"
          enum: ["GRAM", "KILOGRAM"]
        flavor:
          type: "string"
          nullable: true
        packagingType:
          type: "string"
          enum:
            - "HOP_GIAY_KRAFT"
            - "HOP_THIEC"
            - "GOI_HUT_CHAN_KHONG"
            - "HOP_QUA_TANG"
            - "DANG_ROI"
        shelfLifeDays:
          type: "integer"
        price:
          $ref: "#/components/schemas/AdminMoney"
        listingStatus:
          type: "string"
          enum: ["ACTIVE", "SUSPENDED", "ARCHIVED"]
        stockAvailable:
          type: "integer"
          format: "int64"
          nullable: true
      additionalProperties: false
    AdminMoney:
      type: "object"
      properties:
        currencyCode:
          type: "string"
          example: "VND"
        units:
          type: "integer"
          format: "int64"
        nanos:
          type: "integer"
      additionalProperties: false
    AdminPriceRecord:
      type: "object"
      description: "Một bản ghi giá theo kênh của SKU, dùng cho màn hình lịch sử giá."
      properties:
        priceId:
          type: "string"
          format: "uuid"
        channel:
          type: "string"
          enum:
            - "D2C_WEB"
            - "MOBILE_APP"
            - "B2B_WHOLESALE"
            - "POS_QUAY"
            - "SHOPEE"
            - "TIKTOK"
        currencyCode:
          type: "string"
        amountUnits:
          type: "integer"
          format: "int64"
        amountNanos:
          type: "integer"
        status:
          type: "string"
          enum: ["ACTIVE", "SUPERSEDED", "EXPIRED"]
        effectiveFrom:
          type: "string"
          format: "date-time"
        effectiveTo:
          type: "string"
          format: "date-time"
          nullable: true
        revision:
          type: "integer"
          format: "int64"
      additionalProperties: false
  responses:
    BadRequest:
      description: "Malformed request or invalid query parameters."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: "BAD_REQUEST"
            message: "Malformed request or invalid query parameters."
            requestId: "req-01J9YAJ6CX8G5E0K7M8N9PQRST"
            errors: []
    Unauthorized:
      description: "Authentication is missing, invalid, or expired."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: "AUTHENTICATION_REQUIRED"
            message: "Authentication is missing, invalid, or expired."
            requestId: "req-01J9YAJ6CX8G5E0K7M8N9PQRST"
            errors: []
    Forbidden:
      description: "Authenticated actor lacks the required permission, capability, ownership, or data scope."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: "FORBIDDEN"
            message: "Authenticated actor lacks the required permission, capability, ownership, or data scope."
            requestId: "req-01J9YAJ6CX8G5E0K7M8N9PQRST"
            errors: []
    NotFound:
      description: "Resource does not exist or is intentionally hidden outside the actor scope."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: "RESOURCE_NOT_FOUND"
            message: "Resource does not exist or is intentionally hidden outside the actor scope."
            requestId: "req-01J9YAJ6CX8G5E0K7M8N9PQRST"
            errors: []
    Conflict:
      description: "State transition, revision, idempotency key, or unique value conflicts with current state."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: "STATE_CONFLICT"
            message: "State transition, revision, idempotency key, or unique value conflicts with current state."
            requestId: "req-01J9YAJ6CX8G5E0K7M8N9PQRST"
            errors: []
    UnprocessableEntity:
      description: "Payload is syntactically valid but violates field or business validation rules."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: "VALIDATION_FAILED"
            message: "Payload is syntactically valid but violates field or business validation rules."
            requestId: "req-01J9YAJ6CX8G5E0K7M8N9PQRST"
            errors: []
    InternalError:
      description: "Unexpected server error."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: "INTERNAL_SERVER_ERROR"
            message: "Unexpected server error."
            requestId: "req-01J9YAJ6CX8G5E0K7M8N9PQRST"
            errors: []
    ServiceUnavailable:
      description: "A required service is temporarily unavailable."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: "SERVICE_UNAVAILABLE"
            message: "A required service is temporarily unavailable."
            requestId: "req-01J9YAJ6CX8G5E0K7M8N9PQRST"
            errors: []
