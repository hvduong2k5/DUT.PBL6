openapi: "3.1.0"
info:
  title: "Internal Employee Web API - Draft and Planned"
  version: "0.2.0"
  license:
    name: "Proprietary"
    identifier: "LicenseRef-Proprietary"
  description: "Non-stable proposal for backend review. Every operation requires an explicit product/security decision before implementation compatibility is promised. Draft means a concrete proposal exists; planned means the capability is identified but policy or workflow remains incomplete."
  x-procurement-service-authorization:
    status: "Twenty operations are stable in admin-stable 2.5.0 and allowlisted in Kong: six supplier/material/offer reads, create/get PO, submit/approve/reject/send/supplier-response/cancel/close PO, revision create/history, create/get receipt and receipt inspection. PO list/draft editing, planning, contract and master-data mutations remain private; Web/BFF integration is pending."
    terminal-po-handoff: "Supplier-response/cancel/close require MANAGE GLOBAL, Idempotency-Key, expected_version and migration 000016 after 000015. Employee records supplier evidence; this is not supplier authentication. Response and trimmed note/reason bind the shared PO command key. Close checks open variances inside the transaction and preserves receiving quantities; no payment/Inventory reversal. Down migration refuses to discard completed new commands."
    revision-handoff: "Revision create requires MANAGE GLOBAL, Idempotency-Key, expected_version and migration 000017; history requires VIEW GLOBAL. Only CHANGE_REQUESTED without any receipt may revise, same supplier only. Archive/PO/lines/history/result commit atomically; new creator is the signed reviser and must seek separate approval. Fingerprint includes ordered lines and quantity text; replay returns frozen DRAFT before rereading offers. Archive guards block ordinary UPDATE/DELETE/TRUNCATE; rollback retains evidence. History is archived prior revisions only, descending with limit/offset and empty arrays."
    po-action-handoff: "Submit/send require MANAGE GLOBAL; approve/reject require APPROVE GLOBAL and reject creator self-decisions. All four require Idempotency-Key, expected_version and migration 000015; reject additionally requires reason. Actor/key binds PO/action/version/trimmed reason. Matching replay returns a frozen committed PO snapshot, not current state; changed commands conflict. Result evidence commits with PO/history and has no TTL. SEND records state only, not supplier transport. Existing private HTTP callers must adopt the new requirements."
    response-compatibility: "Procurement errors now use the shared flat Error envelope (code, message, requestId), including private operations; the legacy nested error object is removed. Internal callers must migrate. Empty supplier/material/offer collections return items: [], not null."
    identity-rollout:
      migration: "V28__seed_procurement_permissions.sql"
      assignment: "Add the five permissions to existing enabled, non-archived ADMIN roles only; no principal, role or scope assignment is created."
      ordering: "Coordinate Shipping V23/V24 and Promotion V27 before applying V28 to shared environments; do not enable Flyway out-of-order or repair to bypass missing seeds."
      activation: "Run PermissionSync for affected employee principals with forceRelogin=false, then refresh/login to obtain a new token. Migration alone does not update Keycloak or existing JWTs."
      exposure: "Seed and gateway configuration availability do not imply a deployed route, Identity BFF relay or Web UI."
    receiving-handoff:
      operation: "POST /api/v1/admin/procurement/goods-receipts/{goodsReceiptID}/inspect"
      validation: "Physical quantity must be at least 0.01; KG must convert exactly to integer grams; G/GRAM/UNIT/PIECE must be integral; converted quantity cannot exceed 2147483647. Unsupported units fail 400 INVALID_ARGUMENT."
      transaction: "Validation failure rolls back inspection, PO changes and outbox; no partial acceptance is published."
      idempotency: "Inspection now requires Idempotency-Key and migration 000014. Receipt ID + signed inspector + key and normalized payload identify replay; changed key/actor/payload or legacy inspection without evidence returns 409. Retry evidence commits atomically with receipt/PO/history/outbox and is retained with the receipt."
      inventory-policy: "quantity_received enters QUARANTINE under PR #118; accepted/rejected quantities and Procurement dates are evidence only, not Inventory QC authorization. No automatic sellable release or rejected-stock disposition is implemented here."
    token:
      type: "Bearer JWT"
      issuer: "Identity-configured OIDC issuer"
      audience: "Identity-configured Procurement audience (currently expected to be omama-api)"
      requiredClaims:
        - "principal_type=EMPLOYEE"
        - "user_id"
        - "permission_grants"
    permissions:
      - "PROCUREMENT_VIEW#GLOBAL"
      - "PROCUREMENT_MANAGE#GLOBAL"
      - "PROCUREMENT_APPROVE#GLOBAL"
      - "PROCUREMENT_RECEIVE#WAREHOUSE#<warehouseCode>"
      - "PROCUREMENT_VARIANCE_RESOLVE#WAREHOUSE#<warehouseCode>"
    rules:
      - "Role names do not bypass permission checks."
      - "Receipt actions and variance resolution enforce the matching warehouse scope; GLOBAL grants are allowed for operational admins."
      - "Missing or invalid authentication returns 401; valid employee tokens missing permission or scope return 403."
