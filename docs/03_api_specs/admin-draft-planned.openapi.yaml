openapi: "3.1.0"
info:
  title: "Internal Employee Web API - Draft and Planned"
  version: "0.2.0"
  license:
    name: "Proprietary"
    identifier: "LicenseRef-Proprietary"
  description: "Non-stable proposal for backend review. Every operation requires an explicit product/security decision before implementation compatibility is promised. Draft means a concrete proposal exists; planned means the capability is identified but policy or workflow remains incomplete."
servers:
  -
    url: "https://api.omama.vn"
tags:
  -
    name: "Access management"
    description: "Access management proposed operations for the admin web application."
  -
    name: "Orders"
    description: "Orders proposed operations for the admin web application."
  -
    name: "Packing"
    description: "Packing proposed operations for the admin web application."
  -
    name: "Shipping"
    description: "Shipping proposed operations for the admin web application."
  -
    name: "Payments"
    description: "Payments proposed operations for the admin web application."
  -
    name: "After-sales"
    description: "After-sales proposed operations for the admin web application."
  -
    name: "Customer support"
    description: "Customer support proposed operations for the admin web application."
  -
    name: "Inventory"
    description: "Inventory proposed operations for the admin web application."
  - name: Marketing
    description: Draft Campaign planning and approval operations for EPIC 21.
paths:
  /api/v1/admin/marketing/campaigns/{campaignId}/revisions/{revisionId}/executions:
    x-employee-session-path: /api/v1/admin/marketing-api/campaigns/{campaignId}/revisions/{revisionId}/executions
    parameters:
    - name: campaignId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: revisionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: listMarketingExecutions
      summary: List channel executions
      tags:
      - Marketing
      security:
      - marketingEmployeeSession: []
      - bearerAuth: []
      responses:
        '200':
          description: Execution result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketingExecutions'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      description: Requires MARKETING_CAMPAIGN_VIEW in the campaign department or GLOBAL.
    post:
      operationId: scheduleMarketingExecution
      summary: Schedule a channel from the approved revision
      tags:
      - Marketing
      security:
      - marketingEmployeeSession: []
      - bearerAuth: []
      responses:
        '201':
          description: Execution result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketingExecution'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      description: Requires MARKETING_EXECUTION_MANAGE in the campaign department or
        GLOBAL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketingScheduleExecution'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          pattern: ^[!-~]{16,128}$
  /api/v1/admin/marketing/campaigns/{campaignId}/revisions/{revisionId}/executions/{executionId}/actions:
    x-employee-session-path: /api/v1/admin/marketing-api/campaigns/{campaignId}/revisions/{revisionId}/executions/{executionId}/actions
    parameters:
    - name: campaignId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: revisionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: executionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: actOnMarketingExecution
      summary: Record a manual channel action
      tags:
      - Marketing
      security:
      - marketingEmployeeSession: []
      - bearerAuth: []
      responses:
        '200':
          description: Execution result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketingExecution'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      description: Requires MARKETING_EXECUTION_MANAGE in the campaign department or
        GLOBAL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketingExecutionAction'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          pattern: ^[!-~]{16,128}$
  /api/v1/admin/marketing/campaigns:
    x-employee-session-path: '/api/v1/admin/marketing-api/campaigns'
    get:
      tags:
      - Marketing
      operationId: listMarketingCampaigns
      summary: List campaigns in the employee scope
      description: Requires MARKETING_CAMPAIGN_VIEW in the campaign department or a GLOBAL grant for the same
        permission.
      security:
      - marketingEmployeeSession: []
      - bearerAuth: []
      responses:
        '200':
          description: Marketing operation succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketingCampaignList'
              example:
                items: []
                total: 0
                nextCursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
      - name: departmentId
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - name: state
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/MarketingState'
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          maxLength: 2048
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
    post:
      tags:
      - Marketing
      operationId: createMarketingCampaign
      summary: Create a campaign and its first draft
      description: Requires MARKETING_PLAN_EDIT and MARKETING_BUDGET_EDIT in the campaign department or a GLOBAL
        grant for the same permission.
      security:
      - marketingEmployeeSession: []
      - bearerAuth: []
      responses:
        '201':
          description: Marketing operation succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketingRevision'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketingCampaignCreate'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
          pattern: ^[!-~]+$
  /api/v1/admin/marketing/campaigns/{campaignId}:
    x-employee-session-path: '/api/v1/admin/marketing-api/campaigns/{campaignId}'
    parameters:
    - name: campaignId
      in: path
      required: true
      schema: &id001
        type: string
        format: uuid
    get:
      tags:
      - Marketing
      operationId: getMarketingCampaign
      summary: Get the current campaign revision
      description: Requires MARKETING_CAMPAIGN_VIEW in the campaign department or a GLOBAL grant for the same
        permission.
      security:
      - marketingEmployeeSession: []
      - bearerAuth: []
      responses:
        '200':
          description: Marketing operation succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketingRevision'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/admin/marketing/campaigns/{campaignId}/revisions:
    x-employee-session-path: '/api/v1/admin/marketing-api/campaigns/{campaignId}/revisions'
    parameters:
    - name: campaignId
      in: path
      required: true
      schema: *id001
    post:
      tags:
      - Marketing
      operationId: createMarketingRevision
      summary: Create a draft from the current closed review revision
      description: Requires MARKETING_PLAN_EDIT in the campaign department or a GLOBAL grant for the same permission.
      security:
      - marketingEmployeeSession: []
      - bearerAuth: []
      responses:
        '201':
          description: Marketing operation succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketingRevision'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketingRevisionCreate'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
          pattern: ^[!-~]+$
  /api/v1/admin/marketing/campaigns/{campaignId}/revisions/{revisionId}:
    x-employee-session-path: '/api/v1/admin/marketing-api/campaigns/{campaignId}/revisions/{revisionId}'
    parameters:
    - name: campaignId
      in: path
      required: true
      schema: *id001
    - name: revisionId
      in: path
      required: true
      schema: *id001
    get:
      tags:
      - Marketing
      operationId: getMarketingRevision
      summary: Get a campaign revision
      description: Requires MARKETING_CAMPAIGN_VIEW in the campaign department or a GLOBAL grant for the same
        permission.
      security:
      - marketingEmployeeSession: []
      - bearerAuth: []
      responses:
        '200':
          description: Marketing operation succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketingRevision'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Marketing
      operationId: updateMarketingDraft
      summary: Replace the plan in a draft revision
      description: Requires MARKETING_PLAN_EDIT in the campaign department or a GLOBAL grant for the same permission.
        Changing plannedBudgetVnd additionally requires MARKETING_BUDGET_EDIT.
      security:
      - marketingEmployeeSession: []
      - bearerAuth: []
      responses:
        '200':
          description: Marketing operation succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketingRevision'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketingPlanUpdate'
  /api/v1/admin/marketing/campaigns/{campaignId}/revisions/{revisionId}/submit:
    x-employee-session-path: '/api/v1/admin/marketing-api/campaigns/{campaignId}/revisions/{revisionId}/submit'
    parameters:
    - name: campaignId
      in: path
      required: true
      schema: *id001
    - name: revisionId
      in: path
      required: true
      schema: *id001
    post:
      tags:
      - Marketing
      operationId: submitMarketingRevision
      summary: Submit a campaign revision
      description: Requires MARKETING_PLAN_SUBMIT in the campaign department or a GLOBAL grant for the same permission.
        Requires a complete plan, a content brief per channel and verified public Product references where present. Product references require CATALOG_VIEW for Catalog Admin verification. Cookie clients use the corresponding x-employee-session-path to forward an authenticated staff bearer through Identity.
      security:
      - marketingEmployeeSession: []
      - bearerAuth: []
      responses:
        '200':
          description: Marketing operation succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketingRevision'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketingSubmit'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
          pattern: ^[!-~]+$
  /api/v1/admin/marketing/campaigns/{campaignId}/revisions/{revisionId}/withdraw:
    x-employee-session-path: '/api/v1/admin/marketing-api/campaigns/{campaignId}/revisions/{revisionId}/withdraw'
    parameters:
    - name: campaignId
      in: path
      required: true
      schema: *id001
    - name: revisionId
      in: path
      required: true
      schema: *id001
    post:
      tags:
      - Marketing
      operationId: withdrawMarketingRevision
      summary: Withdraw a campaign revision
      description: Requires MARKETING_PLAN_SUBMIT in the campaign department or a GLOBAL grant for the same permission.
        Requires an open request and a reason.
      security:
      - marketingEmployeeSession: []
      - bearerAuth: []
      responses:
        '200':
          description: Marketing operation succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketingRevision'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketingReviewAction'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
          pattern: ^[!-~]+$
  /api/v1/admin/marketing/campaigns/{campaignId}/revisions/{revisionId}/approve:
    x-employee-session-path: '/api/v1/admin/marketing-api/campaigns/{campaignId}/revisions/{revisionId}/approve'
    parameters:
    - name: campaignId
      in: path
      required: true
      schema: *id001
    - name: revisionId
      in: path
      required: true
      schema: *id001
    post:
      tags:
      - Marketing
      operationId: approveMarketingRevision
      summary: Approve a campaign revision
      description: Requires MARKETING_PLAN_APPROVE in the campaign department or a GLOBAL grant for the same
        permission. Approves the frozen planned budget. The revision author and submitter are ineligible. An
        applicable configured ceiling must cover the budget.
      security:
      - marketingEmployeeSession: []
      - bearerAuth: []
      responses:
        '200':
          description: Marketing operation succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketingRevision'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketingApprove'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
          pattern: ^[!-~]+$
  /api/v1/admin/marketing/campaigns/{campaignId}/revisions/{revisionId}/reject:
    x-employee-session-path: '/api/v1/admin/marketing-api/campaigns/{campaignId}/revisions/{revisionId}/reject'
    parameters:
    - name: campaignId
      in: path
      required: true
      schema: *id001
    - name: revisionId
      in: path
      required: true
      schema: *id001
    post:
      tags:
      - Marketing
      operationId: rejectMarketingRevision
      summary: Reject a campaign revision
      description: Requires MARKETING_PLAN_APPROVE in the campaign department or a GLOBAL grant for the same
        permission. Requires a reason. The revision author and submitter are ineligible.
      security:
      - marketingEmployeeSession: []
      - bearerAuth: []
      responses:
        '200':
          description: Marketing operation succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketingRevision'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketingReviewAction'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
          pattern: ^[!-~]+$
  /api/v1/admin/marketing/campaigns/{campaignId}/revisions/{revisionId}/request-changes:
    x-employee-session-path: '/api/v1/admin/marketing-api/campaigns/{campaignId}/revisions/{revisionId}/request-changes'
    parameters:
    - name: campaignId
      in: path
      required: true
      schema: *id001
    - name: revisionId
      in: path
      required: true
      schema: *id001
    post:
      tags:
      - Marketing
      operationId: requestChangesMarketingRevision
      summary: Request changes a campaign revision
      description: Requires MARKETING_PLAN_APPROVE in the campaign department or a GLOBAL grant for the same
        permission. Requires a reason. The revision author and submitter are ineligible.
      security:
      - marketingEmployeeSession: []
      - bearerAuth: []
      responses:
        '200':
          description: Marketing operation succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketingRevision'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketingReviewAction'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
          pattern: ^[!-~]+$
  /api/v1/admin/access/employees:
    $ref: './iam-consumer-read.openapi.yaml#/paths/~1api~1v1~1admin~1access~1employees'
  /api/v1/admin/access/employees/{id}:
    $ref: './iam-consumer-read.openapi.yaml#/paths/~1api~1v1~1admin~1access~1employees~1{id}'
  /api/v1/admin/access/roles:
    $ref: './iam-consumer-read.openapi.yaml#/paths/~1api~1v1~1admin~1access~1roles'
  /api/v1/admin/access/roles/{id}:
    $ref: './iam-consumer-read.openapi.yaml#/paths/~1api~1v1~1admin~1access~1roles~1{id}'
  /api/v1/admin/access/permissions:
    $ref: './iam-consumer-read.openapi.yaml#/paths/~1api~1v1~1admin~1access~1permissions'
  /api/v1/admin/access/permissions/{id}:
    $ref: './iam-consumer-read.openapi.yaml#/paths/~1api~1v1~1admin~1access~1permissions~1{id}'
  /api/v1/admin/orders:
    $ref: './iam-consumer-read.openapi.yaml#/paths/~1api~1v1~1admin~1orders'
  /api/v1/admin/orders/queue:
    $ref: './iam-consumer-read.openapi.yaml#/paths/~1api~1v1~1admin~1orders~1queue'
  /api/v1/admin/orders/{id}:
    $ref: './iam-consumer-read.openapi.yaml#/paths/~1api~1v1~1admin~1orders~1{id}'
  /api/v1/admin/order-api/orders:
    $ref: './iam-consumer-read.openapi.yaml#/paths/~1api~1v1~1admin~1order-api~1orders'
  /api/v1/admin/order-api/orders/queue:
    $ref: './iam-consumer-read.openapi.yaml#/paths/~1api~1v1~1admin~1order-api~1orders~1queue'
  /api/v1/admin/order-api/orders/{id}:
    $ref: './iam-consumer-read.openapi.yaml#/paths/~1api~1v1~1admin~1order-api~1orders~1{id}'
  "/api/v1/admin/orders/{orderId}/actions":
    post:
      tags:
        - "Orders"
      operationId: "postAdminOrdersOrderIdActions"
