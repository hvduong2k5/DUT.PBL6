openapi: "3.1.0"
info:
  title: "Internal Employee Web API - Draft and Planned"
  version: "0.1.0"
  license:
    name: "Proprietary"
    identifier: "LicenseRef-Proprietary"
  description: "Non-stable proposal for backend review. Every operation requires an explicit product/security decision before implementation compatibility is promised. Draft means a concrete proposal exists; planned means the capability is identified but policy or workflow remains incomplete."
servers:
  -
    url: "https://api.omama.vn"
tags:
  -
    name: "Access management"
    description: "Access management proposed operations for the admin web application."
  -
    name: "Product management"
    description: "Product management proposed operations for the admin web application."
  -
    name: "Orders"
    description: "Orders proposed operations for the admin web application."
  -
    name: "Packing"
    description: "Packing proposed operations for the admin web application."
  -
    name: "Shipping"
    description: "Shipping proposed operations for the admin web application."
  -
    name: "Payments"
    description: "Payments proposed operations for the admin web application."
  -
    name: "After-sales"
    description: "After-sales proposed operations for the admin web application."
  -
    name: "Customer support"
    description: "Customer support proposed operations for the admin web application."
  -
    name: "Inventory"
    description: "Inventory proposed operations for the admin web application."
paths:
  "/api/v1/admin/catalog/products":
    post:
      tags:
        - "Product management"
      operationId: "postAdminCatalogProducts"
      summary: "Tạo sản phẩm mới ở trạng thái DRAFT."
      x-lifecycle: "draft"
      x-decision-required: true
      x-backlog:
        - "EPIC_04"
      security:
        -
          bearerAuth: []
        -
          adminSession: []
      parameters:
        -
          $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              required:
                - "name"
                - "categoryId"
                - "slug"
              properties:
                name:
                  type: "string"
                  maxLength: 500
                categoryId:
                  type: "string"
                  format: "uuid"
                slug:
                  type: "string"
                  maxLength: 500
                description:
                  type: "string"
                  maxLength: 5000
                ingredients:
                  type: "string"
                  maxLength: 2000
                storageGuide:
                  type: "string"
                  maxLength: 1000
                ocopStar:
                  type: "integer"
                  minimum: 3
                  maximum: 5
                ocopCertificateNo:
                  type: "string"
                  maxLength: 100
                story:
                  type: "string"
                  maxLength: 5000
              additionalProperties: false
            example:
              name: "Kẹo mè xửng O Mạ"
              categoryId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
              slug: "keo-me-xung-o-ma"
              description: "Đặc sản Huế"
              ingredients: "Mè, đường, gừng"
              storageGuide: "Bảo quản nơi khô ráo"
              ocopStar: 5
              ocopCertificateNo: "OCOP-HUE-2026-001"
              story: "Câu chuyện làng nghề mè xửng Cồn Hến"
      responses:
        "200":
          description: "Product created successfully."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/AdminProductWriteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  "/api/v1/admin/catalog/products/{productId}":
    patch:
      tags:
        - "Product management"
      operationId: "patchAdminCatalogProductsProductId"
      summary: "Cập nhật một phần nội dung sản phẩm (PATCH)."
      description: >
        Cập nhật mọi thông tin nội dung của sản phẩm: tên, slug, danh mục, mô tả, thành phần,
        hướng dẫn bảo quản, sao OCOP, số chứng nhận và câu chuyện thương hiệu.
        Field không gửi lên sẽ giữ nguyên. Chuỗi rỗng ("") dùng để xóa field optional.
        name/slug nếu gửi lên thì không được rỗng.
      x-lifecycle: "draft"
      x-decision-required: true
      x-backlog:
        - "EPIC_04"
      security:
        -
          bearerAuth: []
        -
          adminSession: []
      parameters:
        -
          name: "productId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
        -
          $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              required:
                - "expectedVersion"
              properties:
                name:
                  type: "string"
                  maxLength: 500
                  description: "Không được rỗng nếu gửi lên."
                slug:
                  type: "string"
                  maxLength: 500
                  description: "Không được rỗng nếu gửi lên; phải unique."
                categoryId:
                  type: "string"
                  format: "uuid"
                description:
                  type: "string"
                  maxLength: 5000
                ingredients:
                  type: "string"
                  maxLength: 2000
                storageGuide:
                  type: "string"
                  maxLength: 1000
                ocopStar:
                  type: "integer"
                  minimum: 3
                  maximum: 5
                ocopCertificateNo:
                  type: "string"
                  maxLength: 100
                story:
                  type: "string"
                  maxLength: 5000
                expectedVersion:
                  type: "integer"
                  minimum: 0
                  description: "Revision hiện tại của Product; bắt buộc cho optimistic locking."
              additionalProperties: false
            example:
              story: "Câu chuyện thương hiệu O Mạ — gìn giữ hương vị Huế."
              ingredients: "Mè, đường mía, gừng"
              storageGuide: "Bảo quản nơi khô ráo, tránh ánh nắng trực tiếp"
              ocopStar: 5
              expectedVersion: 3
      responses:
        "200":
          description: "Product content updated successfully."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/AdminProductWriteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    put:
      tags:
        - "Product management"
      operationId: "putAdminCatalogProductsProductId"
      summary: "Cập nhật toàn bộ nội dung sản phẩm (legacy, ưu tiên dùng PATCH)."
      deprecated: true
      x-lifecycle: "draft"
      x-decision-required: true
      security:
        -
          bearerAuth: []
        -
          adminSession: []
      parameters:
        -
          name: "productId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
        -
          $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              required:
                - "version"
              properties:
                name:
                  type: "string"
                  maxLength: 500
                slug:
                  type: "string"
                  maxLength: 500
                categoryId:
                  type: "string"
                  format: "uuid"
                description:
                  type: "string"
                  maxLength: 5000
                ingredients:
                  type: "string"
                  maxLength: 2000
                storageGuide:
                  type: "string"
                  maxLength: 1000
                ocopStar:
                  type: "integer"
                  minimum: 3
                  maximum: 5
                ocopCertificateNo:
                  type: "string"
                  maxLength: 100
                story:
                  type: "string"
                  maxLength: 5000
                version:
                  type: "integer"
                  minimum: 0
              additionalProperties: false
      responses:
        "200":
          description: "Product updated successfully."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/AdminProductWriteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  "/api/v1/admin/catalog/products/{productId}/transition":
    post:
      tags:
        - "Product management"
      operationId: "postAdminCatalogProductsProductIdTransition"
      summary: "Chuyển trạng thái vòng đời sản phẩm."
      description: "Hỗ trợ SUBMIT_FOR_REVIEW, APPROVE, REJECT, SUSPEND, ARCHIVE."
      x-lifecycle: "draft"
      x-decision-required: true
      x-backlog:
        - "EPIC_04"
      security:
        -
          bearerAuth: []
        -
          adminSession: []
      parameters:
        -
          name: "productId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
        -
          $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              required:
                - "transition"
                - "expectedVersion"
              properties:
                transition:
                  type: "string"
                  enum:
                    - "SUBMIT_FOR_REVIEW"
                    - "APPROVE"
                    - "REJECT"
                    - "SUSPEND"
                    - "ARCHIVE"
                expectedVersion:
                  type: "integer"
                  minimum: 0
              additionalProperties: false
            example:
              transition: "APPROVE"
              expectedVersion: 1
      responses:
        "200":
          description: "Product status transitioned successfully."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/AdminProductWriteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  "/api/v1/admin/catalog/products/{productId}/skus":
    post:
      tags:
        - "Product management"
      operationId: "postAdminCatalogProductsProductIdSkus"
      summary: "Thêm SKU mới cho sản phẩm."
      description: >
        Tạo SKU với quy cách đóng gói, khối lượng và giá cơ bản theo kênh D2C_WEB.
        skuCode là duy nhất toàn catalog.
      x-lifecycle: "draft"
      x-decision-required: true
      x-backlog:
        - "EPIC_04"
      security:
        -
          bearerAuth: []
        -
          adminSession: []
      parameters:
        -
          name: "productId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
        -
          $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              required:
                - "skuCode"
                - "variantName"
                - "weightValue"
                - "packagingType"
                - "basePriceUnits"
              properties:
                skuCode:
                  type: "string"
                  maxLength: 100
                variantName:
                  type: "string"
                  maxLength: 500
                weightValue:
                  type: "number"
                  exclusiveMinimum: 0
                weightUnit:
                  type: "string"
                  enum: ["GRAM", "KILOGRAM"]
                  default: "GRAM"
                flavor:
                  type: "string"
                  maxLength: 200
                packagingType:
                  type: "string"
                  enum:
                    - "HOP_GIAY_KRAFT"
                    - "HOP_THIEC"
                    - "GOI_HUT_CHAN_KHONG"
                    - "HOP_QUA_TANG"
                    - "DANG_ROI"
                shelfLifeDays:
                  type: "integer"
                  minimum: 1
                basePriceUnits:
                  type: "integer"
                  minimum: 1
                  description: "Giá cơ bản theo VND (đơn vị nhỏ nhất)."
              additionalProperties: false
            example:
              skuCode: "MX-500"
              variantName: "Hộp 500g"
              weightValue: 500
              weightUnit: "GRAM"
              flavor: "Gừng"
              packagingType: "HOP_THIEC"
              shelfLifeDays: 180
              basePriceUnits: 345000
      responses:
        "200":
          description: "SKU created successfully."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/AdminProductWriteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  "/api/v1/admin/catalog/products/{productId}/skus/{skuId}":
    patch:
      tags:
        - "Product management"
      operationId: "patchAdminCatalogProductsProductIdSkusSkuId"
      summary: "Cập nhật một phần thông tin SKU."
      description: >
        Chỉnh sửa tên biến thể, khối lượng, đơn vị, hương vị, loại bao bì, hạn sử dụng và trạng thái bán.
        skuCode là bất biến, không thể đổi qua API này. Field không gửi lên sẽ giữ nguyên.
      x-lifecycle: "draft"
      x-decision-required: true
      x-backlog:
        - "EPIC_04"
      security:
        -
          bearerAuth: []
        -
          adminSession: []
      parameters:
        -
          name: "productId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
        -
          name: "skuId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
        -
          $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              required:
                - "expectedVersion"
              properties:
                variantName:
                  type: "string"
                  maxLength: 500
                weightValue:
                  type: "number"
                  exclusiveMinimum: 0
                weightUnit:
                  type: "string"
                  enum: ["GRAM", "KILOGRAM"]
                flavor:
                  type: "string"
                  maxLength: 200
                packagingType:
                  type: "string"
                  enum:
                    - "HOP_GIAY_KRAFT"
                    - "HOP_THIEC"
                    - "GOI_HUT_CHAN_KHONG"
                    - "HOP_QUA_TANG"
                    - "DANG_ROI"
                shelfLifeDays:
                  type: "integer"
                  minimum: 1
                saleStatus:
                  type: "string"
                  enum: ["ON_SALE", "PAUSED", "DISCONTINUED"]
                expectedVersion:
                  type: "integer"
                  minimum: 0
              additionalProperties: false
            example:
              variantName: "Hộp 500g cao cấp"
              saleStatus: "PAUSED"
              expectedVersion: 2
      responses:
        "200":
          description: "SKU updated successfully."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/AdminProductWriteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  "/api/v1/admin/catalog/products/{productId}/skus/{skuId}/prices":
    get:
      tags:
        - "Product management"
      operationId: "getAdminCatalogProductsProductIdSkusSkuIdPrices"
      summary: "Xem lịch sử giá của SKU trên mọi kênh bán."
      x-lifecycle: "draft"
      x-decision-required: true
      security:
        -
          bearerAuth: []
        -
          adminSession: []
      parameters:
        -
          name: "productId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
        -
          name: "skuId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      responses:
        "200":
          description: "Price history returned."
          content:
            "application/json":
              schema:
                type: "object"
                required: ["success", "code", "message", "data", "timestamp"]
                properties:
                  success:
                    type: "boolean"
                    enum: [true]
                  code:
                    type: "string"
                    example: "SUCCESS"
                  message:
                    type: "string"
                  data:
                    type: "array"
                    items:
                      $ref: "#/components/schemas/AdminPriceRecord"
                  timestamp:
                    type: "string"
                    format: "date-time"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    put:
      tags:
        - "Product management"
      operationId: "putAdminCatalogProductsProductIdSkusSkuIdPrices"
      summary: "Cập nhật bảng giá bán của SKU theo kênh."
      description: >
        Mỗi entry sẽ supersede giá ACTIVE cũ của cùng kênh và tạo bản ghi giá mới.
        Hỗ trợ D2C_WEB, MOBILE_APP, B2B_WHOLESALE, POS_QUAY, SHOPEE, TIKTOK.
      x-lifecycle: "draft"
      x-decision-required: true
      x-backlog:
        - "EPIC_04"
      security:
        -
          bearerAuth: []
        -
          adminSession: []
      parameters:
        -
          name: "productId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
        -
          name: "skuId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
        -
          $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              required:
                - "prices"
              properties:
                prices:
                  type: "array"
                  minItems: 1
                  items:
                    type: "object"
                    required:
                      - "channel"
                      - "amountUnits"
                    properties:
                      channel:
                        type: "string"
                        enum:
                          - "D2C_WEB"
                          - "MOBILE_APP"
                          - "B2B_WHOLESALE"
                          - "POS_QUAY"
                          - "SHOPEE"
                          - "TIKTOK"
                      amountUnits:
                        type: "integer"
                        minimum: 1
                        description: "Giá theo VND (đơn vị nhỏ nhất)."
                      currencyCode:
                        type: "string"
                        default: "VND"
                        minLength: 3
                        maxLength: 3
                    additionalProperties: false
              additionalProperties: false
            example:
              prices:
                - channel: "D2C_WEB"
                  amountUnits: 345000
                  currencyCode: "VND"
                - channel: "SHOPEE"
                  amountUnits: 355000
                  currencyCode: "VND"
      responses:
        "200":
          description: "Prices updated successfully."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/AdminProductWriteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  "/api/v1/admin/catalog/products/{productId}/images":
    post:
      tags:
        - "Product management"
      operationId: "postAdminCatalogProductsProductIdImages"
      summary: "Thêm ảnh cho sản phẩm."
      description: >
        Thêm metadata ảnh (object key MinIO/S3). Nếu role=COVER và mediaStatus=APPROVED,
        ảnh cover APPROVED cũ sẽ tự động được hạ xuống GALLERY để đảm bảo mỗi sản phẩm
        chỉ có tối đa một ảnh cover.
      x-lifecycle: "draft"
      x-decision-required: true
      x-backlog:
        - "EPIC_04"
      security:
        -
          bearerAuth: []
        -
          adminSession: []
      parameters:
        -
          name: "productId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
        -
          $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              required:
                - "objectKey"
              properties:
                objectKey:
                  type: "string"
                  maxLength: 1024
                altText:
                  type: "string"
                  maxLength: 500
                role:
                  type: "string"
                  enum: ["COVER", "GALLERY", "THUMBNAIL"]
                  default: "GALLERY"
                position:
                  type: "integer"
                  minimum: 0
                  default: 0
                mediaStatus:
                  type: "string"
                  enum: ["PENDING_SCAN", "APPROVED", "REJECTED"]
                  default: "PENDING_SCAN"
              additionalProperties: false
            example:
              objectKey: "products/keo-me-xung/cover.jpg"
              altText: "Hộp kẹo mè xửng O Mạ"
              role: "COVER"
              mediaStatus: "APPROVED"
              position: 0
      responses:
        "200":
          description: "Image added successfully."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/AdminProductWriteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
