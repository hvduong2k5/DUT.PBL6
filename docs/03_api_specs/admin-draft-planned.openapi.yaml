components:
  securitySchemes:
    identityCookie:
      $ref: ./traceability-web-bff-draft.openapi.yaml#/components/securitySchemes/identityCookie
    oidcCookie:
      $ref: ./traceability-web-bff-draft.openapi.yaml#/components/securitySchemes/oidcCookie
    identityStaffBearer:
      $ref: './traceability-workflow-bff-draft.openapi.yaml#/components/securitySchemes/identityStaffBearer'
    employeeSessionCookie:
      $ref: './traceability-workflow-bff-draft.openapi.yaml#/components/securitySchemes/employeeSessionCookie'
    staffBearer:
      $ref: './traceability-workflow-draft.openapi.yaml#/components/securitySchemes/staffBearer'
    bearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
    adminSession:
      type: "apiKey"
      in: "cookie"
      name: "admin_session"
  parameters:
    IdempotencyKey:
      name: "Idempotency-Key"
      in: "header"
      required: false
      description: "Required for retryable create/action operations. Same key and same payload must return the same outcome."
      schema:
        type: "string"
        format: "uuid"
  schemas:
    Error:
      type: "object"
      required:
        - "code"
        - "message"
        - "requestId"
      properties:
        code:
          type: "string"
          description: "Stable machine-readable error code."
        message:
          type: "string"
          description: "Safe user-facing message in Vietnamese or the negotiated locale."
        requestId:
          type: "string"
          description: "Correlation identifier for support and logs."
        errors:
          type: "array"
          items:
            type: "object"
            required:
              - "field"
              - "code"
              - "message"
            properties:
              field:
                type: "string"
              code:
                type: "string"
              message:
                type: "string"
            additionalProperties: false
        retryAfterSeconds:
          type: "integer"
          minimum: 1
        details:
          type: "object"
          additionalProperties: true
      additionalProperties: false
  responses:
    BadRequest:
      description: "Malformed request or invalid query parameters."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: "BAD_REQUEST"
            message: "Malformed request or invalid query parameters."
            requestId: "req-01J9YAJ6CX8G5E0K7M8N9PQRST"
            errors: []
    Unauthorized:
      description: "Authentication is missing, invalid, or expired."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: "AUTHENTICATION_REQUIRED"
            message: "Authentication is missing, invalid, or expired."
            requestId: "req-01J9YAJ6CX8G5E0K7M8N9PQRST"
            errors: []
    Forbidden:
      description: "Authenticated actor lacks the required permission, capability, ownership, or data scope."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: "FORBIDDEN"
            message: "Authenticated actor lacks the required permission, capability, ownership, or data scope."
            requestId: "req-01J9YAJ6CX8G5E0K7M8N9PQRST"
            errors: []
    NotFound:
      description: "Resource does not exist or is intentionally hidden outside the actor scope."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: "RESOURCE_NOT_FOUND"
            message: "Resource does not exist or is intentionally hidden outside the actor scope."
            requestId: "req-01J9YAJ6CX8G5E0K7M8N9PQRST"
            errors: []
    Conflict:
      description: "State transition, revision, idempotency key, or unique value conflicts with current state."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: "STATE_CONFLICT"
            message: "State transition, revision, idempotency key, or unique value conflicts with current state."
            requestId: "req-01J9YAJ6CX8G5E0K7M8N9PQRST"
            errors: []
    UnprocessableEntity:
      description: "Payload is syntactically valid but violates field or business validation rules."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: "VALIDATION_FAILED"
            message: "Payload is syntactically valid but violates field or business validation rules."
            requestId: "req-01J9YAJ6CX8G5E0K7M8N9PQRST"
            errors: []
    InternalError:
      description: "Unexpected server error."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: "INTERNAL_SERVER_ERROR"
            message: "Unexpected server error."
            requestId: "req-01J9YAJ6CX8G5E0K7M8N9PQRST"
            errors: []
    ServiceUnavailable:
      description: "A required service is temporarily unavailable."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: "SERVICE_UNAVAILABLE"
            message: "A required service is temporarily unavailable."
            requestId: "req-01J9YAJ6CX8G5E0K7M8N9PQRST"
            errors: []
