components:
  securitySchemes:
    marketingEmployeeSession:
      type: apiKey
      in: cookie
      name: OMAMA_SESSION
    bearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
    adminSession:
      type: "apiKey"
      in: "cookie"
      name: "admin_session"
  parameters:
    IdempotencyKey:
      name: "Idempotency-Key"
      in: "header"
      required: false
      description: "Required for retryable create/action operations. Same key and same payload must return the same outcome."
      schema:
        type: "string"
        format: "uuid"
  schemas:
    MarketingExecution:
      type: object
      properties:
        id:
          type: string
          format: uuid
        channel:
          type: string
          minLength: 1
          maxLength: 200
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        state:
          type: string
          enum:
          - SCHEDULED
          - ACTIVE
          - PAUSED
          - COMPLETED
          - CANCELLED
        version:
          type: integer
          minimum: 1
          maximum: 9007199254740991
      required:
      - id
      - channel
      - startsAt
      - endsAt
      - state
      - version
      additionalProperties: false
    MarketingExecutions:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MarketingExecution'
        total:
          type: integer
          minimum: 0
      required:
      - items
      - total
      additionalProperties: false
    MarketingScheduleExecution:
      type: object
      properties:
        channel:
          type: string
          minLength: 1
          maxLength: 200
        expectedVersion:
          type: integer
          minimum: 1
          maximum: 9007199254740991
      required:
      - channel
      - expectedVersion
      additionalProperties: false
    MarketingExecutionAction:
      type: object
      properties:
        action:
          type: string
          enum:
          - START
          - PAUSE
          - COMPLETE
          - CANCEL
        expectedVersion:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        reason:
          type: string
          minLength: 1
          maxLength: 200
        evidenceRef:
          type: string
          pattern: ^[A-Za-z0-9._:/-]{1,200}$
      required:
      - action
      - expectedVersion
      additionalProperties: false
    MarketingChannelPlan:
      type: object
      additionalProperties: false
      required:
      - channel
      - startsAt
      - endsAt
      - brief
      properties:
        channel: &marketingSchema002
          type: string
          minLength: 1
          maxLength: 200
        startsAt: &marketingSchema001
          type: string
          format: date-time
        endsAt: *marketingSchema001
        brief:
          type: string
          maxLength: 4000
    MarketingProductReference:
      type: object
      additionalProperties: false
      required:
      - productId
      - slug
      properties:
        productId: &marketingSchema003
          type: string
          format: uuid
        slug: *marketingSchema002
    MarketingKpiTarget:
      type: object
      additionalProperties: false
      required:
      - metricCode
      - unit
      - target
      properties:
        metricCode: *marketingSchema002
        unit: *marketingSchema002
        target:
          type: string
          pattern: ^\d{1,12}(\.\d{1,6})?$
    MarketingPlan:
      type: object
      additionalProperties: false
      required:
      - name
      - objective
      - ownerId
      - startsAt
      - endsAt
      - timeZone
      - plannedBudgetVnd
      - channels
      - products
      - kpiTargets
      properties:
        name: *marketingSchema002
        objective: *marketingSchema002
        ownerId: *marketingSchema003
        startsAt: *marketingSchema001
        endsAt: *marketingSchema001
