  /api/auth/me:
    get:
      operationId: readBrowserIdentityWithScopedTraceGrants
      tags:
      - Employee traceability
      summary: Preserve scoped Identity grants in the existing browser session projection
      description: Additive permissionGrants field on principal; authentication uses the existing Identity session
        or OIDC cookies. ACTIVE employee/customer profile still comes from Identity. No tokens or service credentials
        are exposed. Malformed permission tuples fail closed.
      security:
      - identityCookie: []
      - oidcCookie: []
      responses:
        '200':
          description: Authenticated principal projection, no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - authenticated
                - principal
                - customerAccess
                - customer
                properties:
                  authenticated:
                    type: boolean
                    const: true
                  principal:
                    type: object
                    required:
                    - principalId
                    - principalType
                    - displayName
                    - roles
                    - permissions
                    properties:
                      principalId:
                        type: string
                        format: uuid
                      principalType:
                        type: string
                        enum:
                        - EMPLOYEE
                        - CUSTOMER
                      displayName:
                        type: string
                      email:
                        type: string
                      customerId:
                        type: string
                      roles:
                        type: array
                        items:
                          type: object
                          required:
                          - roleCode
                          properties:
                            roleCode:
                              type: string
                            roleName:
                              type: string
                            scopeType:
                              type: string
                            scopeId:
                              type:
                              - string
                              - 'null'
                      permissions:
                        type: array
                        items:
                          type: string
                      permissionGrants:
                        type: array
                        description: Optional legacy-compatible projection of current Identity permission/scope
                          tuples. A missing list never grants Traceability access. An unrelated GLOBAL role cannot
                          widen a WAREHOUSE Traceability grant.
                        items:
                          type: object
                          required:
                          - permissionCode
                          - scopeType
                          - scopeId
                          properties:
                            permissionCode:
                              type: string
                            scopeType:
                              type: string
                            scopeId:
                              type:
                              - string
                              - 'null'
                  customerAccess:
                    type: boolean
                  customer:
                    type:
                    - object
                    - 'null'
                  sessionExpiresAt:
                    type: string
                    format: date-time
        '401':
          description: Authentication absent, forbidden or Identity unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Authentication absent, forbidden or Identity unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Authentication absent, forbidden or Identity unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    identityCookie:
      type: apiKey
      in: cookie
      name: OMAMA_SESSION
    oidcCookie:
      type: apiKey
      in: cookie
      name: oma_access_token
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      - requestId
      properties:
        code: &id005
          type: string
        message: *id005
        requestId: *id005
    UploadInput:
      type: object
      required:
      - purpose
      - fileName
      - mediaType
      - sizeBytes
      - sha256
      properties:
        purpose:
          type: string
          const: OCOP_CERTIFICATE
        fileName:
          type: string
          minLength: 1
          maxLength: 250
        mediaType:
          type: string
          enum:
          - application/pdf
          - image/jpeg
          - image/png
          - image/webp
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 20971520
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
    UploadSession:
      type: object
      required:
      - fileId
      - uploadSessionId
      - uploadUrl
      - requiredHeaders
      - uploadPermit
      properties:
        fileId: *id004
        uploadSessionId: *id005
        uploadUrl:
          type: string
          format: uri
          description: Origin pinned to configured public storage; PUT directly with requiredHeaders and omit credentials.
        requiredHeaders:
          type: object
          additionalProperties: *id005
        uploadPermit:
          type: string
          description: Opaque server HMAC permit; send only to this BFF in X-Upload-Permit, never in URLs.
        expiresAt:
          type: string
          format: date-time
    FileMetadata:
      type: object
      required:
      - fileId
      - status
      - sha256Checksum
      properties:
        fileId: *id004
        status:
          type: string
          enum:
          - AWAITING_UPLOAD
          - PROCESSING
          - READY
          - PROCESSING_FAILED
          - ARCHIVED
        sha256Checksum:
          type:
          - string
          - 'null'
