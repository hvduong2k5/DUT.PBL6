openapi: 3.1.0
info:
  title: Traceability Web BFF adapters
  version: 0.4.0-draft
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: Implemented local Web transport under validation. Same-origin browser routes use the existing employee/customer
    session. Business East-West calls remain gRPC. No stable promotion or production acceptance is implied. OCOP_CERTIFICATE
    scans must already be approved for public storage by the uploader; Media uses PUBLIC_READ at upload. Upload
    permits are actor/file/session-bound, expire after 20 minutes and never grant Traceability warehouse access.
    Keep the private Media provider off the public Internet.
servers:
- url: https://shop.example.test
security:
- identityCookie: []
- oidcCookie: []
tags:
- name: Employee traceability
  description: Scoped workflow through Identity or trusted direct OIDC
- name: Certificate scans
  description: Direct storage uploads with a server-authenticated uploader
- name: Customer order
  description: Owned Order traceability, independent from order detail
