openapi: 3.1.0
info:
  title: Traceability workflow Identity BFF adapters
  version: 0.4.0-draft
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: Direct implementation target, not implemented or stable. Identity maps a trusted OMAMA_SESSION to
    the signed access token and forwards only allowlisted routes to Kong. Known ACTIVE EMPLOYEE checks apply to
    v2 as well as v1. Next BFF validates and forwards Origin on cookie mutations; CSRF Origin checks must not be
    disabled. Backends enforce business permission and scope. The proxy may also authenticate a verified staff bearer
    without a cookie; Direct OIDC mode uses the trusted bearer path and does not require these cookie adapters.
servers:
- url: http://127.0.0.1:8016
security:
- employeeSessionCookie: []
- identityStaffBearer: []
tags:
- name: Identity transport
  description: Cookie-to-bearer transport, no business state mutation in the proxy itself
