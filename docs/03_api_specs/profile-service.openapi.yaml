        '500':
          description: Internal failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/employees:
    get:
      operationId: listEmployees
      summary: HR role required; limit capped to 100
      parameters:
      - name: X-User-ID
        in: header
        required: true
        schema:
          type: string
          format: uuid
      - name: X-User-Role
        in: header
        schema:
