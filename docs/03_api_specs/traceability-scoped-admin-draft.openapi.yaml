  /api/v2/admin/trace/records/by-batch:
    get:
      tags:
      - Staff
      operationId: findScopedTraceabilityByBatchDraft
      summary: Find the existing profile before creating a draft
      description: Requires traceability.read_internal for the authoritative warehouse from Inventory. Validate
        scope even when no profile exists. Warehouse is never trusted from browser input. Existing profile responses
        follow evidence redaction rules. Return at most one exact-binding match; no fuzzy SKU lookup. This literal
        route must take precedence over /records/{id}.
      security:
      - staffBearer: []
      parameters:
      - $ref: ./traceability-workflow-draft.openapi.yaml#/components/parameters/ProductId
      - $ref: ./traceability-workflow-draft.openapi.yaml#/components/parameters/SkuCode
      - $ref: ./traceability-workflow-draft.openapi.yaml#/components/parameters/BatchId
      - name: source_namespace
        in: query
        required: true
        schema:
          type: string
          enum:
          - inventory
      responses:
        '200':
          description: Exact match or empty collection; never 404 for an empty lookup
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - total
                properties:
                  items:
                    type: array
                    maxItems: 1
                    items:
                      type: object
                      required:
                      - profile_id
                      - version
                      properties:
                        profile_id:
                          type: string
                          format: uuid
                        version:
                          type: integer
                          format: int64
                          minimum: 1
                  total:
                    type: integer
                    minimum: 0
                    maximum: 1
              examples:
                empty:
                  value:
                    items: []
                    total: 0
                found:
                  value:
                    items:
                    - profile_id: 11111111-1111-4111-8111-111111111111
                      version: 1
                    total: 1
        '401':
          $ref: ./traceability-workflow-draft.openapi.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./traceability-workflow-draft.openapi.yaml#/components/responses/Forbidden
        '503':
          $ref: ./traceability-workflow-draft.openapi.yaml#/components/responses/Unavailable
        '409':
          $ref: ./traceability-workflow-draft.openapi.yaml#/components/responses/Conflict
        '400':
          $ref: ./traceability-workflow-draft.openapi.yaml#/components/responses/BadRequest
      x-required-permissions:
      - traceability.read_internal
      x-scope-policy: GLOBAL or resource-matching WAREHOUSE; token and current Identity grants must both cover each
        required permission.
