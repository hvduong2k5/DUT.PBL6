openapi: 3.0.3
info:
  title: MS-02 Fulfillment Service — candidate staff API
  version: 1.0.0-candidate
  description: Opt-in MVP staff API; see packages/contracts/mvp/fulfillment-integration.md for runtime evidence and limits. Admission/peer proof APIs are internal
    gRPC, not public staff actions. Integrated-v2 requires verified video and peer capability gates. Idempotency
    and If-Match apply to task mutations; never trust caller actor/role headers. Staff access validates the signature, issuer and omama-api audience by default, then checks the
    signed permission_grants and warehouse scope. Missing or invalid bearer credentials return 401.
    Valid credentials without the required staff identity, grant or scope return 403.
servers:
- url: http://localhost:8002
  description: Proposed isolated local TEST listener; no running service is implied.
security:
- StaffBearer: []
tags:
- name: Fulfillment
  description: Warehouse-scoped staff workflow and controlled evidence.
paths:
  /api/v1/admin/fulfillment/tasks:
    get:
      operationId: ListPackingTasks
      tags:
      - Fulfillment
      summary: ListPackingTasks
      description: Warehouse-scoped keyset queue. Blocked tasks are explicit. Cursor binds filters; queue_as_of
        is a freshness boundary, not cross-request snapshot isolation.
      x-permissions: fulfillment.task.read
      parameters:
      - name: warehouse_id
        in: query
        schema:
          type: string
      - name: workflow_state
        in: query
        schema:
          type: string
          enum:
          - READY
          - ASSIGNED
          - IN_PROGRESS
          - BLOCKED
          - COMPLETED
      - name: assignee_id
        in: query
        schema:
          type: string
          format: uuid
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPage'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '410':
          $ref: '#/components/responses/Error410'
