  /api/v1/admin/fulfillment/tasks/{task_id}/unassign:
    post:
      operationId: UnassignPackingTask
      tags:
      - Fulfillment
      summary: UnassignPackingTask
      description: Current assignee or scoped manager only. Requires ASSIGNED state with no picking/checklist work.
        Reason is audited.
      x-permissions: fulfillment.task.assign_self or fulfillment.task.assign_other
      parameters:
      - $ref: '#/components/parameters/task_id'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          headers:
            ETag:
              schema:
                type: string
              description: Quoted decimal version of this response; replay may be historical.
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
