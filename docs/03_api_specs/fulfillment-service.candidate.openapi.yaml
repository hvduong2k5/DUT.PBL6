components:
  securitySchemes:
    StaffBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Verified staff JWT with dedicated Fulfillment audience, permissions and warehouse scopes. Arbitrary
        public identity headers are rejected.
  parameters:
    task_id:
      name: task_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    allocation_id:
      name: allocation_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    block_id:
      name: block_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    file_id:
      name: file_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    item_code:
      name: item_code
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 80
    key:
      name: key
      in: path
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: ^[!-~]+$
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: ^[!-~]+$
      description: Stable original caller/action/order scoped key; preserve payload and expected version on retry.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
      example: '"7"'
      description: Strong quoted decimal task version. Replay returns original receipt before checking current version;
        current authorization remains required.
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
          format: uuid
        retryable:
          type: boolean
        details:
          type: object
          additionalProperties: true
      required:
      - code
      - message
      - request_id
      - retryable
      example:
        code: CHECKLIST_INCOMPLETE
        message: Checklist bat buoc chua dat.
        request_id: 00000013-0013-4013-8013-000000000013
        retryable: false
        details:
          missing_items:
          - QUANTITY_MATCH
    Integration:
      type: object
      additionalProperties: false
      properties:
        order_source:
          type: string
          enum:
          - PENDING
          - ACKNOWLEDGED
          - DEFERRED
          - MANUAL_REVIEW
        shipping:
          type: string
          enum:
          - PENDING
          - ACKNOWLEDGED
          - DEFERRED
          - MANUAL_REVIEW
      required:
      - order_source
      - shipping
    Parcel:
      type: object
      additionalProperties: false
      properties:
        weight_grams:
          type: integer
          minimum: 1
          maximum: 2147483647
        length_cm:
          type: integer
          minimum: 1
          maximum: 2147483647
        width_cm:
          type: integer
          minimum: 1
          maximum: 2147483647
        height_cm:
          type: integer
          minimum: 1
          maximum: 2147483647
        fragile:
          type: boolean
      required:
      - weight_grams
      - length_cm
      - width_cm
      - height_cm
      - fragile
    TaskSummary:
      type: object
      additionalProperties: false
      properties:
        task_id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        workflow_state:
          type: string
          enum:
          - READY
          - ASSIGNED
          - IN_PROGRESS
          - BLOCKED
          - COMPLETED
        version:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        ready_generation:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        warehouse_id:
          type: string
          minLength: 1
        assignee_id:
          type: string
          format: uuid
          nullable: true
        packing_due_at:
          type: string
          format: date-time
          nullable: true
        admitted_at:
          type: string
          format: date-time
        integration:
          $ref: '#/components/schemas/Integration'
        channel:
