      - key
  /api/v1/admin/fulfillment/tasks/{task_id}/history:
    get:
      operationId: ListPackingTaskHistory
      tags:
      - Fulfillment
      summary: ListPackingTaskHistory
      description: Warehouse-scoped redacted append-only task history, keyset ordered by task_version. No raw media
        URL, customer PII or internal approval token.
      x-permissions: fulfillment.task.read_history
      parameters:
