openapi: "3.1.0"
info:
  title: "Customer Web API - Stable"
  version: "1.0.0"
  description: "Implementation-ready contract for Guest, Registered Customer, and verified B2B Customer journeys. Marketplace and Offline are channels, not web login roles."
  license:
    name: "Proprietary"
    identifier: "LicenseRef-Proprietary"
servers:
  -
    url: "https://api.omama.vn"
    description: "Production API gateway"
tags:
  -
    name: "Authentication"
    description: "Authentication operations for the customer web application."
  -
    name: "B2B"
    description: "B2B operations for the customer web application."
  -
    name: "Cart"
    description: "Cart operations for the customer web application."
  -
    name: "Catalog"
    description: "Catalog operations for the customer web application."
  -
    name: "Checkout"
    description: "Checkout operations for the customer web application."
  -
    name: "Customer capabilities"
    description: "Customer capabilities operations for the customer web application."
  -
    name: "Locations"
    description: "Locations operations for the customer web application."
  -
    name: "Loyalty"
    description: "Loyalty operations for the customer web application."
  -
    name: "Orders"
    description: "Orders operations for the customer web application."
  -
    name: "Payments"
    description: "Payments operations for the customer web application."
  -
    name: "Customer profile"
    description: "Customer profile operations for the customer web application."
  -
    name: "Promotions"
    description: "Promotions operations for the customer web application."
  -
    name: "After-sales"
    description: "After-sales operations for the customer web application."
  -
    name: "Reviews"
    description: "Reviews operations for the customer web application."
  -
    name: "Customer support"
    description: "Customer support operations for the customer web application."
  -
    name: "Traceability"
    description: "Traceability operations for the customer web application."
  -
    name: "Partner webhooks"
    description: "Partner webhooks operations for the customer web application."
paths:
  "/api/v1/auth/login":
    post:
      tags:
        - "Authentication"
      operationId: "postAuthLogin"
      summary: "Đăng nhập hệ thống bằng Số điện thoại & Mật khẩu"
      x-lifecycle: "stable"
      x-backlog:
        - "EPIC_01"
      x-ui-states:
        - "loading"
        - "success"
        - "error"
        - "unauthorized"
        - "forbidden"
      x-test-latency-ms: 1200
      security: []
      responses:
        "200":
          description: "Successful response."
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "user"
                  - "tokens"
                properties:
                  user:
                    type: "object"
                    required:
                      - "customer_id"
                      - "phone_number"
                      - "full_name"
                      - "email"
                      - "avatar_url"
                      - "membership_tier"
                      - "loyalty_points"
                    properties:
                      customer_id:
                        type: "string"
                      phone_number:
                        type: "string"
                      full_name:
                        type: "string"
                      email:
                        type: "string"
                        format: "email"
                      avatar_url:
                        type: "string"
                        format: "uri"
                      membership_tier:
                        type: "string"
                      loyalty_points:
                        type: "integer"
                    additionalProperties: false
                  tokens:
                    type: "object"
                    required:
                      - "access_token"
                      - "refresh_token"
                      - "token_type"
                      - "expires_in"
                    properties:
                      access_token:
                        type: "string"
                      refresh_token:
                        type: "string"
                      token_type:
                        type: "string"
                      expires_in:
                        type: "integer"
                    additionalProperties: false
                additionalProperties: false
              examples:
                success:
                  summary: "Successful response"
                  value:
                    user:
                      customer_id: "CUST-8820"
                      phone_number: "0905123456"
                      full_name: "Nguyễn Văn An"
                      email: "an.nguyen@example.com"
                      avatar_url: "https://cdn.omama.vn/avatars/u8820.jpg"
                      membership_tier: "{{oneOf 'BRONZE' 'SILVER' 'GOLD' 'DIAMOND'}}"
                      loyalty_points: 450
                    tokens:
                      access_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      refresh_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      token_type: "Bearer"
                      expires_in: 900
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              required:
                - "identifier"
                - "password"
              properties:
                identifier:
                  type: "string"
                password:
                  type: "string"
              additionalProperties: false
            example:
              identifier: "0905123456"
              password: "StrongPass!123"
      parameters:
        -
          $ref: "#/components/parameters/IdempotencyKey"
  "/api/v1/auth/logout":
    post:
      tags:
        - "Authentication"
      operationId: "postAuthLogout"
      summary: "Đăng xuất và thu hồi phiên làm việc"
      x-lifecycle: "stable"
      x-backlog:
        - "EPIC_01"
      x-ui-states:
        - "loading"
        - "success"
        - "error"
        - "unauthorized"
        - "forbidden"
      x-test-latency-ms: 1200
      security:
        -
          bearerAuth: []
        -
          customerSession: []
      responses:
        "200":
          description: "Successful response."
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "success"
                  - "message"
                properties:
                  success:
                    type: "boolean"
                  message:
                    type: "string"
                additionalProperties: false
              examples:
                success:
                  summary: "Successful response"
                  value:
                    success: true
                    message: "Đăng xuất thành công."
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      parameters:
        -
          $ref: "#/components/parameters/IdempotencyKey"
  "/api/v1/auth/me":
    get:
      tags:
        - "Authentication"
      operationId: "getAuthMe"
      summary: "Lấy thông tin danh tính tài khoản đang đăng nhập"
      x-lifecycle: "stable"
      x-backlog:
        - "EPIC_01"
      x-ui-states:
        - "loading"
        - "success"
        - "error"
        - "unauthorized"
        - "forbidden"
      x-test-latency-ms: 1200
      security:
        -
          bearerAuth: []
        -
          customerSession: []
      responses:
        "200":
          description: "Successful response."
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "customer_id"
                  - "phone_number"
                  - "full_name"
                  - "email"
                  - "avatar_url"
                  - "membership_tier"
                  - "loyalty_points"
                properties:
                  customer_id:
                    type: "string"
                  phone_number:
                    type: "string"
                  full_name:
                    type: "string"
                  email:
                    type: "string"
                    format: "email"
                  avatar_url:
                    type: "string"
                    format: "uri"
                  membership_tier:
                    type: "string"
                  loyalty_points:
                    type: "integer"
                additionalProperties: false
              examples:
                success:
                  summary: "Successful response"
                  value:
                    customer_id: "CUST-8820"
                    phone_number: "0905123456"
                    full_name: "Nguyễn Văn An"
                    email: "an.nguyen@example.com"
                    avatar_url: "https://cdn.omama.vn/avatars/u8820.jpg"
                    membership_tier: "{{oneOf 'BRONZE' 'SILVER' 'GOLD' 'DIAMOND'}}"
                    loyalty_points: 450
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  "/api/v1/auth/recovery-requests":
    post:
      tags:
        - "Authentication"
      operationId: "postAuthRecoveryRequests"
      summary: "AUTH-C07/C10 — Request or resend a neutral password-recovery email response."
      x-lifecycle: "stable"
      x-backlog:
        - "EPIC_01"
      x-ui-states:
        - "loading"
        - "success"
        - "error"
        - "unauthorized"
        - "forbidden"
      x-test-latency-ms: 1200
      security: []
      responses:
        "202":
          description: "Successful response."
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "accepted"
                  - "messageCode"
                properties:
                  accepted:
                    type: "boolean"
                  messageCode:
                    type: "string"
                additionalProperties: false
              examples:
                success:
                  summary: "Successful response"
                  value:
                    accepted: true
                    messageCode: "RECOVERY_REQUEST_ACCEPTED"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              required:
                - "email"
              properties:
                email:
                  type: "string"
                  format: "email"
              additionalProperties: false
            example:
              email: "an@example.com"
      parameters:
        -
          $ref: "#/components/parameters/IdempotencyKey"
  "/api/v1/auth/recovery-requests/reset":
    post:
      tags:
        - "Authentication"
      operationId: "postAuthRecoveryRequestsReset"
      summary: "AUTH-C09 — Reset password, revoke all sessions, and require normal login."
      x-lifecycle: "stable"
      x-backlog:
        - "EPIC_01"
      x-ui-states:
        - "loading"
        - "success"
        - "error"
        - "unauthorized"
        - "forbidden"
      x-test-latency-ms: 1200
      security: []
      responses:
        "204":
          description: "Completed successfully; no response body."
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              required:
                - "resetProof"
                - "newPassword"
              properties:
                resetProof:
                  type: "string"
                newPassword:
                  type: "string"
              additionalProperties: false
            example:
              resetProof: "reset-proof"
              newPassword: "NewStrongPass!123"
      parameters:
        -
          $ref: "#/components/parameters/IdempotencyKey"
  "/api/v1/auth/recovery-requests/verify":
    post:
      tags:
        - "Authentication"
      operationId: "postAuthRecoveryRequestsVerify"
      summary: "AUTH-C08 — Exchange a password-recovery magic-link token for a restricted reset proof."
      x-lifecycle: "stable"
      x-backlog:
        - "EPIC_01"
      x-ui-states:
        - "loading"
        - "success"
        - "error"
        - "unauthorized"
        - "forbidden"
      x-test-latency-ms: 1200
      security: []
      responses:
        "200":
          description: "Successful response."
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "verified"
                  - "resetProof"
                  - "expiresAt"
                properties:
                  verified:
                    type: "boolean"
                  resetProof:
                    type: "string"
                  expiresAt:
                    type: "string"
                additionalProperties: false
              examples:
                success:
                  summary: "Successful response"
                  value:
                    verified: true
                    resetProof: "mock-reset-proof-valid"
                    expiresAt: "{{dateTimeShift minutes=5}}"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              required:
                - "recoveryToken"
              properties:
                recoveryToken:
                  type: "string"
              additionalProperties: false
            example:
              recoveryToken: "recovery-token"
      parameters:
        -
          $ref: "#/components/parameters/IdempotencyKey"
  "/api/v1/auth/refresh":
    post:
      tags:
        - "Authentication"
      operationId: "postAuthRefresh"
      summary: "Cấp mới Access Token bằng Refresh Token"
      x-lifecycle: "stable"
      x-backlog:
        - "EPIC_01"
      x-ui-states:
        - "loading"
        - "success"
        - "error"
        - "unauthorized"
        - "forbidden"
      x-test-latency-ms: 1200
      security:
        -
          bearerAuth: []
        -
          customerSession: []
      responses:
        "200":
          description: "Successful response."
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "access_token"
                  - "refresh_token"
                  - "token_type"
                  - "expires_in"
                properties:
                  access_token:
                    type: "string"
                  refresh_token:
                    type: "string"
                  token_type:
                    type: "string"
                  expires_in:
                    type: "integer"
                additionalProperties: false
              examples:
                success:
                  summary: "Successful response"
                  value:
                    access_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                    refresh_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                    token_type: "Bearer"
                    expires_in: 900
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              required:
                - "refresh_token"
              properties:
                refresh_token:
                  type: "string"
              additionalProperties: false
            example:
              refresh_token: "opaque-refresh-token"
      parameters:
        -
          $ref: "#/components/parameters/IdempotencyKey"
  "/api/v1/auth/register":
    post:
      tags:
        - "Authentication"
      operationId: "postAuthRegister"
      summary: "Đăng ký tài khoản khách hàng cá nhân (D2C)"
      x-lifecycle: "stable"
      x-backlog:
        - "EPIC_01"
      x-ui-states:
        - "loading"
        - "success"
        - "error"
        - "unauthorized"
        - "forbidden"
      x-test-latency-ms: 1200
      security: []
      responses:
        "201":
          description: "Successful response."
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "user"
                  - "tokens"
                properties:
                  user:
                    type: "object"
                    required:
                      - "customer_id"
                      - "phone_number"
                      - "full_name"
                      - "email"
                      - "avatar_url"
                      - "membership_tier"
                      - "loyalty_points"
                    properties:
                      customer_id:
                        type: "string"
                      phone_number:
                        type: "string"
                      full_name:
                        type: "string"
                      email:
                        type: "string"
                        format: "email"
                      avatar_url:
                        type: "string"
                        format: "uri"
                      membership_tier:
                        type: "string"
                      loyalty_points:
                        type: "integer"
                    additionalProperties: false
                  tokens:
                    type: "object"
                    required:
                      - "access_token"
                      - "refresh_token"
                      - "token_type"
                      - "expires_in"
                    properties:
                      access_token:
                        type: "string"
                      refresh_token:
                        type: "string"
                      token_type:
                        type: "string"
                      expires_in:
                        type: "integer"
                    additionalProperties: false
                additionalProperties: false
              examples:
                success:
                  summary: "Successful response"
                  value:
                    user:
                      customer_id: "CUST-8820"
                      phone_number: "0905123456"
                      full_name: "Nguyễn Văn An"
                      email: "an.nguyen@example.com"
                      avatar_url: "https://cdn.omama.vn/avatars/u8820.jpg"
                      membership_tier: "{{oneOf 'BRONZE' 'SILVER' 'GOLD' 'DIAMOND'}}"
                      loyalty_points: 450
                    tokens:
                      access_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      refresh_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      token_type: "Bearer"
                      expires_in: 900
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              required:
                - "phone_number"
                - "full_name"
                - "email"
                - "password"
              properties:
                phone_number:
                  type: "string"
                full_name:
                  type: "string"
                email:
                  type: "string"
                  format: "email"
                password:
                  type: "string"
              additionalProperties: false
            example:
              phone_number: "0905123456"
              full_name: "Nguyen Van An"
              email: "an@example.com"
              password: "StrongPass!123"
      parameters:
        -
          $ref: "#/components/parameters/IdempotencyKey"
  "/api/v1/b2b/context":
    get:
      tags:
        - "B2B"
      operationId: "getB2bContext"
      summary: "Verified B2B organization, quote-request form options and recent customer-owned requests."
      x-lifecycle: "stable"
      x-backlog:
        - "EPIC_18"
      x-ui-states:
        - "loading"
        - "success"
        - "error"
        - "unauthorized"
        - "forbidden"
      x-test-latency-ms: 1200
      security:
        -
          bearerAuth: []
        -
          customerSession: []
      responses:
        "200":
          description: "Successful response."
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "organization"
                  - "deliveryProvinces"
                  - "catalog"
                  - "recentRequests"
                  - "discountTiers"
                  - "attachmentPolicy"
                properties:
                  organization:
                    type: "object"
                    required:
                      - "organizationId"
                      - "legalName"
                      - "taxCode"
                      - "representativeName"
                      - "representativeTitle"
                      - "phone"
                      - "email"
                      - "invoiceAddress"
                      - "verificationStatus"
                    properties:
                      organizationId:
                        type: "string"
                      legalName:
                        type: "string"
                      taxCode:
                        type: "string"
                      representativeName:
                        type: "string"
                      representativeTitle:
                        type: "string"
                      phone:
                        type: "string"
                      email:
                        type: "string"
                        format: "email"
                      invoiceAddress:
                        type: "string"
                      verificationStatus:
                        type: "string"
                    additionalProperties: false
                  deliveryProvinces:
                    type: "array"
                    items:
                      type: "object"
                      required:
                        - "provinceCode"
                        - "provinceName"
                      properties:
                        provinceCode:
                          type: "string"
                        provinceName:
                          type: "string"
                      additionalProperties: false
                  catalog:
                    type: "array"
                    items:
                      type: "object"
                      required:
                        - "skuId"
                        - "name"
                        - "variant"
                        - "unitPriceVnd"
                        - "minimumQuantity"
                      properties:
                        skuId:
                          type: "string"
                        name:
                          type: "string"
                        variant:
                          type: "string"
                        unitPriceVnd:
                          type: "integer"
                        minimumQuantity:
                          type: "integer"
                      additionalProperties: false
                  recentRequests:
                    type: "array"
                    items:
                      type: "object"
                      required:
                        - "requestId"
                        - "requestNumber"
                        - "status"
                        - "statusLabel"
                        - "submittedAt"
                        - "totalQuantity"
                        - "purposeLabel"
                      properties:
                        requestId:
                          type: "string"
                        requestNumber:
                          type: "string"
                        status:
                          type: "string"
                        statusLabel:
                          type: "string"
                        submittedAt:
                          type: "string"
                          format: "date-time"
                        totalQuantity:
                          type: "integer"
                        purposeLabel:
                          type: "string"
                        quoteId:
                          type: "string"
                      additionalProperties: false
                  discountTiers:
                    type: "array"
                    items:
                      type: "object"
                      required:
                        - "minimumQuantity"
                        - "discountPercent"
                        - "label"
                      properties:
                        minimumQuantity:
                          type: "integer"
                        maximumQuantity:
                          type: "integer"
                        discountPercent:
                          type: "integer"
                        label:
                          type: "string"
                      additionalProperties: false
                  attachmentPolicy:
                    type: "object"
                    required:
                      - "allowedMediaTypes"
                      - "maxFiles"
                      - "maxBytesPerFile"
                    properties:
                      allowedMediaTypes:
                        type: "array"
                        items:
                          type: "string"
                      maxFiles:
                        type: "integer"
                      maxBytesPerFile:
                        type: "integer"
                    additionalProperties: false
                additionalProperties: false
              examples:
                success:
                  summary: "Successful response"
                  value:
                    organization:
                      organizationId: "org-fpt-central"
                      legalName: "Tập đoàn Công nghệ & Tài chính FPT - Chi nhánh Miền Trung"
                      taxCode: "0101248141"
                      representativeName: "Bà Trần Hoàng Uyên Thư"
                      representativeTitle: "Trưởng phòng Đối ngoại"
