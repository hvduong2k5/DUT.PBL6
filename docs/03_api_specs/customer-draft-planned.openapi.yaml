        "500": {$ref: "#/components/responses/InternalError"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
components:
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
    customerSession:
      type: "apiKey"
      in: "cookie"
      name: "customer_session"
    guestSession:
      type: "apiKey"
      in: "cookie"
      name: "guest_session"
  parameters:
    IdempotencyKey:
      name: "Idempotency-Key"
      in: "header"
      required: false
      description: "Required for retryable create/action operations. Same key and same payload must return the same outcome."
      schema:
        type: "string"
        format: "uuid"
    GuestConversationToken:
      name: "X-Guest-Conversation-Token"
      in: "header"
      required: false
      description: "Conditionally required for every operation on a guest-owned conversation."
      schema:
        type: "string"
        minLength: 32
    RequiredIdempotencyKey:
      name: "Idempotency-Key"
      in: "header"
      required: true
      description: "Required UUID retry key; same key and same operation preserve the original outcome."
      schema:
        type: "string"
        format: "uuid"
  schemas:
    AiConversationCreated:
      type: "object"
      required: ["conversation_id", "owner_type", "expires_at", "guest_token"]
      properties:
        conversation_id: {type: "string"}
        owner_type: {type: "string", enum: ["guest", "customer"]}
        expires_at: {type: "string", format: "date-time"}
        guest_token:
          type: ["string", "null"]
          description: "Returned once for a guest conversation; null for a customer conversation."
      additionalProperties: false
    AiConversation:
      type: "object"
      required: ["conversation_id", "owner_type", "slots", "messages"]
      properties:
        conversation_id: {type: "string"}
        owner_type: {type: "string", enum: ["guest", "customer"]}
        slots: {type: "object", additionalProperties: true}
        messages:
          type: "array"
          items:
            type: "object"
            required: ["role", "content"]
            properties:
              role: {type: "string", enum: ["user", "assistant", "system"]}
              content: {type: "string"}
            additionalProperties: false
      additionalProperties: false
    AiProduct:
      type: "object"
      required: ["id", "sku", "name", "price_vnd", "description"]
      properties:
        id: {type: "string"}
        sku: {type: "string"}
        name: {type: "string"}
        price_vnd: {type: "integer", minimum: 0}
        description: {type: "string"}
      additionalProperties: false
    AiConsent:
      type: "object"
      required: ["history_use"]
      properties:
        history_use: {type: "boolean"}
      additionalProperties: false
    Error:
      type: "object"
      required:
        - "code"
        - "message"
        - "requestId"
      properties:
        code:
          type: "string"
          description: "Stable machine-readable error code."
        message:
          type: "string"
          description: "Safe user-facing message in Vietnamese or the negotiated locale."
        requestId:
          type: "string"
          description: "Correlation identifier for support and logs."
        errors:
          type: "array"
          items:
            type: "object"
            required:
              - "field"
              - "code"
              - "message"
            properties:
              field:
                type: "string"
              code:
                type: "string"
              message:
                type: "string"
            additionalProperties: false
        retryAfterSeconds:
          type: "integer"
          minimum: 1
        details:
          type: "object"
          additionalProperties: true
      additionalProperties: false
  responses:
    BadRequest:
      description: "Malformed request or invalid query parameters."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: "BAD_REQUEST"
            message: "Malformed request or invalid query parameters."
            requestId: "req-01J9YAJ6CX8G5E0K7M8N9PQRST"
            errors: []
    Unauthorized:
      description: "Authentication is missing, invalid, or expired."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: "AUTHENTICATION_REQUIRED"
            message: "Authentication is missing, invalid, or expired."
            requestId: "req-01J9YAJ6CX8G5E0K7M8N9PQRST"
            errors: []
    Forbidden:
      description: "Authenticated actor lacks the required permission, capability, ownership, or data scope."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: "FORBIDDEN"
            message: "Authenticated actor lacks the required permission, capability, ownership, or data scope."
            requestId: "req-01J9YAJ6CX8G5E0K7M8N9PQRST"
            errors: []
    NotFound:
      description: "Resource does not exist or is intentionally hidden outside the actor scope."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: "RESOURCE_NOT_FOUND"
            message: "Resource does not exist or is intentionally hidden outside the actor scope."
            requestId: "req-01J9YAJ6CX8G5E0K7M8N9PQRST"
            errors: []
    Conflict:
      description: "State transition, revision, idempotency key, or unique value conflicts with current state."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: "STATE_CONFLICT"
            message: "State transition, revision, idempotency key, or unique value conflicts with current state."
            requestId: "req-01J9YAJ6CX8G5E0K7M8N9PQRST"
            errors: []
    Gone:
      description: "Token, challenge, grant, or temporary resource has expired."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: "RESOURCE_EXPIRED"
            message: "Token, challenge, grant, or temporary resource has expired."
            requestId: "req-01J9YAJ6CX8G5E0K7M8N9PQRST"
            errors: []
    UnprocessableEntity:
      description: "Payload is syntactically valid but violates field or business validation rules."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: "VALIDATION_FAILED"
            message: "Payload is syntactically valid but violates field or business validation rules."
            requestId: "req-01J9YAJ6CX8G5E0K7M8N9PQRST"
            errors: []
    TooManyRequests:
      description: "Rate limit exceeded."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: "RATE_LIMITED"
            message: "Rate limit exceeded."
            requestId: "req-01J9YAJ6CX8G5E0K7M8N9PQRST"
            errors: []
    InternalError:
      description: "Unexpected server error."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: "INTERNAL_SERVER_ERROR"
            message: "Unexpected server error."
            requestId: "req-01J9YAJ6CX8G5E0K7M8N9PQRST"
            errors: []
    ServiceUnavailable:
      description: "A required service is temporarily unavailable."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: "SERVICE_UNAVAILABLE"
            message: "A required service is temporarily unavailable."
            requestId: "req-01J9YAJ6CX8G5E0K7M8N9PQRST"
            errors: []
