      operationId: postAdminIamPrincipalsPrincipalIdSyncPermissions
      summary: Chạy lại đồng bộ quyền Identity → Keycloak
      description: |
        Đường đối soát khi lần đồng bộ trước thất bại (audit `IAM_PERMISSION_SYNC_FAILED`).
        Hệ thống tính lại quyền từ DB IAM và ghi đè user attribute `permissions` trên Keycloak.
        `forceRelogin=true` thu hồi phiên Keycloak và xóa phiên BFF sau khi đồng bộ.
        Token đã phát không thể sửa; thay đổi chỉ áp dụng cho token phát sau lần refresh kế tiếp.
