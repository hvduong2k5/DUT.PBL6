openapi: 3.1.0
info:
  title: Internal Employee Web API - Stable
  version: 1.1.0
  description: Implementation-ready contract for employee sessions, permission-scoped
    management views, and approved workbench operations. Authorization MUST use effective
    permissions and data scopes; role names alone are insufficient. The provisional
    staff JWT and IAM read producer handoff is documented separately in
    iam-consumer-read.openapi.yaml and admin-draft-planned.openapi.yaml; it does
    not assert that producer tasks 1-2 are deployed. Existing UI response schemas
    below remain unchanged; Order uses an adapter for its direct backend projection.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.omama.vn
  description: Production API gateway
tags:
- name: Access management
  description: Access management operations for the admin web application.
- name: B2B
  description: B2B operations for the admin web application.
- name: Product management
  description: Product management operations for the admin web application.
- name: Inventory
  description: Inventory operations for the admin web application.
- name: Orders
  description: Orders operations for the admin web application.
- name: Packing
  description: Packing operations for the admin web application.
- name: Payments
  description: Payments operations for the admin web application.
- name: After-sales
  description: After-sales operations for the admin web application.
- name: Session
  description: Session operations for the admin web application.
- name: Shipping
  description: Shipping operations for the admin web application.
- name: Customer support
  description: Customer support operations for the admin web application.
security:
- bearerAuth: []
- adminSession: []
paths:
  /api/v1/admin/users:
    get:
      operationId: getAdminUsers
      summary: Lấy danh sách người dùng phân trang (Admin)
      description: Truy vấn danh sách người dùng kèm bộ lọc loại tài khoản (CUSTOMER,
        EMPLOYEE) và trạng thái (ACTIVE, SUSPENDED). Chỉ ADMIN.
      tags:
      - Access management
      x-backlog:
      - EPIC_22
      x-lifecycle: stable
      x-ui-states:
      - loading
      - empty
      - success
      - error
      parameters:
      - in: query
        name: type
        schema:
          type: string
          enum:
          - CUSTOMER
          - EMPLOYEE
        description: Loại tài khoản
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
        description: Trạng thái tài khoản
      - in: query
        name: roleId
        required: false
        schema:
          type: string
          format: uuid
        description: Lọc người dùng có vai trò theo ID vai trò
      - in: query
        name: roleCode
        required: false
        schema:
          type: string
        description: Lọc người dùng có vai trò theo mã vai trò (ví dụ ADMIN, STORE_MANAGER)
      - in: query
        name: scopeType
        required: false
        schema:
          type: string
          enum:
          - GLOBAL
          - WAREHOUSE
          - STORE
        description: Lọc người dùng theo loại phạm vi vai trò
      - in: query
        name: scopeId
        required: false
        schema:
          type: string
        description: Lọc người dùng theo mã phạm vi vai trò
      - in: query
        name: search
        required: false
        schema:
          type: string
        description: Tìm kiếm theo từ khóa (email, họ tên, hoặc UUID người dùng)
      - in: query
        name: page
        schema:
          type: integer
          default: 0
        description: Số trang
      - in: query
        name: size
        schema:
          type: integer
          default: 20
        description: Kích thước trang
      responses:
        '200':
          description: Danh sách người dùng phân trang
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      type: object
                      properties:
                        principalId:
                          type: string
                          format: uuid
                        idpSubject:
                          type: string
                        email:
                          type: string
                          format: email
                        firstName:
                          type: string
                        lastName:
                          type: string
                        principalType:
                          type: string
                          enum:
                          - CUSTOMER
                          - EMPLOYEE
                        provisioningStatus:
                          type: string
                          enum:
                          - ACTIVE
                          - SUSPENDED
                          - PENDING_INVITE
                        createdAt:
                          type: string
                          format: date-time
                        roles:
                          type: array
                          items:
                            type: string
                  page:
                    type: integer
                  size:
                    type: integer
                  totalElements:
                    type: integer
                  totalPages:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/admin/users/{principalId}:
    get:
      operationId: getAdminUsersPrincipalId
      summary: Xem chi tiết hồ sơ người dùng (Admin)
      description: Truy vấn chi tiết người dùng kèm thông tin định danh, các vai trò
        và quyền hạn thực tế. Chỉ ADMIN.
      tags:
      - Access management
      x-backlog:
      - EPIC_22
      x-lifecycle: stable
      x-ui-states:
      - loading
      - success
      - error
      parameters:
      - in: path
        name: principalId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Chi tiết hồ sơ người dùng
          content:
            application/json:
              schema:
                type: object
                properties:
                  principalId:
                    type: string
                    format: uuid
                  idpSubject:
                    type: string
                  email:
                    type: string
                    format: email
                  firstName:
                    type: string
                  lastName:
                    type: string
                  principalType:
                    type: string
                    enum:
                    - CUSTOMER
                    - EMPLOYEE
                  provisioningStatus:
                    type: string
                    enum:
                    - ACTIVE
                    - SUSPENDED
                    - PENDING_INVITE
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                  roles:
                    type: array
                    items:
                      type: object
                      properties:
                        assignmentId:
                          type: string
                          format: uuid
                        roleId:
                          type: string
                          format: uuid
                        roleCode:
                          type: string
                        roleName:
                          type: string
                        scopeType:
                          type: string
                          enum:
                          - GLOBAL
                          - WAREHOUSE
                          - STORE
                        scopeId:
                          type:
                          - string
                          - 'null'
                        assignmentStatus:
                          type: string
                          enum:
                          - ACTIVE
                          - REVOKED
                          - EXPIRED
                        validFrom:
                          type: string
                          format: date-time
                        validUntil:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        assignedByPrincipalId:
                          type:
                          - string
                          - 'null'
                          format: uuid
                        reason:
                          type:
                          - string
                          - 'null'
                        createdAt:
                          type: string
                          format: date-time
                  permissions:
                    type: array
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/admin/users/{principalId}/password/reset:
    post:
      operationId: postAdminUsersPrincipalIdPasswordReset
      summary: Đặt lại mật khẩu cho người dùng (Admin)
      description: ADMIN đặt lại mật khẩu mới cho người dùng trên Keycloak IDP.
      tags:
      - Access management
      x-backlog:
      - EPIC_22
      x-lifecycle: stable
      x-ui-states:
      - loading
      - success
      - error
      parameters:
      - in: path
        name: principalId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - newPassword
              properties:
                newPassword:
                  type: string
                  minLength: 8
                  description: Mật khẩu mới
                temporary:
                  type: boolean
                  default: false
                  description: Yêu cầu đổi mật khẩu ở lần đăng nhập tiếp theo
      responses:
        '200':
          description: Đặt lại mật khẩu thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Mật khẩu đã được đặt lại thành công
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/admin/users/{principalId}/sessions/revoke:
    post:
      operationId: postAdminUsersPrincipalIdSessionsRevoke
      summary: Thu hồi toàn bộ phiên đăng nhập của người dùng (Admin)
      description: ADMIN buộc người dùng đăng xuất ngay lập tức khỏi hệ thống
        (force logout).
      tags:
      - Access management
      x-backlog:
      - EPIC_22
      x-lifecycle: stable
      x-ui-states:
      - loading
      - success
      - error
      parameters:
      - in: path
        name: principalId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Thu hồi phiên đăng nhập thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Đã thu hồi toàn bộ phiên đăng nhập
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/admin/users/{principalId}/status:
    patch:
      tags: &id001
      - Access management
      operationId: patchAdminUsersPrincipalIdStatus
      summary: Cập nhật trạng thái người dùng (Admin) [Chuẩn RESTful 3.3.1 PATCH]
      x-lifecycle: stable
      x-backlog: &id002
      - EPIC_22
      x-ui-states: &id003
      - loading
      - success
      - error
      parameters: &id004
      - name: principalId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody: &id005
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - status
              properties:
                status:
                  type: string
                  enum:
                  - ACTIVE
                  - SUSPENDED
                reason:
                  type: string
      responses: &id006
        '200':
          description: Status updated successfully.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      tags: *id001
      operationId: putAdminUsersPrincipalIdStatus
      summary: Cập nhật trạng thái người dùng (ACTIVE, SUSPENDED)
      x-lifecycle: stable
      x-backlog: *id002
      x-ui-states: *id003
      parameters: *id004
      requestBody: *id005
      responses: *id006
  /api/v1/admin/employee-invitations:
    post:
      tags:
      - Access management
      operationId: postAdminEmployeeInvitations
      summary: Tạo thư mời nhân viên mới kèm mã kích hoạt
      x-lifecycle: stable
      x-backlog:
      - EPIC_22
      x-ui-states:
      - loading
      - success
      - error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
                roles:
                  type: array
                  items:
                    type: string
                temporaryPassword:
                  type: string
      responses:
        '201':
          description: Invitation created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  invitationId:
                    type: string
                    format: uuid
                  email:
                    type: string
                  token:
                    type: string
                  expiresAt:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/admin/employee-invitations/{invitationId}:
    get:
      tags:
      - Access management
      operationId: getAdminEmployeeInvitationsInvitationId
      summary: Xem chi tiết thư mời nhân viên
      x-lifecycle: stable
      x-backlog:
      - EPIC_22
      parameters:
      - name: invitationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Invitation details.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      tags:
      - Access management
      operationId: deleteAdminEmployeeInvitationsInvitationId
      summary: Thu hồi thư mời nhân viên
      x-lifecycle: stable
      x-backlog:
      - EPIC_22
      parameters:
      - name: invitationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Invitation revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/admin/role-assignments:
    get:
      tags:
      - Access management
      operationId: getAdminRoleAssignments
      summary: Liệt kê danh sách bản ghi gán vai trò
      description: Truy vấn danh sách gán vai trò với bộ lọc tùy chọn. Trả về 200 với mảng rỗng nếu không có bản ghi khớp.
      x-lifecycle: stable
      x-backlog:
      - EPIC_22
      parameters:
      - name: principalId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: roleId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: roleCode
        in: query
        required: false
        schema:
          type: string
        description: Lọc theo mã vai trò
      - name: scopeType
        in: query
        required: false
        schema:
          type: string
          enum:
          - GLOBAL
          - WAREHOUSE
          - STORE
      - name: scopeId
        in: query
        required: false
        schema:
          type: string
        description: Lọc theo mã phạm vi vai trò
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - ACTIVE
          - REVOKED
          - EXPIRED
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          default: 20
      responses:
        '200':
          description: Role assignment list (empty array when no match).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        assignmentId:
                          type: string
                          format: uuid
                        principalId:
                          type: string
                          format: uuid
                        roleId:
                          type: string
                          format: uuid
                        scopeType:
                          type: string
                        scopeId:
                          type:
                          - string
                          - 'null'
                        assignmentStatus:
                          type: string
                        assignedByPrincipalId:
                          type:
                          - string
                          - 'null'
                          format: uuid
                        reason:
                          type:
                          - string
                          - 'null'
                        validFrom:
                          type: string
                          format: date-time
                        validUntil:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        createdAt:
                          type: string
                          format: date-time
                        updatedAt:
                          type: string
                          format: date-time
                        version:
                          type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags:
      - Access management
      operationId: postAdminRoleAssignments
      summary: Gán vai trò có phạm vi cho nhân viên
      description: Gán vai trò đang hoạt động (is_enabled=true) cho nhân viên (EMPLOYEE). Chặn tự gán vai trò cho chính mình (Self-assign forbidden).
      x-lifecycle: stable
      x-backlog:
      - EPIC_22
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - principalId
              - roleId
              - scopeType
              properties:
                principalId:
                  type: string
                  format: uuid
                roleId:
                  type: string
                  format: uuid
                scopeType:
                  type: string
                  enum:
                  - GLOBAL
                  - WAREHOUSE
                  - STORE
                scopeId:
                  type:
                  - string
                  - 'null'
                validFrom:
                  type:
                  - string
                  - 'null'
                  format: date-time
                validUntil:
                  type:
                  - string
                  - 'null'
                  format: date-time
                reason:
                  type:
                  - string
                  - 'null'
      responses:
        '200':
          description: Role assigned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: string
                    format: uuid
        '201':
          description: Role assigned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  assignmentId:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/admin/role-assignments/{assignmentId}:
    patch:
      tags:
      - Access management
      operationId: patchAdminRoleAssignmentsAssignmentId
      summary: Cập nhật thông tin phân công vai trò
      description: Cập nhật thời hạn hết hạn (validUntil) hoặc lý do phân công vai trò. Chặn thay đổi vai trò hoặc phạm vi trực tiếp (phải qua quy trình thu hồi và gán mới).
      x-lifecycle: stable
      x-backlog:
      - EPIC_22
      parameters:
      - name: assignmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                validUntil:
                  type:
                  - string
                  - 'null'
                  format: date-time
                clearValidUntil:
                  type: boolean
                  description: Đặt thành true nếu muốn xóa thời hạn kết thúc (vô thời hạn)
                reason:
                  type:
                  - string
                  - 'null'
                expectedVersion:
                  type: integer
                  description: Phiên bản kỳ vọng cho optimistic locking
      responses:
        '200':
          description: Phân công vai trò đã được cập nhật
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      assignmentId:
                        type: string
                        format: uuid
                      principalId:
                        type: string
                        format: uuid
                      roleId:
                        type: string
                        format: uuid
                      roleCode:
                        type: string
                      scopeType:
                        type: string
                      scopeId:
                        type:
                        - string
                        - 'null'
                      assignmentStatus:
                        type: string
                      validFrom:
                        type: string
                        format: date-time
                      validUntil:
                        type:
                        - string
                        - 'null'
                        format: date-time
                      reason:
                        type:
                        - string
                        - 'null'
                      updatedAt:
                        type: string
                        format: date-time
                      version:
                        type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      tags:
      - Access management
      operationId: deleteAdminRoleAssignmentsAssignmentId
      summary: Thu hồi phân công vai trò
      description: Thu hồi phân công vai trò (optimistic lock qua expectedVersion). Chặn thu hồi ADMIN cuối cùng (409). Đồng bộ quyền lên Keycloak, thu hồi phiên Keycloak và xóa phiên BFF (Force Re-login).
      x-lifecycle: stable
      x-backlog:
      - EPIC_22
      parameters:
      - name: assignmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: reason
        in: query
        required: false
        schema:
          type: string
      - name: expectedVersion
        in: query
