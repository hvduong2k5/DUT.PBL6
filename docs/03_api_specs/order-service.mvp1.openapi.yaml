openapi: 3.0.3
info:
  title: MS-04 Order delivery profile mvp1 (sandbox)
  version: 0.1.0
  description: First Order delivery; not full product MVP 1.0. CUSTOMER login, VIETQR
    through SePay Gateway sandbox. No COD/Guest/automatic refund/COMPLETED. Existing
    transport remains sandbox 3.1 HTTP adapters and events v2; this is not an implementation
    of all target 3.2 proofs. See ADR-001..004 and the MVP runbook.
servers:
- url: http://localhost:18004
  description: Local sandbox, not a production endpoint
