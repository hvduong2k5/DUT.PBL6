openapi: 3.1.0
info:
  title: Ô Mạ Authentication MVP API
  version: 2.0.0
  summary: Official Authentication & BFF Session specification aligned with Identity
    Service and RFC 9700.
  license:
    name: Proprietary - internal project use
    identifier: LicenseRef-Proprietary
  description: 'Official Authentication & Session Specification for the Ô Mạ ecosystem.

    Complies with RFC 9700 (BFF Pattern) and RFC 7636 (PKCE) with Keycloak IdP integration.

    Browser components call the BFF session endpoints at `/api/v1/public/auth/*` and

    public customer registration at `/api/v1/public/customer-registrations`.

    Session security is enforced via HttpOnly cookie `OMAMA_SESSION`.

    '
servers:
- url: /api/v1
  description: API Gateway relative base URL
- url: http://127.0.0.1:4010/api/v1
  description: Local Mockoon environment only
tags:
- name: Authentication
  description: Customer authentication and server-side session lifecycle.
- name: Registration
  description: Customer registration and email magic-link verification.
- name: Recovery
  description: Neutral recovery request and single-use password reset flow.
paths:
  /api/v1/public/auth/login:
    get:
      tags:
      - Authentication
      operationId: initiateBffLogin
      summary: Khởi tạo đăng nhập OIDC PKCE qua Keycloak
      parameters:
      - name: redirect_uri
        in: query
        required: false
        schema:
          type: string
      - name: provider
        in: query
        required: false
        schema:
          type: string
      - name: format
        in: query
        required: false
        schema:
          type: string
          enum:
          - json
          - redirect
      responses:
        '200':
          description: Authorization URL payload for API/Mobile clients.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      authorizationUrl:
                        type: string
                      state:
                        type: string
        '302':
          description: Browser redirection to Keycloak login screen.
        '400':
          $ref: '#/components/responses/ValidationError'
  /api/v1/public/auth/callback:
    get:
      tags:
      - Authentication
      operationId: handleBffCallback
      summary: Tiếp nhận Callback Authorization Code từ Keycloak
      parameters:
      - name: code
        in: query
        required: false
        schema:
          type: string
      - name: state
        in: query
        required: false
        schema:
          type: string
      responses:
        '302':
          description: Redirect to frontend with Set-Cookie OMAMA_SESSION.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
  /api/v1/public/auth/session:
    get:
      tags:
      - Authentication
      operationId: getBffSession
      summary: Kiểm tra phiên làm việc hiện tại qua Cookie OMAMA_SESSION
      responses:
        '200':
          description: Current authenticated session.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      sessionId:
                        type: string
                        nullable: true
                      principalId:
                        type: string
                        nullable: true
                      email:
                        type: string
                        nullable: true
                      authenticated:
                        type: boolean
  /api/v1/public/auth/tokens/refresh:
    post:
      tags:
      - Authentication
      operationId: refreshBffSession
      summary: Làm mới phiên làm việc BFF
      responses:
        '200':
          description: Session refreshed successfully.
  /api/v1/public/auth/logout:
    post:
      tags:
      - Authentication
      operationId: logoutBffSession
      summary: Đăng xuất, hủy phiên trên server và xóa Cookie OMAMA_SESSION
      responses:
        '200':
          description: Logged out successfully, cookie cleared.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearedSessionCookie'
  /api/v1/public/customer-registrations:
    post:
      tags:
      - Registration
      operationId: registerCustomerBff
      summary: Đăng ký tài khoản Khách hàng D2C (Idempotent Outbox)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - rawPassword
              - firstName
              - lastName
              - idempotencyKey
              - requestFingerprint
              properties:
                email:
                  type: string
                  format: email
                rawPassword:
                  type: string
                firstName:
                  type: string
                lastName:
                  type: string
                idempotencyKey:
                  type: string
                requestFingerprint:
                  type: string
      responses:
        '200':
          description: Customer registration succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  principalId:
                    type: string
                  status:
                    type: string
                  message:
                    type: string
  /api/v1/users/me:
    get:
      tags:
      - User Lifecycle & Profile
      summary: Lấy hồ sơ người dùng hiện tại
      description: Trích xuất thông tin người dùng từ JWT session cookie hoặc Bearer
        token.
      operationId: getCurrentUser
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Thông tin hồ sơ người dùng thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      principalId:
                        type: string
                        format: uuid
                      email:
                        type: string
                        format: email
                      firstName:
                        type: string
                      lastName:
                        type: string
                      principalType:
                        type: string
                        enum:
                        - CUSTOMER
                        - EMPLOYEE
                      roles:
                        type: array
                        items:
                          type: string
                      permissions:
                        type: array
                        items:
                          type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/users/me/password:
    put:
      tags:
      - User Lifecycle & Profile
      summary: Tự đổi mật khẩu cá nhân
      description: Người dùng tự cập nhật mật khẩu của mình bằng cách xác thực mật
        khẩu hiện tại và cung cấp mật khẩu mới.
      operationId: changeOwnPassword
      security:
      - cookieAuth: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - currentPassword
              - newPassword
              properties:
                currentPassword:
                  type: string
                  description: Mật khẩu hiện tại
                newPassword:
                  type: string
                  minLength: 8
                  description: Mật khẩu mới (tối thiểu 8 ký tự)
      responses:
        '200':
          description: Đổi mật khẩu thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Mật khẩu đã được cập nhật thành công
        '400':
          description: Mật khẩu hiện tại không chính xác hoặc dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: INVALID_CREDENTIALS
                  message:
                    type: string
                    example: Mật khẩu hiện tại không chính xác
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: OMAMA_SESSION
      description: Opaque Secure, HttpOnly, SameSite=Lax browser session cookie.
  parameters:
    VerificationId:
      name: verificationId
      in: path
      required: true
      description: Opaque registration verification reference; must not contain PII.
      schema:
        type: string
        minLength: 1
        maxLength: 200
  headers:
    SessionCookie:
      description: '`OMAMA_SESSION` with Path=/, Secure, HttpOnly, SameSite=Lax, no
        Domain.

        Candidate maximum lifetime is 24 hours when rememberMe=false and 30 days when
        true.

        '
      schema:
        type: string
      example: OMAMA_SESSION=opaque; Path=/; Max-Age=86400; HttpOnly; Secure; SameSite=Lax
    ClearedSessionCookie:
      description: Clears the host-only browser session cookie.
      schema:
        type: string
      example: OMAMA_SESSION=; Path=/; Max-Age=0; HttpOnly; Secure; SameSite=Lax
    NoStore:
      description: Prevents storage of authentication responses.
      schema:
        type: string
      example: no-store
    RetryAfter:
      description: Number of seconds before the client should retry.
      schema:
        type: integer
        minimum: 1
      example: 60
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      - rememberMe
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
          description: Existing password. It must not be normalized, trimmed, persisted,
            or logged.
        rememberMe:
          type: boolean
          default: false
    RegistrationRequest:
      type: object
      additionalProperties: false
      required:
      - displayName
      - email
      - password
      - termsVersion
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 100
          description: Candidate length limit; Unicode normalization and whitespace
            policy require review.
        email:
          $ref: '#/components/schemas/Email'
        password:
          $ref: '#/components/schemas/NewPassword'
        termsVersion:
          type: string
          minLength: 1
          maxLength: 50
          description: Version accepted by the customer. The server records acceptance
            time.
          example: 2026-09
    RegistrationConfirmationRequest:
      type: object
      additionalProperties: false
      required:
      - verificationToken
      properties:
        verificationToken:
          $ref: '#/components/schemas/OpaqueSingleUseToken'
    RecoveryRequest:
      type: object
      additionalProperties: false
      required:
      - email
      properties:
        email:
          $ref: '#/components/schemas/Email'
    RecoveryVerificationRequest:
      type: object
      additionalProperties: false
      required:
      - recoveryToken
      properties:
        recoveryToken:
          $ref: '#/components/schemas/OpaqueSingleUseToken'
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required:
      - resetProof
      - newPassword
      properties:
        resetProof:
          type: string
          minLength: 1
          maxLength: 2048
          writeOnly: true
          description: Short-lived, capability-limited proof produced by the verify
            operation.
        newPassword:
          $ref: '#/components/schemas/NewPassword'
    Email:
      type: string
      format: email
      maxLength: 254
      description: Email is the sole Authentication MVP identifier and is compared
        case-insensitively.
      example: customer@example.com
    NewPassword:
      type: string
      minLength: 15
      maxLength: 128
      writeOnly: true
      description: 'Length is measured in Unicode code points. Must contain at least
        one Unicode

        uppercase letter (Lu), lowercase letter (Ll), decimal digit (Nd), and

        punctuation or symbol (P or S). Whitespace is preserved and is not a special

        character. The server also rejects compromised passwords. Portable JSON Schema

        patterns are intentionally not used for Unicode category enforcement.

        '
      x-oma-password-policy:
        lengthUnit: unicode-code-points
        minLength: 15
        maxLength: 128
        requiredUnicodeCategories:
        - Lu
        - Ll
        - Nd
        - P-or-S
        whitespaceCountsAsSpecial: false
        compromisedPasswordBlocklist: true
    OpaqueSingleUseToken:
      type: string
      minLength: 1
      maxLength: 2048
      writeOnly: true
      description: Opaque, single-use token. The backend stores only a cryptographic
        hash.
    CustomerSummary:
      type: object
      additionalProperties: false
      required:
      - id
      - displayName
      - status
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 100
          example: CUS-001
        displayName:
          type: string
          minLength: 1
          maxLength: 100
          example: Khách Tri Kỷ
        status:
          type: string
          const: ACTIVE
    AuthenticatedSession:
      type: object
      additionalProperties: false
      required:
      - authenticated
      - customer
      properties:
        authenticated:
          type: boolean
          const: true
        customer:
          $ref: '#/components/schemas/CustomerSummary'
    DeliverySummary:
      type: object
      additionalProperties: false
      required:
      - channel
      - maskedDestination
      properties:
        channel:
          type: string
          const: EMAIL
        maskedDestination:
          type: string
          minLength: 1
          maxLength: 254
          example: c***@example.com
    RegistrationPending:
      type: object
      additionalProperties: false
      required:
      - status
      - verificationId
      - delivery
      - verificationExpiresAt
      - resendAvailableAt
      properties:
        status:
          type: string
          const: PENDING_VERIFICATION
        verificationId:
          type: string
          minLength: 1
          maxLength: 200
          example: REGV-001
        delivery:
          $ref: '#/components/schemas/DeliverySummary'
        verificationExpiresAt:
          type: string
          format: date-time
        resendAvailableAt:
          type: string
          format: date-time
    RegistrationConfirmation:
      type: object
      additionalProperties: false
      required:
      - status
      - authenticated
      - customer
      properties:
        status:
          type: string
          const: ACTIVE
        authenticated:
          type: boolean
          const: true
        customer:
          $ref: '#/components/schemas/CustomerSummary'
    VerificationEmailAccepted:
      type: object
      additionalProperties: false
      required:
      - accepted
      - messageCode
      - resendAvailableAt
      properties:
        accepted:
          type: boolean
          const: true
        messageCode:
          type: string
          const: VERIFICATION_EMAIL_ACCEPTED
        resendAvailableAt:
          type: string
          format: date-time
    RecoveryAccepted:
      type: object
      additionalProperties: false
      required:
      - accepted
      - messageCode
      properties:
        accepted:
          type: boolean
          const: true
        messageCode:
          type: string
          const: RECOVERY_REQUEST_ACCEPTED
    RecoveryVerification:
      type: object
      additionalProperties: false
      required:
      - verified
      - resetProof
      - expiresAt
      properties:
        verified:
          type: boolean
          const: true
        resetProof:
          type: string
          minLength: 1
          maxLength: 2048
          readOnly: true
        expiresAt:
          type: string
          format: date-time
    ApiFieldError:
      type: object
      additionalProperties: false
      required:
      - field
      - code
      - message
      properties:
        field:
          type: string
          minLength: 1
        code:
          type: string
          minLength: 1
          description: Stable machine-readable field error code.
        message:
          type: string
          minLength: 1
          description: Safe display message; clients must not parse this value.
    ApiError:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - requestId
      properties:
        code:
          type: string
          enum:
          - VALIDATION_ERROR
          - AUTHENTICATION_FAILED
          - SESSION_EXPIRED
          - ACCOUNT_UNAVAILABLE
          - REGISTRATION_NOT_AVAILABLE
          - VERIFICATION_INVALID
          - VERIFICATION_EXPIRED
          - VERIFICATION_ALREADY_USED
          - VERIFICATION_REQUEST_INVALID
          - RECOVERY_REQUEST_INVALID
          - RECOVERY_REQUEST_EXPIRED
          - RECOVERY_REQUEST_ALREADY_USED
          - RESET_PROOF_INVALID
          - RESET_PROOF_EXPIRED
          - RESET_PROOF_ALREADY_USED
          - RATE_LIMITED
          - ORIGIN_NOT_ALLOWED
          - NOTIFICATION_DELIVERY_FAILED
          - INTERNAL_SERVER_ERROR
          - SERVICE_UNAVAILABLE
        message:
          type: string
          minLength: 1
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ApiFieldError'
        requestId:
          type: string
          minLength: 1
          description: Non-PII correlation identifier for support and diagnostics.
  responses:
    RequestRejected:
      description: Request failed the same-origin or CSRF protection policy.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            origin:
              value:
                code: ORIGIN_NOT_ALLOWED
                message: Request origin is not allowed.
                requestId: REQ-ORIGIN-403
    ValidationError:
      description: One or more request fields failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            invalidEmail:
              value:
                code: VALIDATION_ERROR
                message: Request is invalid
                errors:
                - field: email
                  code: INVALID_FORMAT
                  message: Email chưa đúng định dạng
                requestId: REQ-VALIDATION-422
            passwordPolicy:
              value:
                code: VALIDATION_ERROR
                message: Password does not satisfy the approved policy.
                errors:
                - field: password
                  code: PASSWORD_MISSING_UPPERCASE
                  message: Mật khẩu phải có ít nhất một chữ hoa
                requestId: REQ-PASSWORD-422
    RateLimited:
      description: Request was rate limited without exposing internal risk rules.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            limited:
              value:
                code: RATE_LIMITED
                message: Vui lòng chờ trước khi thử lại.
                requestId: REQ-RATE-429
    NotificationDeliveryFailed:
      description: Request was valid but the notification provider could not accept
        delivery.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            delivery:
              value:
                code: NOTIFICATION_DELIVERY_FAILED
                message: Chưa thể gửi email lúc này.
                requestId: REQ-NOTIFY-503
    InternalError:
      description: Unexpected server failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            internal:
              value:
                code: INTERNAL_SERVER_ERROR
                message: Đã xảy ra lỗi hệ thống.
                requestId: REQ-INTERNAL-500
    ServiceUnavailable:
      description: Authentication capability is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            unavailable:
              value:
                code: SERVICE_UNAVAILABLE
                message: Dịch vụ tạm thời không khả dụng.
                requestId: REQ-SERVICE-503
    Unauthorized:
      description: Yêu cầu chưa được xác thực hoặc phiên đăng nhập đã hết hạn
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                example: UNAUTHORIZED
              message:
                type: string
                example: Yêu cầu xác thực hợp lệ
    Forbidden:
      description: Không có quyền truy cập tài nguyên
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                example: FORBIDDEN
              message:
                type: string
                example: Không có quyền thực hiện thao tác
