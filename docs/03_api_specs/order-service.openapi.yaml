openapi: 3.0.3
info:
  title: MS-04 Order — asynchronous operations
  version: 3.2.0
  description: Proposed Order 3.2 target contract, pending provider agreement and implementation. Integer VND. This
    is not evidence of deployed capability; runtime 3.1 is frozen in order-service.sandbox-3.1.openapi.yaml.
servers:
- url: https://api.omama.example
  description: Illustrative target; not a deployed server
paths:
  /api/v1/cart:
    get:
      operationId: getCart
      summary: getCart
      responses:
        '200':
          description: Durable response
          content:
            application/json:
