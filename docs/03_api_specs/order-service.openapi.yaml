  /api/v1/orders:
    get:
      operationId: listOwnedOrders
      summary: listOwnedOrders
      responses:
        '200':
          description: Durable response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                - next_cursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  next_cursor:
                    type: string
                    description: Opaque next-page token, or empty string on the final page (including a non-empty
                      final page).
              examples:
                empty:
                  value:
                    items: []
                    next_cursor: ''
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Missing or unowned resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: State/version/idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Unavailable before durable acceptance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth: []
      description: 'Owned orders only. Newest first by created_at DESC, id DESC. Cursor is opaque and bound to the
        authenticated principal and exact status filter; reset it when status changes. Empty next_cursor means no
        further page in this read. Not a snapshot across requests: new orders appear after refresh. No total, page,
        pageSize or search q; unsupported/duplicate query parameters return 400.'
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
          maxLength: 4096
        description: Send next_cursor unchanged; omit for the first page. Tampering or changing principal/status
          returns INVALID_CURSOR.
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        description: Maximum page size. Changing it between requests is allowed.
      - in: query
        name: status
        schema:
          type: string
          maxLength: 64
        description: Exact order status, not payment_status. Omit or empty for all owned orders. Unknown values
          return an empty list.
