      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: X-Idempotency-Key
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
          pattern: ^[!-~]{16,128}$
      - in: header
        name: If-Match
        required: true
        schema:
          type: string
          pattern: ^[1-9][0-9]*$
        description: Decimal expected Order version (same value as gRPC expected_version); conflicts return 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 255
              required:
              - reason
      x-feature-gate: verified-care-approval
      description: Accept a Care review request; does not yet cancel, refund or restock. Owner/function/version
        checks apply.
  /api/v1/admin/orders/{id}/hold:
    post:
      operationId: holdOrder
      summary: holdOrder
      responses:
        '202':
          description: Durable response
          content:
