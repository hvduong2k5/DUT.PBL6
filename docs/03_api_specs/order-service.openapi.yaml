components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceIdentity:
      type: http
      scheme: bearer
      bearerFormat: Service JWT
      description: Verified issuer/audience/service ACL over TLS; deployment may additionally require mTLS.
    providerSignature:
      type: apiKey
      in: header
      name: X-Provider-Signature
      description: Illustrative header; exact raw signature contract must be pinned with selected provider before
        activation.
  schemas:
    CheckoutOperation:
      type: object
      additionalProperties: false
      required:
      - operation_id
      - status
      - order_id
      - accepted_at
      - stage
      - updated_at
      properties:
        operation_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - ACCEPTED
          - PROCESSING
          - WAITING_RETRY
          - COMPENSATING
          - SUCCEEDED
          - FAILED
          - MANUAL_REVIEW
        order_id:
          type: string
          format: uuid
          nullable: true
        order_status:
          type: string
        error_code:
          type: string
        accepted_at:
          type: string
          format: date-time
        stage:
          type: string
          enum:
          - VALIDATING
          - ACQUIRING
          - PLACING
          - COMPENSATING
          - DONE
        updated_at:
          type: string
          format: date-time
        retry_at:
          type: string
          format: date-time
          nullable: true
      description: order_id is null until atomic placement. SUCCEEDED requires non-null order_id; FAILED requires
        error_code. MANUAL_REVIEW preserves unresolved obligations. Before placement poll this operation, not the
        planned Order UUID.
      oneOf:
      - properties:
          status:
            enum:
            - SUCCEEDED
          order_id:
            type: string
            format: uuid
            nullable: false
      - required:
        - error_code
        properties:
          status:
            enum:
            - FAILED
          order_id:
            type: string
            nullable: true
            enum:
            - null
      - properties:
          status:
            enum:
            - ACCEPTED
            - PROCESSING
            - WAITING_RETRY
            - COMPENSATING
            - MANUAL_REVIEW
          order_id:
            type: string
            nullable: true
            enum:
            - null
      example: *id002
    Item:
      type: object
      additionalProperties: false
      required:
      - sku_code
      - quantity
      properties:
        item_id:
          type: string
        sku_code:
          type: string
        quantity:
          type: integer
          format: int64
          minimum: 1
        unit_price:
          type: integer
          format: int64
        product_name:
          type: string
        weight_grams:
          type: integer
          format: int64
        catalog_version:
          type: integer
          format: int64
    Address:
      type: object
      additionalProperties: false
      required:
      - recipient_name
      - phone
      - street
      - ward_code
      - province_code
      properties:
        recipient_name:
          type: string
        phone:
          type: string
        street:
          type: string
        ward_code:
          type: string
        province_code:
          type: string
    Cart:
      type: object
      additionalProperties: false
      required:
      - revision
      - items
      properties:
        revision:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
    Quote:
      type: object
      additionalProperties: false
      required:
      - catalog_snapshot_id
      - catalog_expires_at
      - shipping_quote_reference
      - quote_id
      - cart_revision
      - payment_method
      - items
      - address
      - subtotal
      - shipping_fee
      - final_amount
      - expires_at
      - shipping_expires_at
      properties:
        catalog_snapshot_id:
          type: string
        catalog_expires_at:
          type: string
          format: date-time
        shipping_quote_reference:
          type: string
        source_address_id:
          type: string
        source_address_version:
          type: integer
          format: int64
        quote_id:
          type: string
        cart_revision:
          type: integer
          format: int64
        payment_method:
          type: string
          enum:
          - VIETQR
          - COD
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
        address:
          $ref: '#/components/schemas/Address'
        subtotal:
          type: integer
          format: int64
        shipping_fee:
          type: integer
          format: int64
        final_amount:
          type: integer
          format: int64
        customer_id:
          type: string
        expires_at:
          type: string
          format: date-time
        shipping_expires_at:
          type: string
          format: date-time
      description: Owned immutable server quote. Confirmation revalidates coherent Catalog/Shipping terms for both
        transfer and COD. Expiry/retry never extends the commercial deadline.
    Order:
      type: object
      additionalProperties: false
      required:
      - order_id
      - operation_id
      - order_code
      - customer_id
      - warehouse_id
      - payment_method
      - status
      - payment_status
      - stock_status
      - subtotal
      - shipping_fee
      - final_amount
      - version
      - ready_generation
      - ready_authorized
      - operational_hold
      - has_active_case
      - payment_reference
      - task_id
      - shipment_id
      - seal_code
      - payment_expires_at
      - updated_at
      - created_at
      - sla_due_at
      - completion_due_at
      - items_digest
      - compensation_status
      - cancellation_status
      - allowed_actions
      properties:
        order_id:
          type: string
        operation_id:
          type: string
        order_code:
          type: string
        customer_id:
          type: string
          nullable: true
        warehouse_id:
          type: string
        payment_method:
          type: string
        status:
          type: string
          enum:
          - PENDING_PAYMENT
          - PAYMENT_FINALIZING
          - PAID
          - CONFIRMED_COD
          - PROCESSING
          - PACKED
          - SHIPPED
          - DELIVERED
          - DELIVERY_FAILED
          - COMPLETED
          - CANCELLED_TIMEOUT
          - CANCELLED_BY_USER
          - CANCELLED_BY_ADMIN
        payment_status:
          type: string
          enum:
          - UNPAID
          - PENDING
          - CONFIRMED
          - RECONCILIATION_REQUIRED
          - PARTIALLY_REFUNDED
          - REFUNDED
        stock_status:
          type: string
          enum:
          - RESERVED
          - COMMITTING
          - COMMITTED
          - RELEASING
          - RELEASED
          - EXPIRED
          - REVERSED
          - UNKNOWN
        subtotal:
          type: integer
          format: int64
        shipping_fee:
          type: integer
          format: int64
        final_amount:
          type: integer
          format: int64
        version:
          type: integer
          format: int64
        ready_generation:
          type: integer
          format: int64
        ready_authorized:
          type: boolean
        operational_hold:
          type: boolean
        has_active_case:
          type: boolean
        payment_reference:
          type: string
        task_id:
          type: string
          nullable: true
        shipment_id:
          type: string
          nullable: true
        seal_code:
          type: string
          nullable: true
        payment_expires_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        sla_due_at:
          type: string
          format: date-time
          nullable: true
        completion_due_at:
          type: string
          format: date-time
          nullable: true
        snapshot:
          type: object
          nullable: true
          allOf:
          - $ref: '#/components/schemas/Quote'
        items_digest:
          type: string
          pattern: ^[0-9a-f]{64}$
        compensation_status:
          type: string
          enum:
          - NOT_REQUIRED
          - PENDING
          - SUCCEEDED
          - MANUAL_REVIEW
        cancellation_status:
          type: string
          enum:
          - NONE
          - PENDING
          - SUCCEEDED
          - REJECTED
          - MANUAL_REVIEW
        allowed_actions:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - PAY
            - CANCEL
            - REQUEST_CANCELLATION
            - VIEW_TRACKING
            - CONTACT_SUPPORT
      description: Lifecycle, payment, stock and compensation are independent. PAID first transition requires verified
        allocation and finalized resources. ready_authorized is a projection, never permission to start packing.
        Consult allowed_actions; UNKNOWN requires recovery.
    Cancellation:
      type: object
      additionalProperties: false
      required:
      - cancellation_id
      - order_id
      - status
      - compensation_status
      - version
      properties:
        cancellation_id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - PENDING
          - SUCCEEDED
          - REJECTED
          - MANUAL_REVIEW
        compensation_status:
          type: string
          enum:
          - NOT_REQUIRED
          - PENDING
          - SUCCEEDED
          - MANUAL_REVIEW
        version:
          type: integer
          format: int64
          minimum: 1
        review_reference:
          type: string
          nullable: true
      example:
        cancellation_id: 11111111-1111-4111-8111-111111111111
        order_id: 11111111-1111-4111-8111-111111111111
        status: PENDING
        compensation_status: PENDING
        version: 2
    ApiError:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - retryable
          properties:
            code:
              type: string
              minLength: 1
            retryable:
              type: boolean
        operation_id:
          type: string
          format: uuid
      example:
        error:
          code: IDEMPOTENCY_CONFLICT
          retryable: false
        operation_id: 11111111-1111-4111-8111-111111111111
    ApprovalReferenceRequest:
      type: object
      additionalProperties: false
      properties:
        approval_id:
          type: string
          minLength: 1
      required:
      - approval_id
    RefundOperation:
      type: object
      additionalProperties: false
      properties:
        refund_id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        receipt_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - APPROVED
          - SUBMITTED
          - UNKNOWN
          - SUCCEEDED
          - FAILED
          - MANUAL_REVIEW
      required:
      - refund_id
      - order_id
      - receipt_id
      - status
    CancellationReview:
      type: object
      additionalProperties: false
      properties:
        review_reference:
          type: string
          minLength: 1
        order_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - REVIEW_PENDING
      required:
      - review_reference
      - order_id
      - status
    HoldDecision:
      type: object
      additionalProperties: false
      properties:
        order_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - PENDING
          - HELD
          - RESUMED
          - REJECTED
          - MANUAL_REVIEW
        version:
          type: integer
          format: int64
          minimum: 1
        ready_generation:
          type: integer
          format: int64
          minimum: 0
      required:
      - order_id
      - status
      - version
      - ready_generation
    OrderTracking:
      type: object
      additionalProperties: false
      required:
      - shipment_id
      - order_status
      description: Minimal Order-owned projection. Not a carrier timeline. Null shipment_id means no shipment reference
        has been recorded; it does not prove cancellation or delivery. Carrier code, tracking number, checkpoints,
        seal and media are not exposed by this endpoint yet. Enforce Order ownership before returning this data.
      properties:
        shipment_id:
          type: string
          format: uuid
          nullable: true
        order_status:
          type: string
          description: Authoritative order status; Delivered and Completed are distinct.
