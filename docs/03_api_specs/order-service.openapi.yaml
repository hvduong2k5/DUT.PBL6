  /api/v1/orders/{id}/cancel:
    post:
      operationId: cancelOrder
      summary: cancelOrder
      responses:
        '202':
          description: Durable cancellation pending remote decision/recovery
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cancellation'
          headers:
            Location:
              schema:
                type: string
              description: /api/v1/orders/{id}; poll cancellation_status and compensation_status
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Missing or unowned resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: State/version/idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Unavailable before durable acceptance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '200':
          description: Terminal cancellation decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cancellation'
          headers:
            Location:
              schema:
                type: string
              description: /api/v1/orders/{id}; poll cancellation_status and compensation_status
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: X-Idempotency-Key
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
          pattern: ^[!-~]{16,128}$
      - in: header
        name: If-Match
        required: true
        schema:
          type: string
          pattern: ^[1-9][0-9]*$
        description: Decimal expected Order version (same value as gRPC expected_version); conflicts return 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: &id001
              type: object
              additionalProperties: false
              properties:
                reason:
                  type: string
                  maxLength: 255
                  minLength: 1
                active:
                  type: boolean
                  default: true
              required:
              - active
              - reason
      description: Persist cancellation intent first. Unpaid cancellation may commit while compensation remains
        PENDING. Committed/COD cancellation is not SUCCEEDED until Fulfillment cancellation barrier and stock reversal
        are verified. ACCEPTED task rejects self-cancel; paid cancellation requires Care review. Timeout is not
        proof of cancellation.
