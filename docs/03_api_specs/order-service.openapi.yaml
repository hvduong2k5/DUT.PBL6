        '200':
          description: Hold mutation/replay committed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldDecision'
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: X-Idempotency-Key
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
          pattern: ^[!-~]{16,128}$
      - in: header
        name: If-Match
        required: true
        schema:
          type: string
          pattern: ^[1-9][0-9]*$
        description: Decimal expected Order version (same value as gRPC expected_version); conflicts return 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: *id001
      description: active=true sets local hold first and is PENDING until authoritative Fulfillment CANCELLED proof.
        ACCEPTED task rejects hard hold; UNKNOWN preserves pending obligation. active=false resumes only after old
        generation is closed and eligibility is revalidated, issuing a new generation. Function/warehouse scope
        and audited reason are required.
