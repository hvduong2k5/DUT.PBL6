              - revision
              properties:
                sku_code:
                  type: string
                  minLength: 1
                  maxLength: 64
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 999
                revision:
                  type: integer
                  minimum: 0
  /api/v1/checkout/quote:
    post:
      operationId: createCheckoutQuote
      summary: createCheckoutQuote
      responses:
        '200':
          description: Durable response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Missing or unowned resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: State/version/idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Unavailable before durable acceptance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - cart_revision
              - payment_method
              properties:
                cart_revision:
                  type: integer
                  minimum: 0
                payment_method:
                  type: string
                  enum:
                  - VIETQR
                  - COD
                shipping_address_id:
                  type: string
                  format: uuid
                address:
                  type: object
                  additionalProperties: false
                  required:
                  - recipient_name
                  - phone
                  - street
                  - ward_code
                  - province_code
                  properties:
                    recipient_name:
                      type: string
                      minLength: 1
                      maxLength: 255
                    phone:
                      type: string
                      minLength: 1
                      maxLength: 255
                    street:
                      type: string
                      minLength: 1
                      maxLength: 255
                    ward_code:
                      type: string
                      minLength: 1
                      maxLength: 255
                    province_code:
                      type: string
                      minLength: 1
                      maxLength: 255
                voucher_code:
                  type: string
              oneOf:
              - required:
                - shipping_address_id
                not:
                  required:
                  - address
              - required:
                - address
                not:
                  required:
                  - shipping_address_id
      description: 'Full-cart MVP: quotes every server cart line at cart_revision; no selected-item or partial-cart
        input. A quote does not reserve stock. After successful placement the asynchronous cleanup only removes
        the same cart ID/revision; a changed/replaced cart is preserved. Client must refetch cart after operation
        success and never clear it locally. Exactly one saved shipping_address_id or inline address is required.'
  /api/v1/checkout:
    post:
      operationId: acceptCheckout
      summary: acceptCheckout
      responses:
        '202':
          description: Durable operation created; no Order is implied
          headers:
            Location:
              schema:
                type: string
              description: Existing /api/v1/checkout-operations/{id}
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutOperation'
              example: &id002
                operation_id: 11111111-1111-4111-8111-111111111111
                status: ACCEPTED
                stage: VALIDATING
                order_id: null
                accepted_at: '2026-10-15T03:00:00Z'
                updated_at: '2026-10-15T03:00:00Z'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Missing or unowned resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: State/version/idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Unavailable before durable acceptance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '201':
          description: Replay of successful checkout, same operation and Order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutOperation'
              example:
                operation_id: 11111111-1111-4111-8111-111111111111
                status: SUCCEEDED
                stage: DONE
                order_id: 11111111-1111-4111-8111-111111111111
                accepted_at: '2026-10-15T03:00:00Z'
                updated_at: '2026-10-15T03:00:00Z'
          headers:
            Link:
              schema:
                type: string
              description: 'Present when Order has committed: </api/v1/orders/{order_id}>; rel="item".'
        '410':
          description: Response expired; key remains non-reusable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Replay durable validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Function denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '413':
          description: Input too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Overloaded; retry same key after Retry-After
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          headers:
            Retry-After:
              schema:
                type: string
              description: Delay in seconds
        '504':
          description: Outcome unknown; replay same key/query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth: []
      parameters:
      - in: header
        name: X-Idempotency-Key
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
          pattern: ^[!-~]{16,128}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - quote_id
              - cart_revision
              - payment_method
              properties:
                quote_id:
                  type: string
                  format: uuid
                cart_revision:
                  type: integer
                  minimum: 0
                payment_method:
                  type: string
                  enum:
                  - VIETQR
                  - COD
      description: Acceptance verifies owned server quote at DB time and persists operation/input/key. Worker validates
        commercial conditions and reserves resources asynchronously. Expired terminal replay is 410; keys never
        become reusable automatically. Key scope is authenticated principal/action; canonical body hash is persisted.
        Same key with different input returns 409. Transport timeout after sending requires same-key replay/query.
        New acceptance always returns 202 with null order_id; replay SUCCEEDED returns 201 with the original non-null
        Order reference.
