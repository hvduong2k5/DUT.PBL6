                - $ref: '#/components/schemas/LegacyOrderError'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/LegacyOrderError'
        '502':
          description: Invalid or oversized upstream projection
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/LegacyOrderError'
        '503':
          description: Dependency or projection capability unavailable
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/LegacyOrderError'
