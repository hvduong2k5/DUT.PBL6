openapi: 3.0.3
info:
  title: Order Core - Review Candidate
  version: 1.0.0-review
  description: Design-only aggregate/control/query slice. See docs architecture chapter 15, Payment1.1
    and Checkout11. Snapshot v1 JSON Schema is an internal immutable payload; these APIs return separately
    redacted views. Existing routes require explicit version/cohort rollout. All mutation commands use
    authenticated actor/action/target scoped idempotency and expected_version; replay same key/hash before
    stale-version check but reauthorize current rights. No generic PATCH status or snapshot. Async command
    success must be interpreted by kind/outcome; neither ACK nor local hold proves remote stop.
  license:
    name: Internal project review
servers:
- url: https://order.example.invalid
  description: Review placeholder, no deployment represented
tags:
- name: OrderQueries
  description: Owner and scoped staff business views
- name: OrderCommands
  description: Guarded durable controls, no direct status mutation
- name: InternalOrder
  description: Verified provider/service decisions and purpose-bound snapshot views
paths:
  /api/v1/orders:
    get:
      tags:
      - OrderQueries
      operationId: listOwnedOrders
      summary: List current owner Orders
      description: Recheck owner or permission+merchant/warehouse/assignment scope on every page. Owner
        list sort created_at,id descending; queue sort stage,sla_due_at nulls-last,created_at,id. No PII
        or raw snapshots in queue.
      security:
      - orderPrincipal: []
      x-required-permission: owner.order.read
      parameters:
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/status'
      responses:
        '200':
          description: Authorized projection or durable command result.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/admin/orders:
    get:
      tags:
      - OrderQueries
      operationId: listScopedStaffOrders
      summary: List Orders in staff scope
      description: Recheck owner or permission+merchant/warehouse/assignment scope on every page. Owner
        list sort created_at,id descending; queue sort stage,sla_due_at nulls-last,created_at,id. No PII
        or raw snapshots in queue.
      security:
      - orderPrincipal: []
      x-required-permission: order.read
      parameters:
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/status'
      responses:
        '200':
          description: Authorized projection or durable command result.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/admin/orders/queue:
    get:
      tags:
      - OrderQueries
      operationId: listScopedOrderQueue
      summary: Read state-entry SLA work queue
      description: Recheck owner or permission+merchant/warehouse/assignment scope on every page. Owner
        list sort created_at,id descending; queue sort stage,sla_due_at nulls-last,created_at,id. No PII
        or raw snapshots in queue.
      security:
      - orderPrincipal: []
      x-required-permission: order.queue.read
      parameters:
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/status'
      responses:
        '200':
          description: Authorized projection or durable command result.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/orders/{id}:
    get:
      tags:
      - OrderQueries
      operationId: getCoreOrderDetail
      summary: Read an owned or scoped Order
      description: Customer/current Guest owner sees own commercial view. Staff requires order.read and
        scope; default recipient masked. Return current allowed_actions as hints, never permission tokens.
        Payment-only Guest read grant is insufficient for this endpoint.
      security:
      - orderPrincipal: []
      x-required-permission: owner.order.read OR order.read
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Authorized projection or durable command result.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/orders/{id}/tracking:
    get:
      tags:
      - OrderQueries
      operationId: getCoreOrderTracking
      summary: Read verified shipment/task checkpoints
      description: Only associated authenticated checkpoints; SHIPMENT_CREATED does not imply SHIPPED.
        Business-safe view has no internal actor/PII/free-form provider payload.
      security:
      - orderPrincipal: []
      x-required-permission: owner.order.read OR order.read
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Authorized projection or durable command result.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tracking'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/orders/{id}/history:
    get:
      tags:
      - OrderQueries
      operationId: getCoreOrderHistory
      summary: Read business Order timeline
      description: Owner/staff scoped timeline. Redact private actor identifiers, raw evidence, PII and
        security reasons. No raw outbox payload export.
      security:
      - orderPrincipal: []
      x-required-permission: owner.order.read OR order.history.read
      parameters:
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Authorized projection or durable command result.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPage'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/orders/{id}/commands/{command_id}:
    get:
      tags:
      - OrderQueries
      operationId: getCoreOrderCommand
      summary: Read durable command outcome
      description: Both Order and command target must be in current caller scope. Current authorization
        is rechecked even on replay. Interpret kind/outcome; a review request being recorded is not Order
        cancellation. Staff needs command read scope.
      security:
      - orderPrincipal: []
      x-required-permission: owner.order.read OR order.command.read
      parameters:
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/command_id'
      responses:
        '200':
          description: Authorized projection or durable command result.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCommand'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/orders/{id}/cancel:
    post:
      tags:
      - OrderCommands
      operationId: cancelPendingCoreOrder
      summary: Cancel eligible pending or unpaid COD Order
      description: Under Order lock/version and DB clock. Pending unallocated before deadline can cancel
        locally with release obligation; deadline reached uses timeout semantics. Receipt allocation winner
        requires Care review. COD committed needs authoritative fulfillment stop and reversal; return
        202 until proofs. Paid/processing self-cancel returns 409 REVIEW_REQUIRED. No direct refund or
        snapshot edits. Staff outside owner uses a Care-approved cancellation workflow; cannot bypass
        approval with an owner-cancel role override.
      security:
      - orderPrincipal: []
      x-required-permission: owner.order.cancel
      parameters:
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Authorized projection or durable command result.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCommand'
        '202':
          description: Durable workflow accepted or still running; query the scoped command resource.
            Not proof of remote cancellation, hard stop, stock release or refund.
          headers:
            Location:
              schema:
                type: string
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCommand'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommonCommand'
  /api/v1/orders/{id}/cancellation-requests:
    post:
      tags:
      - OrderCommands
      operationId: requestCoreCancellationReview
      summary: Request Care cancellation review
      description: Persist a nonterminal review request for a policy-eligible Order, then deliver to Care
        durably. SUCCEEDED outcome REVIEW_REQUEST_CREATED only acknowledges request recording; does not
        imply cancelled, held, stock returned or refunded.
      security:
      - orderPrincipal: []
      x-required-permission: owner.order.cancellation.request OR order.cancellation.request
      parameters:
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Authorized projection or durable command result.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCommand'
        '202':
          description: Durable workflow accepted or still running; query the scoped command resource.
            Not proof of remote cancellation, hard stop, stock release or refund.
          headers:
            Location:
              schema:
                type: string
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCommand'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommonCommand'
  /api/v1/admin/orders/{id}/holds:
    post:
      tags:
      - OrderCommands
      operationId: holdCoreOrder
      summary: Request an operational hold
      description: Create one independently identified hold. ADMISSION_ONLY blocks new permits/local transitions
        but cannot recall in-flight accepted task. REQUIRE_REMOTE_STOP returns pending until cancel barrier
        proof; ACCEPTED task rejects hard-stop claim. Receipt ingestion/reconciliation and expiry continue.
        Never extend reservation/payment deadline.
      security:
      - orderPrincipal: []
      x-required-permission: order.hold
      parameters:
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Authorized projection or durable command result.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCommand'
        '202':
          description: Durable workflow accepted or still running; query the scoped command resource.
            Not proof of remote cancellation, hard stop, stock release or refund.
          headers:
            Location:
              schema:
                type: string
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCommand'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HoldRequest'
      x-mfa-max-age-seconds: 900
  /api/v1/admin/orders/{id}/holds/{hold_id}/resume:
    post:
      tags:
      - OrderCommands
      operationId: resumeCoreOrderHold
      summary: Resume one eligible operational hold
      description: Only the targeted hold is closed. No automatic clearing of financial/integrity/cancellation
        holds. Reject or query if resource expired/released, active refund/cancel/case, unknown task barrier
        or incomplete proof. Committed proof may be valid after its old lease expiry. Recheck state/version
        under lock after provider queries. New readiness generation only after old generation closed and
        all remaining guards valid.
      security:
      - orderPrincipal: []
      x-required-permission: order.resume
      parameters:
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/hold_id'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Authorized projection or durable command result.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCommand'
        '202':
          description: Durable workflow accepted or still running; query the scoped command resource.
            Not proof of remote cancellation, hard stop, stock release or refund.
          headers:
            Location:
              schema:
                type: string
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCommand'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommonCommand'
      x-mfa-max-age-seconds: 900
  /api/v1/admin/orders/{id}/workflows/{workflow_id}/recover:
    post:
      tags:
      - OrderCommands
      operationId: recoverCoreOrderWorkflow
      summary: Query and resume an unresolved workflow
      description: Only same durable stage and stable effect keys; strategy QUERY_AND_RESUME. Evidence
        references require verification, not client booleans. Cannot mark PAID/DONE/COMMITTED, reset deadline,
        clear unknown or create a new provider effect key to bypass an obligation.
      security:
      - orderPrincipal: []
      x-required-permission: order.recover
      parameters:
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/workflow_id'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Authorized projection or durable command result.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCommand'
        '202':
          description: Durable workflow accepted or still running; query the scoped command resource.
            Not proof of remote cancellation, hard stop, stock release or refund.
          headers:
            Location:
              schema:
                type: string
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCommand'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryRequest'
      x-mfa-max-age-seconds: 900
  /internal/cancellations/approve:
    post:
      tags:
      - InternalOrder
      operationId: applyCoreCancellationApproval
      summary: Apply a verified Care cancellation decision
      description: Query authoritative approval bound to Order/scope/policy/expected version. Body cannot
        substitute approved amount or fake fulfillment stopped proof. Core creates cancellation hold/workflow,
        then remote barrier/reversal outside SQL. This candidate refines the existing route for a pinned
        cohort.
      security:
      - serviceIdentity: []
      x-required-permission: order.cancellation.approve
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Authorized projection or durable command result.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCommand'
        '202':
          description: Durable workflow accepted or still running; query the scoped command resource.
            Not proof of remote cancellation, hard stop, stock release or refund.
          headers:
            Location:
              schema:
                type: string
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCommand'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancellationApproval'
  /internal/orders/{id}/completion-decisions/apply:
    post:
      tags:
      - InternalOrder
      operationId: applyCoreCompletionDecision
      summary: Apply a serialized Care completion decision
      description: Verify decision reference and current settlement/window/holds/cases/refund/resource
        guards. Care serializes case-open with decision; local case projection is insufficient. Same completion
        milestone once, no network call in SQL transaction. Unknown decision cannot imply allowed.
      security:
      - serviceIdentity: []
      x-required-permission: order.completion.apply
      parameters:
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Authorized projection or durable command result.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCommand'
        '202':
          description: Durable workflow accepted or still running; query the scoped command resource.
            Not proof of remote cancellation, hard stop, stock release or refund.
          headers:
            Location:
              schema:
                type: string
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCommand'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompletionDecision'
  /internal/orders/{id}/snapshot-views:
    post:
      tags:
      - InternalOrder
      operationId: readPurposeBoundOrderSnapshot
      summary: Read minimum required immutable snapshot fields
      description: Read-only purpose query with audited access, not raw snapshot export. Verify service
        ACL, audience and real task association before rendering. FULFILLMENT_PICK_PACK contains no address.
        SHIPPING_CREATE returns recipient only for associated shipment work. CARE_REVIEW defaults masked.
        Unknown schema version or unavailable authority fails closed. No client-controlled field list,
        actor or arbitrary data source URL.
      security:
      - serviceIdentity: []
      x-required-permission: order.snapshot.view
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Authorized projection or durable command result.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotView'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SnapshotViewRequest'
components:
  securitySchemes:
    orderPrincipal:
      type: http
      scheme: bearer
      description: Pinned issuer/audience/key Customer, live Guest checkout principal or staff JWT. Verify
        current ownership or permissions+merchant/warehouse/assignment. Guest payment:read grant cannot
        authorize full Order queries or commands. MFA max15m for sensitive staff controls. Token subject
        is not arbitrary customer_id.
    serviceIdentity:
      type: http
      scheme: bearer
      description: Trusted service identity over TLS, pinned audience and method ACL; verify authoritative
        referenced decisions/task associations. Public X-Internal-Token or self-declared actor headers
        are not proof.
  parameters:
    IdempotencyKey:
      name: X-Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: ^[!-~]+$
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    command_id:
      name: command_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    hold_id:
      name: hold_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    workflow_id:
      name: workflow_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: Signed keyset cursor; binds principal scope, permission-scope digest, filters and sort;
        TTL proposed 15 minutes.
    limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    status:
      name: status
      in: query
      schema:
        $ref: '#/components/schemas/OrderState'
  responses:
    Error400:
      description: Invalid shape/key/reason; no actor or arbitrary status overrides.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Error401:
      description: Credential invalid, expired or revoked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Error403:
      description: Missing permission/purpose/MFA; cannot bypass separation of service/staff authority.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Error404:
      description: Order/command/hold/workflow absent or outside current ownership/merchant/warehouse/assignment
        scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Error409:
      description: Stale version, idempotency conflict, state/hold/obligation guard failed or cancellation
        requires Care review.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Error422:
      description: Verified decision or business policy invalid; no implied external rollback.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Error429:
      description: Rate limited; respect Retry-After.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
    Error503:
      description: Authority/proof/registry unavailable or commit outcome unknown. Retry the same key/body
        for mutations.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    ApiError:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - retryable
          properties:
            code:
              type: string
              minLength: 1
            retryable:
              type: boolean
        operation_id:
          type: string
          format: uuid
      example:
        error:
          code: IDEMPOTENCY_CONFLICT
          retryable: false
        operation_id: 11111111-1111-4111-8111-111111111111
    OrderState:
      type: string
      enum:
      - PENDING_PAYMENT
      - PAYMENT_FINALIZING
      - PAID
      - CONFIRMED_COD
      - PROCESSING
      - PACKED
      - SHIPPED
      - DELIVERED
      - DELIVERY_FAILED
      - COMPLETED
      - CANCELLED_TIMEOUT
      - CANCELLED_BY_USER
      - CANCELLED_BY_ADMIN
    PaymentState:
      type: string
      enum:
      - UNPAID
      - PENDING
      - CONFIRMED
      - RECONCILIATION_REQUIRED
      - PARTIALLY_REFUNDED
      - REFUNDED
    StockState:
      type: string
      enum:
      - RESERVED
      - COMMITTING
      - COMMITTED
      - RELEASING
      - RELEASED
      - EXPIRED
      - REVERSED
      - UNKNOWN
    Money:
      type: integer
      format: int64
      minimum: 0
      maximum: 1000000000000
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
      - code
      - retryable
      properties:
        code:
          type: string
          minLength: 1
        retryable:
          type: boolean
    CommonCommand:
      type: object
      additionalProperties: false
      required:
      - expected_version
      - reason_code
      properties:
        expected_version:
          type: integer
          format: int64
          minimum: 1
        reason_code:
          type: string
          minLength: 1
          maxLength: 64
      example:
        expected_version: 3
        reason_code: CUSTOMER_REQUEST
    HoldRequest:
      type: object
      additionalProperties: false
      required:
      - expected_version
      - reason_code
      - hold_type
      - mode
      properties:
        expected_version:
          type: integer
          format: int64
          minimum: 1
        reason_code:
          type: string
          minLength: 1
          maxLength: 64
        hold_type:
          type: string
          enum:
          - OPERATIONAL
        mode:
          type: string
          enum:
          - ADMISSION_ONLY
          - REQUIRE_REMOTE_STOP
      example:
        expected_version: 4
        reason_code: STAFF_REVIEW
        hold_type: OPERATIONAL
        mode: REQUIRE_REMOTE_STOP
    RecoveryRequest:
      type: object
      additionalProperties: false
      required:
      - expected_version
      - reason_code
      - strategy
      - evidence_references
      properties:
        expected_version:
          type: integer
