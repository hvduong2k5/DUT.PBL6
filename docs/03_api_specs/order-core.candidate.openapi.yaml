          minimum: 1
        reason_code:
          type: string
          minLength: 1
          maxLength: 64
        decision_reference:
          type: string
          minLength: 1
          maxLength: 128
    OrderCommand:
      type: object
      additionalProperties: false
      required:
      - command_id
      - order_id
      - kind
      - status
      - current_order_version
      - outcome
      - hold_id
      - cancellation_request_id
      - compensation_status
      - error
      - created_at
      - updated_at
      properties:
        command_id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - CANCEL_PENDING
          - REQUEST_CANCELLATION_REVIEW
          - APPLY_CANCELLATION_APPROVAL
          - HOLD
          - RESUME
          - RECOVER
          - COMPLETE
        status:
          type: string
          enum:
          - ACCEPTED
          - RUNNING
          - SUCCEEDED
          - REJECTED
          - MANUAL_REVIEW
        current_order_version:
          type: integer
          format: int64
          minimum: 1
        outcome:
          type: string
          nullable: true
        hold_id:
          type: string
          format: uuid
          nullable: true
        cancellation_request_id:
          type: string
          format: uuid
          nullable: true
        compensation_status:
          type: string
          enum:
          - NOT_REQUIRED
          - PENDING
          - SUCCEEDED
          - MANUAL_REVIEW
        error:
          type: object
          nullable: true
          additionalProperties: false
          required:
          - code
          - retryable
          properties:
            code:
              type: string
              minLength: 1
            retryable:
              type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      description: Interpret outcome by kind. REQUEST_CANCELLATION_REVIEW succeeded means request recorded,
        not Order cancelled/refunded. Current state may be newer on replay; original command effect is
        not repeated. Compensation pending remains visible.
      example:
        command_id: 7ea3a46a-05e7-4cb5-9163-c751a3903668
        order_id: 689ecf03-33d5-456e-ae10-c7c544b79abc
        kind: HOLD
        status: RUNNING
        current_order_version: 5
        outcome: null
        hold_id: ff06936a-bf54-4857-b6cf-8b3cd385d8eb
        cancellation_request_id: null
        compensation_status: NOT_REQUIRED
        error: null
        created_at: '2026-10-17T10:03:00+07:00'
        updated_at: '2026-10-17T10:03:00+07:00'
    Hold:
      type: object
      additionalProperties: false
