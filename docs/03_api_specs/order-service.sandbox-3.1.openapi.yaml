openapi: 3.0.3
info:
  title: MS-04 Order — asynchronous operations
  version: 3.1.0
  description: Go implementation contract. Dependencies use stateful sandbox protocols;
    money is integer VND. New checkout returns 202 and a durable checkout operation
    resource.
servers:
- url: http://127.0.0.1:18004
paths:
  /api/v1/cart:
    get:
      operationId: getCart
      summary: getCart
      responses:
        '200':
          description: Durable response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      retryable:
                        type: boolean
                  operation_id:
                    type: string
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      retryable:
                        type: boolean
                  operation_id:
                    type: string
        '404':
          description: Missing or unowned resource
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      retryable:
                        type: boolean
                  operation_id:
                    type: string
        '409':
          description: State/version/idempotency conflict
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      retryable:
                        type: boolean
                  operation_id:
                    type: string
        '503':
          description: Unavailable before durable acceptance
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      retryable:
                        type: boolean
                  operation_id:
                    type: string
      security:
      - bearerAuth: []
