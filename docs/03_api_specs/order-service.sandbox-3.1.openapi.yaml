components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    internalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
  schemas:
    CheckoutOperation:
      type: object
      additionalProperties: false
      required:
      - operation_id
      - status
      - order_id
      - accepted_at
      properties:
        operation_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - ACCEPTED
          - PROCESSING
          - WAITING_RETRY
          - COMPENSATING
          - SUCCEEDED
          - FAILED
          - MANUAL_REVIEW
        order_id:
          type: string
          format: uuid
          nullable: true
        order_status:
          type: string
        error_code:
          type: string
        accepted_at:
          type: string
          format: date-time
    Item:
      type: object
      additionalProperties: false
      required:
      - sku_code
      - quantity
      properties:
        item_id:
          type: string
        sku_code:
          type: string
        quantity:
          type: integer
          format: int64
        unit_price:
          type: integer
          format: int64
        product_name:
          type: string
        weight_grams:
          type: integer
          format: int64
        catalog_version:
          type: integer
          format: int64
    Address:
      type: object
      additionalProperties: false
      required:
      - recipient_name
      - phone
      - street
      - ward_code
      - province_code
      properties:
        recipient_name:
          type: string
        phone:
          type: string
        street:
          type: string
        ward_code:
          type: string
        province_code:
          type: string
    Cart:
      type: object
      additionalProperties: false
      required:
      - revision
      - items
      properties:
        revision:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
    Quote:
      type: object
      additionalProperties: false
      required:
      - catalog_snapshot_id
      - catalog_expires_at
      - shipping_quote_reference
      - quote_id
      - cart_revision
      - payment_method
      - items
      - address
      - subtotal
      - shipping_fee
      - final_amount
      - expires_at
      - shipping_expires_at
      properties:
        catalog_snapshot_id:
          type: string
        catalog_expires_at:
          type: string
          format: date-time
        shipping_quote_reference:
          type: string
        source_address_id:
          type: string
        source_address_version:
          type: integer
          format: int64
        quote_id:
          type: string
        cart_revision:
          type: integer
          format: int64
        payment_method:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
        address:
          $ref: '#/components/schemas/Address'
        subtotal:
          type: integer
          format: int64
        shipping_fee:
          type: integer
          format: int64
        final_amount:
          type: integer
          format: int64
        customer_id:
          type: string
        expires_at:
          type: string
          format: date-time
        shipping_expires_at:
          type: string
          format: date-time
    Order:
      type: object
      additionalProperties: false
      required:
      - order_id
      - operation_id
      - order_code
      - customer_id
      - warehouse_id
      - payment_method
      - status
      - payment_status
      - stock_status
      - subtotal
      - shipping_fee
      - final_amount
      - version
      - ready_generation
      - ready_authorized
      - operational_hold
      - has_active_case
      - payment_reference
      - task_id
      - shipment_id
      - seal_code
      - payment_expires_at
      - updated_at
      - created_at
      - sla_due_at
      - completion_due_at
      properties:
