              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      retryable:
                        type: boolean
                  operation_id:
                    type: string
        '409':
          description: State/version/idempotency conflict
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      retryable:
                        type: boolean
                  operation_id:
                    type: string
        '503':
          description: Unavailable before durable acceptance
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      retryable:
                        type: boolean
                  operation_id:
                    type: string
        '201':
          description: Replay of successful checkout, same operation and Order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutOperation'
          headers:
            Link:
              schema:
                type: string
              description: 'Present when Order has committed: </api/v1/orders/{order_id}>;
                rel="item".'
        '410':
          description: Response expired; key remains non-reusable
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      retryable:
                        type: boolean
                  operation_id:
                    type: string
        '422':
          description: Replay durable validation failure
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      retryable:
                        type: boolean
                  operation_id:
                    type: string
      security:
      - bearerAuth: []
      parameters:
      - in: header
        name: X-Idempotency-Key
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - quote_id
              - cart_revision
              - payment_method
              properties:
                quote_id:
                  type: string
                  format: uuid
                cart_revision:
                  type: integer
                  minimum: 0
                payment_method:
                  type: string
                  enum:
                  - VIETQR
                  - COD
      description: Acceptance verifies owned server quote at DB time and persists
        operation/input/key. Worker validates commercial conditions and reserves resources
        asynchronously. Expired terminal replay is 410; keys never become reusable
        automatically.
