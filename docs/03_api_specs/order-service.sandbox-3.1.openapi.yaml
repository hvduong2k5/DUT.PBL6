  /api/v1/checkout:
    post:
      operationId: acceptCheckout
      summary: acceptCheckout
      responses:
        '202':
          description: Durable operation created; no Order is implied
          headers:
            Location:
              schema:
                type: string
              description: Existing /api/v1/checkout-operations/{id}
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutOperation'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      retryable:
                        type: boolean
                  operation_id:
                    type: string
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                type: object
                properties:
