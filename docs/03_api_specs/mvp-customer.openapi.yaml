          description: Durable operation created; no Order is implied
          headers:
            Location:
              schema:
                type: string
              description: Existing /api/v1/checkout-operations/{id}
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCheckoutOperation'
              example:
                operation_id: 11111111-1111-4111-8111-111111111111
                status: ACCEPTED
                stage: VALIDATING
                order_id: null
                accepted_at: '2026-10-15T03:00:00Z'
                updated_at: '2026-10-15T03:00:00Z'
        '400':
          description: Mapped public error; provider data is sanitized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicError'
        '401':
          description: Mapped public error; provider data is sanitized.
          content:
            application/json:
