      - currency
      - payment_code
      - receiver
      - transfer_content
      - qr_url
      - expires_at
      - server_time
      - can_pay
      - version
      properties:
        order_id:
          type: string
          format: uuid
        intent_id:
          type: string
          format: uuid
        provider:
          type: string
          enum:
