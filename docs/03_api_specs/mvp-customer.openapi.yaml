    get:
      tags:
      - CustomerPayment
      operationId: payment_getSePayPaymentStatus
      summary: Read local SePay payment status
      description: Read local financial data only, never call SePay for each browser poll. Same ownership rules
        as Order detail. Available after expiry or cancellation and during SePay outages. A non-SePay payment method
        returns 422 in this candidate slice; other methods use existing Order projections. Amounts summarize the
        allocated receipt, not extra/unmatched money. has_open_reconciliation may be true while display_state remains
        PAID. can_pay is true only when the instructions endpoint would admit this intent at the same decision instant;
        the two requests can race. Guest authorization checks authoritative session state plus the local grant registry
        on every request and fails closed if unavailable. Pending observations older than min(first_seen+60s,payment
        expiry) show VERIFICATION_DELAYED without asserting CONFIRMED or extending expiry.
