        Order. Never mint by order ID or payment code alone. ES256 access JWT TTL 10 minutes, capped by the session
        absolute expiry (proposed 24 hours). Claims bind issuer, audience, sid, order_id, subject, jti, grant_version
        and payment:read scope. Increase sid/order grant version and invalidate previous grants atomically. Idempotent
        same-key replay may reissue only the same still-active grant with its original expiry; superseded/revoked/expired
        replay returns 409. Do not extend lifetime during replay or store plaintext access tokens in logs.
