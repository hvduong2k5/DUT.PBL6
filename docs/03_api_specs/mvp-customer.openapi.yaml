  parameters:
    PaymentIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: ^[!-~]+$
    PaymentOrderId:
      name: order_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Verified issuer/audience/signature/expiry and ownership. Identity contract must be implemented;
        no client identity headers are trusted.
    OrderbearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    PaymentownerBearer:
      type: http
      scheme: bearer
      description: Trusted Customer principal using existing Order ownership mapping. JWT subject is not an arbitrary
        customer_id. Guest access uses the separate order-bound grant profile, not the sandbox role-only token.
    PaymentguestPaymentBearer:
      type: http
      scheme: bearer
      bearerFormat: ES256 JWT
      description: iss=order-service-guest, aud=order-payment, sid/order_id/jti/grant_version, scope=payment:read.
        TTL at most 10 minutes and not beyond session expiry. Check signature, allowlisted algorithm/key, timestamps
        with at most 30s skew, live session, unrevoked local grant/version and current ownership on every request.
        Payment code alone never authorizes access.
    PaymentguestCheckoutBearer:
      type: http
      scheme: bearer
      description: Identity-issued Guest checkout session credential under a pinned issuer, audience and key profile;
        requires authoritative session introspection. Maximum absolute lifetime proposed as 24 hours. Session must
        own the operation that placed this Order. Payment read grants cannot mint grants.
