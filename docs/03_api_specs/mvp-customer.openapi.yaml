          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCancellation'
          headers:
            Location:
              schema:
                type: string
              description: /api/v1/orders/{id}; poll cancellation_status and compensation_status
      security:
      - OrderbearerAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
          pattern: ^[!-~]{16,128}$
        x-provider-name: X-Idempotency-Key
      - in: header
        name: If-Match
        required: true
        schema:
          type: string
          pattern: ^[1-9][0-9]*$
        description: Decimal expected Order version (same value as gRPC expected_version); conflicts return 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  type: string
                  maxLength: 255
                  minLength: 1
                active:
                  type: boolean
                  default: true
              required:
              - active
              - reason
      description: Persist cancellation intent first. Unpaid cancellation may commit while compensation remains
        PENDING. Committed/COD cancellation is not SUCCEEDED until Fulfillment cancellation barrier and stock reversal
        are verified. ACCEPTED task rejects self-cancel; paid cancellation requires Care review. Timeout is not
        proof of cancellation.
      x-provider-contract: order-service
      x-implementation-status: provider-or-adapter-verification-required
      x-contract-status: integration-target
