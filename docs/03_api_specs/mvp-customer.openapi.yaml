        transfer_content:
          type: string
        qr_url:
          type: string
          format: uri
          description: URL built on server from receiver profile; host allowlisted; example data is fictional
        expires_at:
          type: string
          format: date-time
        server_time:
          type: string
          format: date-time
        can_pay:
          type: boolean
          enum:
          - true
        version:
          type: integer
          format: int64
          minimum: 1
    PaymentPaymentStatus:
      type: object
      additionalProperties: false
      required:
      - order_id
      - intent_id
      - provider
      - method
      - order_status
      - payment_status
      - display_state
      - intent_status
      - expected_amount
      - allocated_amount
      - refunded_amount
      - currency
      - expires_at
      - server_time
      - has_open_reconciliation
      - can_pay
      - version
      - verification_started_at
      - verification_due_at
      - support_reference
      - support_reason
      - next_poll_after_seconds
      properties:
        order_id:
          type: string
          format: uuid
        intent_id:
          type: string
          format: uuid
        provider:
          type: string
          enum:
          - SEPAY
        method:
          type: string
          enum:
          - VIETQR
        order_status:
          type: string
          enum:
          - PENDING_PAYMENT
          - PAYMENT_FINALIZING
          - PAID
          - PROCESSING
          - PACKED
          - SHIPPED
          - DELIVERED
          - DELIVERY_FAILED
          - COMPLETED
          - CANCELLED_TIMEOUT
          - CANCELLED_BY_USER
          - CANCELLED_BY_ADMIN
        payment_status:
          type: string
          enum:
          - UNPAID
          - PENDING
          - CONFIRMED
          - RECONCILIATION_REQUIRED
          - PARTIALLY_REFUNDED
          - REFUNDED
        display_state:
          type: string
          enum:
          - WAITING_PAYMENT
          - VERIFYING
          - VERIFICATION_DELAYED
          - FINALIZING
          - PAID
          - RECONCILIATION_REQUIRED
          - EXPIRED
          - CANCELLED
          - PARTIALLY_REFUNDED
          - REFUNDED
        intent_status:
          type: string
          enum:
          - ACTIVE
          - SETTLED
          - EXPIRED
          - CANCELLED
        expected_amount:
          $ref: '#/components/schemas/PaymentMoney'
        allocated_amount:
          $ref: '#/components/schemas/PaymentMoney'
        refunded_amount:
          allOf:
          - $ref: '#/components/schemas/PaymentMoney'
          description: Confirmed refunds of allocated receipt only; never greater than allocated_amount
        currency:
          type: string
          enum:
          - VND
        expires_at:
          type: string
          format: date-time
        server_time:
          type: string
          format: date-time
        has_open_reconciliation:
          type: boolean
        can_pay:
          type: boolean
        verification_started_at:
          type: string
          format: date-time
          nullable: true
          description: First related authenticated observation; retries never reset this instant
        verification_due_at:
          type: string
          format: date-time
          nullable: true
          description: Earlier of first observation plus 60s and payment expiry; UI escalation only
        support_reference:
          type: string
          nullable: true
          description: Opaque support lookup reference, never an authorization credential
        support_reason:
          type: string
          nullable: true
          enum:
          - VERIFICATION_TIMEOUT
          - UNDERPAYMENT
          - OVERPAYMENT
          - MULTIPLE_PARTIAL_PAYMENTS
          - EXTRA_RECEIPT
          - LATE_PAYMENT
          - OTHER_REVIEW
          - null
        next_poll_after_seconds:
          type: integer
          minimum: 0
          description: 3 while verifying/finalizing, 10 when delayed, 0 to stop automatic polling
        version:
          type: integer
          format: int64
          minimum: 1
          description: Local payment projection version incremented by relevant durable changes
