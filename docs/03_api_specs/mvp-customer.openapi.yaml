                $ref: '#/components/schemas/PublicError'
        '503':
          description: Mapped public error; provider data is sanitized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicError'
        '201':
          description: Replay of successful checkout, same operation and Order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCheckoutOperation'
              example:
                operation_id: 11111111-1111-4111-8111-111111111111
                status: SUCCEEDED
                stage: DONE
                order_id: 11111111-1111-4111-8111-111111111111
                accepted_at: '2026-10-15T03:00:00Z'
                updated_at: '2026-10-15T03:00:00Z'
          headers:
            Link:
              schema:
                type: string
              description: 'Present when Order has committed: </api/v1/orders/{order_id}>; rel="item".'
        '410':
          description: Mapped public error; provider data is sanitized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicError'
        '422':
          description: Mapped public error; provider data is sanitized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicError'
        '403':
          description: Mapped public error; provider data is sanitized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicError'
        '413':
          description: Mapped public error; provider data is sanitized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicError'
        '429':
          description: Mapped public error; provider data is sanitized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicError'
        '504':
          description: Mapped public error; provider data is sanitized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicError'
      security:
