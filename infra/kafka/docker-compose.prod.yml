version: '3.8'

# =============================================================================
# KAFKA CLUSTER - PRODUCTION / COOLIFY DEPLOYMENT
# =============================================================================
# - Hoạt động trong mạng nội bộ Coolify (coolify network)
# - KHÔNG map port máy chủ (ports:) -> Triệt tiêu 100% nguy cơ trùng port & an toàn
# - Traefik Reverse Proxy trên Coolify tự động route Domain tới kafka-ui:8080
# - Các microservice (identity, order, inventory,...) kết nối ngầm qua kafka:9092
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. Apache Kafka Broker (KRaft Mode - Native, No ZooKeeper)
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.8.0
    container_name: om-kafka
    restart: unless-stopped
    # LƯU Ý BẢO MẬT: Không mở cổng ra ngoài Internet trên VPS.
    # Toàn bộ microservices nội bộ trao đổi qua mạng Docker tại hostname "kafka:9092".
    environment:
      # Cấu hình KRaft (Metadata Controller nội bộ)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Listeners nội bộ (Không phơi ra ngoài)
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # Partition & Rebalance
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      # Giới hạn lưu trữ Log (7 ngày hoặc 15GB)
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 16106127360
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
    volumes:
      - kafka_prod_data:/var/lib/kafka/data
    networks:
      - coolify
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 | grep -q 'id: 1'"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 25s

  # ---------------------------------------------------------------------------
  # 2. Kafka UI (Giao diện Quản trị Topics & Events)
  # ---------------------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: om-kafka-ui
    restart: unless-stopped
    # Khai báo expose để Traefik nhận diện port 8080 của Netty Web Server
    expose:
      - 8080
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: omama-production-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

      # Bắt buộc xác thực đăng nhập khi gắn Domain công khai
      AUTH_TYPE: "LOGIN_FORM"
      SPRING_SECURITY_USER_NAME: "${KAFKA_UI_USERNAME:-admin}"
      SPRING_SECURITY_USER_PASSWORD: "${KAFKA_UI_PASSWORD:?Vui long khai bao KAFKA_UI_PASSWORD tren Coolify}"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - coolify

networks:
  coolify:
    external: true

volumes:
  kafka_prod_data:
    name: om_kafka_prod_data

