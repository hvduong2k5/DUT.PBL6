version: '3.8'

services:
  # 1. Primary RDBMS: PostgreSQL (Database-per-Service)
  postgres:
    image: postgres:16-alpine
    container_name: om-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../scripts/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    networks:
      - om-network

  # 2. NoSQL Document Store: MongoDB (User Clickstream, Behavior & Tracking Events)
  mongodb:
    image: mongo:7.0
    container_name: om-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: mongopassword
      MONGO_INITDB_DATABASE: om_behavior_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - om-network

  # 3. In-Memory NoSQL & Cache: Redis (Session, Rate Limit, Cart, Redlock)
  redis:
    image: redis:7.2-alpine
    container_name: om-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass redispassword
    volumes:
      - redis_data:/data
    networks:
      - om-network

  # 4. Message Broker: RabbitMQ (Event-Driven Architecture & SAGA Pattern)
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: om-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: rabbitmq
      RABBITMQ_DEFAULT_PASS: rabbitmqpassword
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Management Web UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - om-network

  # 5. Object Storage: MinIO (S3-Compatible for Product Images, Videos, Invoices)
  minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-56Z
    container_name: om-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000" # API
      - "9001:9001" # Web Console UI
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - om-network

networks:
  om-network:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  rabbitmq_data:
  minio_data:
