version: '3.8'

# =============================================================================
# KEYCLOAK IDP - PRODUCTION / COOLIFY DEPLOYMENT
# =============================================================================
# - Chạy Image chính thức từ Quay.io (không cần Dockerfile riêng)
# - Theme Ô Mạ lấy trực tiếp từ Git repo qua volume mount
# - Realm import 1 lần duy nhất qua Web Console vào PostgreSQL
# - Traefik Reverse Proxy trên Coolify cấp SSL và route tới port 8080
# =============================================================================

services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: omafood-keycloak-standalone
    restart: unless-stopped
    command: start
    expose:
      - 8080
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    environment:
      # Tài khoản Admin tối cao
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?Vui lòng cấu hình KEYCLOAK_ADMIN trên Coolify}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Vui lòng cấu hình KEYCLOAK_ADMIN_PASSWORD trên Coolify}

      # Kết nối CSDL PostgreSQL có sẵn trên Coolify
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:-5432}/${KEYCLOAK_DB_NAME:-keycloak_db}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}

      # Giám sát & Metrics
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_ENABLED: "true"

      # Cấu hình Hostname & Traefik Reverse Proxy trên Coolify
      KC_PROXY_HEADERS: ${KC_PROXY_HEADERS:-xforwarded}
      KC_HOSTNAME: "${KC_HOSTNAME:?Vui lòng cấu hình KC_HOSTNAME}"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      FRONTEND_BASE_URL: "${FRONTEND_BASE_URL:-}"
    volumes:
      # Nạp custom theme Ô Mạ từ Git repo được Coolify kéo về
      - ./themes:/opt/keycloak/themes:ro
    networks:
      - coolify
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080; echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q 'HTTP/1.1 200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  coolify:
    external: true
