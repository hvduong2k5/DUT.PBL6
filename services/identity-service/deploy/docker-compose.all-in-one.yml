version: '3.8'

# =============================================================================
# IDENTITY SERVICE - ALL-IN-ONE LOCAL DEV ENVIRONMENT
# =============================================================================
# Cụm hạ tầng khép kín dành cho môi trường phát triển cục bộ (Local Development):
# - PostgreSQL 16 (port 5433, tự động tạo keycloak_db và identity_db)
# - Keycloak 24 (port 8080, chế độ start-dev tự import realm omama)
# - Apache Kafka (port 9092, KRaft mode single-broker)
# - Identity Service (port 8016 HTTP, port 9016 gRPC)
#
# Cách dùng 1 (Khuyên dùng khi dev code):
#   docker compose -f deploy/docker-compose.all-in-one.yml up -d postgres keycloak kafka
#   .\gradlew.bat bootRun
#
# Cách dùng 2 (Chạy full container hóa):
#   .\gradlew.bat bootJar
#   docker compose -f deploy/docker-compose.all-in-one.yml up -d --build
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: omafood-identity-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5433:5432"   # Chạy port 5433 trên host, tránh xung đột với port 5432 mặc định
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
      - postgres_identity_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: omafood-identity-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: password123
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: "http://localhost:8080"
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8080:8080"
    volumes:
      - ../../keycloak-service/realm-export.template.json:/opt/keycloak/data/import/realm.json:ro
      - ../../keycloak-service/themes:/opt/keycloak/themes:ro
    depends_on:
      postgres:
        condition: service_healthy

  kafka:
    image: apache/kafka:3.7.0
    container_name: omafood-identity-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_FLUSH_INTERVAL_MESSAGES: 1
    ports:
      - "9092:9092"

  identity-service:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: omafood-identity-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8016
      GRPC_SERVER_PORT: 9016
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/identity_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password123
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8080/realms/omama
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/omama/protocol/openid-connect/certs
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: http://localhost:8080
      AUTH_REDIRECT_URI: http://localhost:8016/api/v1/public/auth/callback
      FRONTEND_BASE_URL: http://localhost:3000
      KEYCLOAK_REALM: omama
      KEYCLOAK_CLIENT_ID: identity-service-admin
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-admin-secret-placeholder}
      IDENTITY_REGISTRATION_FINGERPRINT_KEY: ${IDENTITY_REGISTRATION_FINGERPRINT_KEY:-synthetic-dev-fingerprint-key-at-least-32-chars}
      CUSTOMER_API_GATEWAY_URL: ${CUSTOMER_API_GATEWAY_URL:-http://localhost:8000}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8016:8016"
      - "9016:9016"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      kafka:
        condition: service_started

volumes:
  postgres_identity_data:
