server:
  port: 8016

spring:
  application:
    name: identity-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:identity_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:12345678}
  flyway:
    enabled: true
    baseline-on-migrate: true

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-handlers-package: com.hvduong.identity.infrastructure.persistence.mybatis.typehandler
  configuration:
    map-underscore-to-camel-case: true

grpc:
  server:
    port: 9016

spring.security.oauth2.resourceserver.jwt.issuer-uri: https://keycloak.omama.vn/realms/omama

keycloak:
  server-url: https://keycloak.omama.vn
  realm: omama
  client-id: identity-service-admin
  client-secret: "${KEYCLOAK_CLIENT_SECRET:changeme}"
