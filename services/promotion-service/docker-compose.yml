services:
  promotion-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: promotion_db
      POSTGRES_USER: promotion
      POSTGRES_PASSWORD: promotion
    ports:
      - "5447:5432"
    volumes:
      - promotion_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promotion -d promotion_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  promotion-service:
    build: .
    environment:
      PROMOTION_HTTP_ADDRESS: :8017
      PROMOTION_GRPC_ADDRESS: :9017
      PROMOTION_DATABASE_URL: postgres://promotion:promotion@promotion-postgres:5432/promotion_db?sslmode=disable
      PROMOTION_INTERNAL_TOKEN: ${PROMOTION_INTERNAL_TOKEN:-promotion-local-development-secret}
      PROMOTION_STAFF_JWT_ISSUER: ${PROMOTION_STAFF_JWT_ISSUER:-}
      PROMOTION_STAFF_JWT_AUDIENCE: ${PROMOTION_STAFF_JWT_AUDIENCE:-omama-api}
      PROMOTION_STAFF_JWT_PUBLIC_KEY_PATH: ${PROMOTION_STAFF_JWT_PUBLIC_KEY_PATH:-}
      PROMOTION_CUSTOMER_PROFILE_URL: ${PROMOTION_CUSTOMER_PROFILE_URL:-}
      PROMOTION_ORDER_EVENTS_ENABLED: ${PROMOTION_ORDER_EVENTS_ENABLED:-false}
      PROMOTION_KAFKA_BROKERS: ${PROMOTION_KAFKA_BROKERS:-}
      PROMOTION_ORDER_EVENTS_TOPIC: ${PROMOTION_ORDER_EVENTS_TOPIC:-order.events.v3}
      PROMOTION_ORDER_EVENTS_DLQ_TOPIC: ${PROMOTION_ORDER_EVENTS_DLQ_TOPIC:-promotion.order.v3.dlq}
      PROMOTION_ORDER_CONSUMER_GROUP: ${PROMOTION_ORDER_CONSUMER_GROUP:-promotion-order-v3}
      PROMOTION_EVENTS_TOPIC: ${PROMOTION_EVENTS_TOPIC:-promotion.events.v1}
      PROMOTION_LOYALTY_ORDER_TOKEN: ${PROMOTION_LOYALTY_ORDER_TOKEN:-}
      PROMOTION_LOYALTY_REFUND_TOKEN: ${PROMOTION_LOYALTY_REFUND_TOKEN:-}
    ports:
      - "8017:8017"
      - "9017:9017"
    depends_on:
      promotion-postgres:
        condition: service_healthy

volumes:
  promotion_postgres_data:
