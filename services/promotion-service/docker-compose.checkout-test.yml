services:
  checkout-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: checkout_test
      POSTGRES_PASSWORD: checkout_test
      POSTGRES_DB: promotion_checkout_test
    ports: ["127.0.0.1:15447:5432"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U checkout_test -d promotion_checkout_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  checkout-redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:16347:6379"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30
  checkout-kafka:
    image: apache/kafka:3.8.1
    ports: ["127.0.0.1:19047:19047"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:19047,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://checkout-kafka:9092,EXTERNAL://127.0.0.1:19047
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@checkout-kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
