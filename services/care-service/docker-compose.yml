services:
  care-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: care_user
      POSTGRES_PASSWORD: care_password
      POSTGRES_DB: care_db
    ports:
      - "5438:5432"
    volumes:
      - care_postgres_data:/var/lib/postgresql/data
      - ./migrations/000001_platform_media_ticket.up.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U care_user -d care_db"]
      interval: 3s
      timeout: 3s
      retries: 10

  care-minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-56Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - care_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 10

  care-kafka:
    image: apache/kafka:3.8.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://care-kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@care-kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "9092:9092"

  care-service:
    build: .
    environment:
      ENVIRONMENT: development
      CARE_INTERNAL_TOKEN: "${CARE_INTERNAL_TOKEN:?set CARE_INTERNAL_TOKEN in your shell or .env}"
      HTTP_PORT: "8006"
      DATABASE_URL: postgres://care_user:care_password@care-db:5432/care_db?sslmode=disable
      KAFKA_BROKERS: care-kafka:29092
      KAFKA_CARE_TOPIC: care.events.v1
      S3_ENDPOINT: care-minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadminpassword
      S3_BUCKET: care-private
      S3_REGION: us-east-1
      S3_USE_SSL: "false"
      S3_AUTO_CREATE_BUCKET: "true"
      SCANNER_MODE: noop
    ports:
      - "8006:8006"
    depends_on:
      care-db:
        condition: service_healthy
      care-minio:
        condition: service_healthy
      care-kafka:
        condition: service_started
    restart: unless-stopped

volumes:
  care_postgres_data:
  care_minio_data:

