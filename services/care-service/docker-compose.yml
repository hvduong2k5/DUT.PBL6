services:
  care-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: care_user
      POSTGRES_PASSWORD: care_password
      POSTGRES_DB: care_db
    ports:
      - "5438:5432"
    volumes:
      - care_postgres_data:/var/lib/postgresql/data
      - ./migrations/000001_platform_media_ticket.up.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./migrations/000002_sla_alerts.up.sql:/docker-entrypoint-initdb.d/002_sla_alerts.sql:ro
      - ./migrations/000003_return_foundation.up.sql:/docker-entrypoint-initdb.d/003_return_foundation.sql:ro
      - ./migrations/000004_correlation_ids.up.sql:/docker-entrypoint-initdb.d/004_correlation_ids.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U care_user -d care_db"]
      interval: 3s
      timeout: 3s
      retries: 10

  care-object-storage:
    image: chrislusf/seaweedfs:4.48
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.port=9000
      - -s3.config=/etc/seaweedfs/s3.json
      - -master.volumeSizeLimitMB=1024
      - -master.volumePreallocate=false
    ports:
      - "9010:9000"
      - "9011:9333"
    volumes:
      - care_object_storage_data:/data
      - ./deploy/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9333/cluster/healthz"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s

  care-kafka:
    image: apache/kafka:3.8.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://care-kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@care-kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

  care-kafka-init:
    image: apache/kafka:3.8.1
    depends_on:
      care-kafka:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - >-
        /opt/kafka/bin/kafka-topics.sh
        --bootstrap-server care-kafka:29092
        --create --if-not-exists
        --topic care.events.v1
        --partitions 3
        --replication-factor 1

  care-service:
    build: .
    environment:
      ENVIRONMENT: development
      CARE_INTERNAL_TOKEN: "${CARE_INTERNAL_TOKEN:?set CARE_INTERNAL_TOKEN in your shell or .env}"
      HTTP_PORT: "8006"
      RATE_LIMIT_PER_SECOND: "20"
      RATE_LIMIT_BURST: "40"
      DATABASE_URL: postgres://care_user:care_password@care-db:5432/care_db?sslmode=disable
      KAFKA_BROKERS: care-kafka:29092
      KAFKA_CARE_TOPIC: care.events.v1
      SLA_ALERT_POLL_INTERVAL: 1s
      SLA_NEAR_BREACH_WINDOW: 30m
      SLA_ALERT_BATCH_SIZE: 100
      S3_ENDPOINT: care-object-storage:9000
      S3_PUBLIC_ENDPOINT: localhost:9010
      S3_ACCESS_KEY: carelocaladmin
      S3_SECRET_KEY: carelocaladminsecret
      S3_BUCKET: care-private
      S3_REGION: us-east-1
      S3_USE_SSL: "false"
      S3_AUTO_CREATE_BUCKET: "true"
      SCANNER_MODE: noop
      MEDIA_CLEANUP_POLL_INTERVAL: 1s
      MEDIA_CLEANUP_BATCH_SIZE: 100
      BUSINESS_METRICS_POLL_INTERVAL: 5s
    ports:
      - "8006:8006"
    depends_on:
      care-db:
        condition: service_healthy
      care-object-storage:
        condition: service_healthy
      care-kafka:
        condition: service_healthy
      care-kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  care_postgres_data:
  care_object_storage_data:

