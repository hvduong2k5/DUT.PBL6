apiVersion: batch/v1
kind: Job
metadata:
  name: care-service-migrate
  labels:
    app.kubernetes.io/name: care-service
    app.kubernetes.io/part-of: omama
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: care-service
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: care-service:local
          imagePullPolicy: IfNotPresent
          command:
            - /app/care-migrate
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: care-service-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
