apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: care-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: care-service
  minReplicas: 2
  maxReplicas: 8
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
