x-runtime: &runtime
  build:
    context: ../..
    dockerfile: services/analytics-service/Dockerfile
  image: omama-analytics:local

x-test: &test
  build:
    context: ../..
    dockerfile: services/analytics-service/Dockerfile
    target: test
  image: omama-analytics-test:local

x-worker-env: &worker-env
  ANALYTICS_POSTGRES_DSN: postgresql://analytics_worker:local-worker@postgres/analytics
  ANALYTICS_CLICKHOUSE_HOST: clickhouse
  ANALYTICS_CLICKHOUSE_USER: analytics_worker
  ANALYTICS_CLICKHOUSE_PASSWORD: local-worker
  ANALYTICS_KAFKA_BROKERS: kafka:9092
  ANALYTICS_PIPELINE: order-v3-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: analytics_migrator
      POSTGRES_PASSWORD: local-migrator
    volumes:
      - ./tests/init-postgres.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U analytics_migrator -d analytics"]
      interval: 2s
      timeout: 2s
      retries: 20
  clickhouse:
    image: clickhouse/clickhouse-server:25.8-alpine
    environment:
      CLICKHOUSE_USER: analytics_migrator
      CLICKHOUSE_PASSWORD: local-migrator
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - ./tests/init-clickhouse.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: [CMD-SHELL, "clickhouse-client --user analytics_api --password local-api --query 'SELECT 1'"]
      interval: 2s
      timeout: 2s
      retries: 25
  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: [CMD, /opt/kafka/bin/kafka-topics.sh, --bootstrap-server, "kafka:9092", --list]
      interval: 4s
      timeout: 5s
      retries: 20
  topic:
    image: apache/kafka:3.8.0
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: [/opt/kafka/bin/kafka-topics.sh]
    command: [--bootstrap-server, "kafka:9092", --create, --if-not-exists, --topic, order.events.v3, --partitions, "2", --replication-factor, "1", --config, cleanup.policy=delete]
  identity-fixture:
    <<: *test
    user: "0:0"
    entrypoint: [python, tests/identity_fixture.py]
    command: []
    ports:
      - "127.0.0.1:${ANALYTICS_TEST_IDENTITY_PORT:-0}:8016"
    volumes:
      - pilot-key:/fixture
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8016/livez')"]
      interval: 2s
      timeout: 2s
      retries: 20
  migrate:
    <<: *runtime
    command: [migrate]
    environment:
      <<: *worker-env
      ANALYTICS_POSTGRES_DSN: postgresql://analytics_migrator:local-migrator@postgres/analytics
      ANALYTICS_POSTGRES_WORKER_ROLE: analytics_worker
      ANALYTICS_POSTGRES_API_ROLE: analytics_api
      ANALYTICS_REC_POSTGRES_WORKER_ROLE: analytics_rec_worker
      ANALYTICS_REC_POSTGRES_API_ROLE: analytics_rec_api
      ANALYTICS_CLICKHOUSE_USER: analytics_migrator
      ANALYTICS_CLICKHOUSE_PASSWORD: local-migrator
    depends_on:
      postgres: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
  collector:
    <<: *runtime
    command: [collector]
    environment: *worker-env
    depends_on:
      migrate: {condition: service_completed_successfully}
      topic: {condition: service_completed_successfully}
  builder:
    <<: *runtime
    command: [builder]
    environment: *worker-env
    depends_on:
      migrate: {condition: service_completed_successfully}
  api:
    <<: *runtime
    command: [api]
    environment: &api-env
      <<: *worker-env
      ANALYTICS_POSTGRES_DSN: postgresql://analytics_api:local-api@postgres/analytics
      ANALYTICS_CLICKHOUSE_USER: analytics_api
      ANALYTICS_CLICKHOUSE_PASSWORD: local-api
      ANALYTICS_JWT_ISSUER: http://identity-fixture:8016
      ANALYTICS_SUPPLY_ENABLED: "1"
      ANALYTICS_JWT_PUBLIC_KEY_FILE: /fixture/public.pem
      ANALYTICS_IDENTITY_URL: http://identity-fixture:8016
      ANALYTICS_SESSION_ORIGIN: http://127.0.0.1:13046
      ANALYTICS_PILOT_IDS: 913d2296-944c-4a75-b684-d1a0cf8fd4e8,27bc0f3a-69e5-4aa7-8644-3c7fcb7b3660,fb3ac39b-8597-470e-90b3-0b72b01cf4a1
    volumes:
      - pilot-key:/fixture:ro
    ports:
      - "127.0.0.1:${ANALYTICS_TEST_HTTP_PORT:-18011}:8011"
    depends_on:
      identity-fixture: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8011/readyz')"]
      interval: 2s
      timeout: 4s
      retries: 20
  tests:
    <<: *test
    profiles: [tests]
    environment:
      <<: *worker-env
      RUN_ANALYTICS_INTEGRATION: "1"
      ANALYTICS_PILOT_PG_DSN: postgresql://analytics_migrator:local-migrator@postgres/postgres
    entrypoint: [python, -m, pytest]
    command: [-q, -p, "no:cacheprovider", --junitxml=/tmp/analytics-pytest.xml]
    depends_on:
      api: {condition: service_healthy}
      recommendation-api: {condition: service_healthy}
      collector: {condition: service_started}
      builder: {condition: service_started}

  recommendation-api:
    <<: *runtime
    command: [api]
    environment:
      <<: *api-env
      ANALYTICS_REC_ENABLED: "1"
      ANALYTICS_REC_POSTGRES_DSN: postgresql://analytics_rec_api:local-rec-api@postgres/analytics
      ANALYTICS_REC_SCOPE_CONFIG_FILE: /run/recommendation-scope.json
      ANALYTICS_REC_SUBJECT_KEY: isolated-recommendation-test-key-32-bytes
      ANALYTICS_REC_QUERY_RATE_LIMIT: "100000"
    volumes:
      - pilot-key:/fixture:ro
      - ./dev/recommendation-scope.json:/run/recommendation-scope.json:ro
    ports:
      - "127.0.0.1:${ANALYTICS_REC_TEST_PORT:-18112}:8011"
    depends_on:
      identity-fixture: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8011/livez')"]
      interval: 2s
      timeout: 4s
      retries: 20

volumes:
  pilot-key:
