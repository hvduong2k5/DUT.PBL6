[project]
name = "omama-analytics-service"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "clickhouse-connect>=0.9,<1",
    "confluent-kafka>=2.8,<3",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "jsonschema[format-nongpl]>=4.23,<5",
    "prometheus-client>=0.22,<1",
    "psycopg[binary]>=3.2,<4",
    "pyjwt[crypto]>=2.10,<3",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["openapi-spec-validator>=0.7,<1", "pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analytics_service"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
markers = ["integration: requires Kafka, PostgreSQL and ClickHouse"]
