[project]
name = "ai-agent-service"
version = "0.1.0"
description = "MS-19 AI Agent Service: customer shopping copilot (phase 1) on a shared agent platform."
requires-python = ">=3.12,<3.13"
dependencies = [
    "aioboto3>=13,<15",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "prometheus-client>=0.22,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.9,<3",
    "pyjwt[crypto]>=2.10,<3",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_agent_service"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
markers = ["integration: requires PostgreSQL with pgvector"]
