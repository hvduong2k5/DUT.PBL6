services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ai_db
      POSTGRES_USER: ai_agent
      POSTGRES_PASSWORD: ai_agent
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ai_agent -d ai_db"]
      interval: 2s
      timeout: 2s
      retries: 20
  api:
    build:
      context: ../..
      dockerfile: services/ai-agent-service/Dockerfile
    image: ai-agent:local
    environment:
      AI_DATABASE_URL: postgresql://ai_agent:ai_agent@db:5432/ai_db
      AI_FIXTURES: "1"
      AI_LLM_PROVIDER: fake
      AI_EMBEDDING_PROVIDER: fake
    ports:
      - "8019:8019"
    depends_on:
      db:
        condition: service_healthy
