apiVersion: v1
kind: Service
metadata:
  name: profile-service
  namespace: omamx-ecommerce
  labels:
    app.kubernetes.io/name: profile-service
spec:
  type: ClusterIP
  selector:
    app: profile-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: grpc
      port: 50051
      targetPort: 50051
      protocol: TCP
