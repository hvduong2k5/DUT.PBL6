name: profile-hardening
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: profile_test
      POSTGRES_PASSWORD: local_test_only
      POSTGRES_DB: profile_test
    ports: ["127.0.0.1:15432:5432"]
    volumes:
      - ./migrations/000001_init_schema.up.sql:/docker-entrypoint-initdb.d/01.sql:ro
      - ./migrations/000002_street_mappings_and_national_seed.up.sql:/docker-entrypoint-initdb.d/02.sql:ro
      - ./migrations/000003_profile_integrity.up.sql:/docker-entrypoint-initdb.d/03.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profile_test -d profile_test"]
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:6.2-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
  kafka:
    image: apache/kafka:latest
    ports: ["127.0.0.1:19092:19092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://host.docker.internal:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  api:
    build: .
    environment:
      PROFILE_INTERNAL_TOKEN: ${PROFILE_INTERNAL_TOKEN:?set a temporary local test token}
      DATABASE_URL: postgres://profile_test:local_test_only@db:5432/profile_test?sslmode=disable
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:29092
      USE_VAULT_MOCK_DEV: "true"
    ports: ["127.0.0.1:18080:8080", "127.0.0.1:15051:50051"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_started}
