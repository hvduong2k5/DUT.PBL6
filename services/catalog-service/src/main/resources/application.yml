spring:
  application:
    name: catalog-service

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:catalog-stock-projection}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: com.hvduong.catalog.infrastructure.inventory.StockChangedEvent
        spring.json.trusted.packages: com.hvduong.catalog.infrastructure.inventory
        spring.json.use.type.headers: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      ack-mode: record

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:om_catalog_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgrespassword}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redispassword}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

mybatis:
  mapper-locations: classpath:mapper/sql/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30
    cache-enabled: false
    lazy-loading-enabled: false
  type-aliases-package: com.hvduong.catalog.domain.entity
  type-handlers-package: com.hvduong.catalog.config

grpc:
  server:
    port: ${GRPC_PORT:8005}
    security:
      enabled: false

app:
  kafka:
    inventory-stock-topic: ${INVENTORY_STOCK_TOPIC:inventory.stock-changed.v1}

catalog:
  cache:
    product-ttl-seconds: ${REDIS_TTL_SECONDS:3600}
    category-ttl-seconds: 86400
  events:
    topic: ${CATALOG_EVENTS_TOPIC:catalog.events.v1}
  outbox:
    enabled: ${CATALOG_OUTBOX_ENABLED:true}
    poll-interval-ms: ${CATALOG_OUTBOX_POLL_INTERVAL_MS:1000}
    batch-size: ${CATALOG_OUTBOX_BATCH_SIZE:50}
    lease-seconds: ${CATALOG_OUTBOX_LEASE_SECONDS:30}

logging:
  level:
    "[com.hvduong.catalog]": DEBUG
    "[org.mybatis]": DEBUG
