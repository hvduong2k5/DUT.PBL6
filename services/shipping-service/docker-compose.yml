services:
  shipping-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shipping_db
      POSTGRES_USER: shipping
      POSTGRES_PASSWORD: shipping
    ports:
      - "5438:5432"
    volumes:
      - shipping_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipping -d shipping_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  shipping-kafka:
    image: apache/kafka:3.8.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:29092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://shipping-kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@shipping-kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  shipping-kafka-init:
    image: apache/kafka:3.8.1
    depends_on:
      shipping-kafka:
        condition: service_healthy
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh"]
    command:
      - --bootstrap-server
      - shipping-kafka:29092
      - --create
      - --if-not-exists
      - --topic
      - shipping.events.v1
      - --partitions
      - "3"
      - --replication-factor
      - "1"

  shipping-fulfillment-kafka-init:
    image: apache/kafka:3.8.1
    depends_on:
      shipping-kafka:
        condition: service_healthy
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh"]
    command:
      - --bootstrap-server
      - shipping-kafka:29092
      - --create
      - --if-not-exists
      - --topic
      - fulfillment.events.v1
      - --partitions
      - "3"
      - --replication-factor
      - "1"

  shipping-service:
    build: .
    environment:
      SHIPPING_HTTP_ADDRESS: :8012
      SHIPPING_GRPC_ADDRESS: :9012
      SHIPPING_DATABASE_URL: postgres://shipping:shipping@shipping-postgres:5432/shipping_db?sslmode=disable
      SHIPPING_INTERNAL_TOKEN: ${SHIPPING_INTERNAL_TOKEN:-shipping-local-development-secret}
      SHIPPING_FAKE_WEBHOOK_SECRET: ${SHIPPING_FAKE_WEBHOOK_SECRET:-fake-carrier-webhook-secret}
      SHIPPING_KAFKA_BROKERS: shipping-kafka:29092
    ports:
      - "8012:8012"
      - "9012:9012"
    depends_on:
      shipping-postgres:
        condition: service_healthy
      shipping-kafka-init:
        condition: service_completed_successfully
      shipping-fulfillment-kafka-init:
        condition: service_completed_successfully

volumes:
  shipping_postgres_data:
