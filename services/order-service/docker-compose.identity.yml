# Overlay on docker-compose.test.yml; these URLs must be reachable from the API container.
services:
  api:
    environment:
      ORDER_AUTH_MODE: keycloak
      GUEST_SESSION_ISSUANCE_ENABLED: ${GUEST_SESSION_ISSUANCE_ENABLED:-false}
      GUEST_SESSION_SECRET: ${GUEST_SESSION_SECRET:-}
      GUEST_SESSION_ISSUANCE_PER_IP_HOUR: ${GUEST_SESSION_ISSUANCE_PER_IP_HOUR:-10}
      GUEST_TRUSTED_PROXY_CIDRS: ${GUEST_TRUSTED_PROXY_CIDRS:-}
      GUEST_CART_MUTATION_ENABLED: ${GUEST_CART_MUTATION_ENABLED:-false}
      GUEST_COD_CHECKOUT_ENABLED: ${GUEST_COD_CHECKOUT_ENABLED:-false}
      ORDER_COD_POLICY_REFERENCE: ${ORDER_COD_POLICY_REFERENCE:-}
      GUEST_VIETQR_CHECKOUT_ENABLED: ${GUEST_VIETQR_CHECKOUT_ENABLED:-false}
      GUEST_CART_MERGE_ENABLED: ${GUEST_CART_MERGE_ENABLED:-false}
      IDENTITY_URL: ${IDENTITY_URL:?Set the authoritative Identity API URL}
      ORDER_OIDC_ISSUER: ${ORDER_OIDC_ISSUER:?Set the exact Keycloak issuer}
      ORDER_OIDC_AUDIENCE: order-api
      ORDER_OIDC_JWKS_URL: ${ORDER_OIDC_JWKS_URL:-}
      PROFILE_URL: ${PROFILE_URL:?Set the real Profile service URL}
      PROFILE_INTERNAL_TOKEN: ${PROFILE_INTERNAL_TOKEN:?Set Order-to-Profile credential}
      ENABLE_AUTO_COMPLETE: "false"
