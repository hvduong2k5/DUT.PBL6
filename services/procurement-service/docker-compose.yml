services:
  procurement-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: procurement_db
      POSTGRES_USER: procurement
      POSTGRES_PASSWORD: procurement
    ports:
      - "5449:5432"
    volumes:
      - procurement_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procurement -d procurement_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  procurement-service:
    build: .
    environment:
      PROCUREMENT_HTTP_ADDRESS: :8008
      PROCUREMENT_DATABASE_URL: postgres://procurement:procurement@procurement-postgres:5432/procurement_db?sslmode=disable
      PROCUREMENT_INTERNAL_TOKEN: ${PROCUREMENT_INTERNAL_TOKEN:-procurement-local-development-secret}
    ports:
      - "8008:8008"
    depends_on:
      procurement-postgres:
        condition: service_healthy

volumes:
  procurement_postgres_data:
