  catalog-url: ${MARKETING_CATALOG_URL:http://catalog-service:8006}
  admin-origin: ${MARKETING_ADMIN_ORIGIN:}
  budget-ceiling-vnd: ${MARKETING_BUDGET_CEILING_VND:}
