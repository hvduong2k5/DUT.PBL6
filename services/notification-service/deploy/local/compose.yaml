name: pbl6-notification-test
services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: notification_test
      POSTGRES_PASSWORD: ${NOTIFICATION_TEST_PASSWORD:?Set a disposable test password}
      POSTGRES_DB: notification_test
    ports:
      - "127.0.0.1:15417:5432"
    volumes:
      - notification_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification_test -d notification_test"]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  notification_test_data:
