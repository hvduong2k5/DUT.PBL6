_format_version: "3.0"
_transform: true

# ==============================================================================
# 1. UPSTREAMS & SERVICES (18 MICROSERVICES ROUTING TABLE)
# ==============================================================================
services:
  # MS-07: Promotion HTTP surfaces only. Internal loyalty commands and gRPC
  # remain on the private service network; staff JWTs are verified by Promotion.
  - name: promotion-service
    url: http://promotion-service:8017
    connect_timeout: 2000
    read_timeout: 5000
    write_timeout: 5000
    retries: 0
    routes:
      - name: promotion-public-vouchers
        paths: ['~/api/v1/promotions/(vouchers|active)$']
        strip_path: false
        methods: [GET, OPTIONS]
      - name: promotion-customer-loyalty
        paths: ['~/api/v1/loyalty/points$']
        strip_path: false
        methods: [GET, OPTIONS]
      - name: promotion-staff-coupons
        paths: [/api/v1/admin/coupons]
        strip_path: false
        methods: [GET, POST, PUT, OPTIONS]

  - name: inventory-admin-service
    url: http://inventory-svc:8003
    routes:
      - name: inventory-receipts
        paths: [/api/v1/admin/inventory/workbench/receipts]
        strip_path: false
        methods: [POST, OPTIONS]

  # Fulfillment verifies the signed JWT and scoped grants locally.
  - name: fulfillment-service
    url: http://fulfillment-service:8002
    routes:
      - name: fulfillment-staff
        paths: [/api/v1/admin/fulfillment]
        strip_path: false
        methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]

  # ----------------------------------------------------------------------------
  # MS-00: API GATEWAY ROOT / HEALTH INFO ROUTE
  # ----------------------------------------------------------------------------
  - name: gateway-info-service
    url: http://127.0.0.1:8001/status
    connect_timeout: 2000
    read_timeout: 3000
    write_timeout: 3000
    retries: 0
    routes:
      - name: gateway-root-welcome-route
        paths:
          - /
        strip_path: true
        methods:
          - GET
          - OPTIONS
  # ----------------------------------------------------------------------------
  # MS-16: IDENTITY SERVICE (Auth, JWT Issuance, JWKS)
  # ----------------------------------------------------------------------------
  - name: identity-service
    url: http://identity-service:8016
    connect_timeout: 3000
    read_timeout: 5000
    write_timeout: 5000
    retries: 2
    routes:
      - name: identity-bff-routes
        paths:
          - /api/v1/public/auth
          - /api/v1/customer-api
          - /api/v1/admin/packing-api
        strip_path: false
        methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
      - name: auth-public-routes
        paths:
          - /api/v1/auth/login
          - /api/v1/auth/register
          - /api/v1/auth/refresh
          - /api/v1/auth/forgot-password
          - /api/v1/users/me
          - /.well-known/jwks.json
        strip_path: false
        methods:
          - POST
          - GET
          - OPTIONS
      - name: customer-registration-route
        paths:
          - /api/v1/public/customer-registrations
        strip_path: false
        methods: [POST, OPTIONS]
        plugins:
          - name: rate-limiting
            config:
              minute: 10
              policy: local
      - name: identity-admin-routes
        hosts: [api-pbl6.hvduong.qzz.io]
        regex_priority: 100
        paths:
          - /api/v1/admin/roles
          - /api/v1/admin/users
          - /api/v1/admin/role-assignments
          - /api/v1/admin/employee-invitations
          - /api/v1/admin/iam
        strip_path: false
        methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
      - name: identity-role-list
        paths: ['~/api/v1/admin/roles$']
        strip_path: false
        methods: [GET]
      - name: identity-staff-order-read
        paths: [/api/v1/admin/order-api]
        strip_path: false
        methods: [GET]

  # ----------------------------------------------------------------------------
  # MS-15: PROFILE SERVICE (Profiles, Address Book, Staff)
  # ----------------------------------------------------------------------------
  - name: profile-service
    url: http://omamx-profile-service:8080
    connect_timeout: 2000
    read_timeout: 5000
    write_timeout: 5000
    retries: 1
    routes:
      - name: profile-customer-routes
        paths:
          - /api/v1/profile
          - /api/v1/customer/capabilities
          - /api/v1/locations/checkout
        strip_path: false
        methods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        plugins:
          # Profile verifies Keycloak issuer/audience/signature and resolves
          # Customer ownership. Browser forwarding headers never grant identity.
          - name: request-transformer
            config:
              remove:
                headers:
                  - X-Internal-Token
                  - X-User-ID
                  - X-User-Role
                  - X-Customer-ID
                  - X-User-Permissions
                  - X-Internal-Caller
      - name: profile-admin-routes
        paths:
          - /api/v1/admin/employees
          - /api/v1/admin/customers
        strip_path: false
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS

  # ----------------------------------------------------------------------------
  # MS-05: CATALOG SERVICE (Products, Categories, Search)
  # ----------------------------------------------------------------------------
  - name: catalog-service
    url: http://catalog-service:8006
    connect_timeout: 2000
    read_timeout: 3000
    write_timeout: 3000
    retries: 2
    routes:
      - name: catalog-public-routes
        paths:
          - /api/v1/products
          - /api/v1/categories
          - /api/v1/search
        strip_path: false
        methods:
          - GET
          - OPTIONS
      - name: catalog-admin-routes
        paths:
          - /api/v1/admin/catalog
        strip_path: false
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS

  # ----------------------------------------------------------------------------
  # MS-04: ORDER SERVICE (Cart sessions, Checkout Saga, Order Tracking)
  # ----------------------------------------------------------------------------
  - name: order-service
    url: http://order-service:8004
    connect_timeout: 2000
    read_timeout: 5000
    write_timeout: 5000
    retries: 0 # Prohibit retries on mutations/checkout to prevent duplicate orders
    routes:
      - name: cart-routes
        paths:
          - /api/v1/cart
        strip_path: false
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
      - name: order-checkout-routes
        paths:
          - /api/v1/orders
          - /api/v1/checkout
          - /api/v1/checkout-operations
          - /api/v1/admin/orders
          - /api/v1/admin/payments
          - /api/v1/admin/checkout-operations
          - /api/v1/guest-sessions
        strip_path: false
        methods:
          - GET
          - POST
          - OPTIONS
        plugins:
          # Order verifies bearer issuer/audience/signature and Guest scope itself.
          - name: rate-limiting
            config:
              minute: 30
              policy: local

      - name: order-admin-payments-routes
        hosts: [api-pbl6.hvduong.qzz.io]
        regex_priority: 100
        paths:
          - /api/v1/admin/payments
          - /api/v1/admin/checkout-operations
        strip_path: false
        methods: [GET, POST, OPTIONS]
        plugins:
          - name: rate-limiting
            config:
              minute: 30
              policy: local

  # ----------------------------------------------------------------------------
  # PARTNER WEBHOOKS: VIETQR CALLBACK
  # ----------------------------------------------------------------------------
  - name: payment-webhook-handler
    url: http://order-service:8004
    connect_timeout: 3000
    read_timeout: 5000
    write_timeout: 5000
    retries: 1
    routes:
      - name: vietqr-callback-route
        paths:
          - /api/v1/payments/vietqr/callback
          - /api/v1/payments/sepay/webhook
        strip_path: false
        methods:
          - POST
        plugins:
          - name: rate-limiting
            config:
              minute: 600
              policy: local

# ==============================================================================
# 2. GLOBAL PLUGINS (SECURITY, TRACING, METRICS, CORS)
# ==============================================================================
plugins:
  # 1. CORS plugin
  - name: cors
    config:
      origins:
        - "https://omama.hvduong.qzz.io"
        - "https://pbl.npanhbao.dev"
        - "http://localhost:3000"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-Type
        - Authorization
        - X-Request-Id
        - X-Idempotency-Key
        - Idempotency-Key
        - If-Match
      exposed_headers:
        - X-Request-Id
        - Content-Range
        - ETag
        - Location
        - Retry-After
      credentials: true
      max_age: 3600

  # 2. Correlation ID plugin for distributed tracing
  - name: correlation-id
    config:
      header_name: X-Request-Id
      generator: uuid#counter
      echo_downstream: true

  # 3. Request Transformer: Zero-Trust Security (Header Sanitization)
  - name: request-transformer
    config:
      remove:
        headers:
          - X-User-Id
          - X-User-Role
          - X-User-Permissions
          - X-Internal-Caller
          - X-Internal-Token
          - X-Customer-ID

  # 4. Global Rate Limiting
  - name: rate-limiting
    config:
      minute: 300
      limit_by: ip
      policy: local
      fault_tolerant: true
      hide_client_headers: false

  # 5. Prometheus Metrics Plugin
  - name: prometheus
    config:
      per_consumer: false
      status_code_metrics: true
      latency_metrics: true
      bandwidth_metrics: true
      upstream_health_metrics: true
