services:
  kong-gateway:
    image: kong:3.9
    container_name: omamx-kong-gateway
    restart: unless-stopped
    networks:
      - omamx-network
    ports:
      # North-South Proxy Ports (Giao tiếp Client)
      - "8000:8000"     # HTTP Proxy
      - "8443:8443"     # HTTPS Proxy
      # Admin Management Ports (Chỉ bind vào localhost 127.0.0.1 để bảo mật)
      - "127.0.0.1:8001:8001" # Admin API (Read-only trong chế độ DB-less)
      - "127.0.0.1:8444:8444" # Admin API HTTPS
      - "127.0.0.1:8002:8002" # Kong Manager GUI
    environment:
      # 1. DB-less Declarative Mode
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: "/etc/kong/kong.yml"

      # 2. Listening Ports
      KONG_PROXY_LISTEN: "0.0.0.0:8000, 0.0.0.0:8443 ssl"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001, 0.0.0.0:8444 ssl"
      KONG_ADMIN_GUI_LISTEN: "0.0.0.0:8002"

      # 3. Kong Manager GUI URL
      KONG_ADMIN_GUI_URL: "http://localhost:8002"

      # 4. Logging & Diagnostics
      KONG_LOG_LEVEL: "info"
      KONG_PROXY_ACCESS_LOG: "/dev/stdout"
      KONG_PROXY_ERROR_LOG: "/dev/stderr"
      KONG_ADMIN_ACCESS_LOG: "/dev/stdout"
      KONG_ADMIN_ERROR_LOG: "/dev/stderr"

      # 5. Internal Docker DNS resolution
      KONG_DNS_RESOLVER: "127.0.0.11"
      KONG_DNS_ORDER: "LAST,A,CNAME"

      # 6. Connection pooling & Keepalive
      KONG_UPSTREAM_KEEPALIVE_POOL_SIZE: 64
      KONG_UPSTREAM_KEEPALIVE_MAX_REQUESTS: 1000
      KONG_UPSTREAM_KEEPALIVE_IDLE_TIMEOUT: 60
    volumes:
      - ./config/kong.yml:/etc/kong/kong.yml:ro
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  omamx-network:
    name: omamx-network
    external: true
