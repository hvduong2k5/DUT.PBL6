services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fulfillment_test
      POSTGRES_PASSWORD: fulfillment_test_local
      POSTGRES_DB: fulfillment_test
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U fulfillment_test -d fulfillment_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  kafka:
    image: apache/kafka@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    environment:
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 30
  tests:
    image: ${FULFILLMENT_GO_TOOLS_IMAGE:-omamx/fulfillment-go-tools:local}
    working_dir: /workspace/services/fulfillment-service
    volumes:
      - ../..:/workspace
      - go_mod:/go/pkg/mod
      - go_build:/root/.cache/go-build
    environment:
      FULFILLMENT_TEST_DATABASE: postgres://fulfillment_test:fulfillment_test_local@db:5432/fulfillment_test?sslmode=disable
      FULFILLMENT_TEST_KAFKA: kafka:29092
    command: [sh, -c, "gofmt -w cmd internal migrations tests && go vet ./... && go test -race -count=1 -v ./..."]
    depends_on:
      db: {condition: service_healthy}
      kafka: {condition: service_healthy}
volumes:
  go_mod:
  go_build:
