name: Mobile MVP regression
on:
  pull_request:
    paths: ['apps/mobile-app/**', '.github/workflows/mobile-mvp.yml']
  push:
    branches: [dev]
    paths: ['apps/mobile-app/**', '.github/workflows/mobile-mvp.yml']
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install the verified Flutter and Dart version
        run: |
          git clone --depth 1 --branch 3.44.9 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Resolve mobile dependencies
        working-directory: apps/mobile-app
        run: flutter pub get
      - name: Analyze and test
        working-directory: apps/mobile-app
        run: |
          flutter analyze --no-pub
          flutter test --no-pub
