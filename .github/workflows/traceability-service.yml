name: Traceability Service
on:
  workflow_call:
  pull_request:
    branches: [dev, develop, main]
    paths:
      - 'services/traceability-service/**'
      - 'docs/03_api_specs/traceability-service.openapi.yaml'
      - 'docs/04_testing/traceability-service/artifacts/**'
      - '.github/workflows/traceability-service.yml'
  push:
    branches: [dev, develop, main]
    paths:
      - 'services/traceability-service/**'
      - 'docs/03_api_specs/traceability-service.openapi.yaml'
      - '.github/workflows/traceability-service.yml'
permissions:
  contents: read
jobs:
  sandbox-contract-and-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/traceability-service
    env:
      # Ephemeral fixture credentials for this isolated CI runner only.
      TRACEABILITY_DB_PASSWORD: traceability_ci_ephemeral
      TRACEABILITY_TEST_DATABASE_URL: postgres://trace_migrator:traceability_ci_ephemeral@127.0.0.1:15403/om_traceability_db?sslmode=disable
      TRACEABILITY_TEST_KAFKA_BROKERS: 127.0.0.1:19093
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache-dependency-path: services/traceability-service/go.sum
      - name: Start isolated PostgreSQL and Kafka-compatible broker
        run: |
          docker network create traceability-ci
          docker run -d --name traceability-ci-db --label codex.task=traceability-ci --network traceability-ci \
            -p 127.0.0.1:15403:5432 \
            -e POSTGRES_DB=om_traceability_db -e POSTGRES_USER=trace_migrator \
            -e POSTGRES_PASSWORD="$TRACEABILITY_DB_PASSWORD" \
            --health-cmd='pg_isready -U trace_migrator -d om_traceability_db' \
            --health-interval=2s --health-timeout=2s --health-retries=30 postgres:16-alpine
          docker run -d --name traceability-ci-kafka --label codex.task=traceability-ci --network traceability-ci \
            -p 127.0.0.1:19093:19092 \
            --health-cmd='rpk cluster info --brokers 127.0.0.1:9092' \
            --health-interval=2s --health-timeout=2s --health-retries=30 \
            docker.redpanda.com/redpandadata/redpanda:v24.3.18 \
            redpanda start --smp=1 --memory=512M --reserve-memory=0M \
            --overprovisioned --node-id=0 --check=false \
            --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092 \
            --advertise-kafka-addr=internal://traceability-ci-kafka:9092,external://127.0.0.1:19093
          for container in traceability-ci-db traceability-ci-kafka; do
            ready=false
            for attempt in $(seq 1 60); do
              if [ "$(docker inspect --format='{{.State.Health.Status}}' "$container")" = healthy ]; then
                ready=true
                break
              fi
              sleep 1
            done
            if [ "$ready" != true ]; then
              docker logs "$container"
              exit 1
            fi
          done
      - name: Format, vet and build
        run: |
          test -z "$(gofmt -l cmd internal migrations)"
          go vet ./...
          go build ./...
      - name: Race and integration tests with aggregate coverage
        run: |
          # Test every package, but measure handwritten code, including cmd.
          # Generated protobuf stubs are checked by the contract/codegen gates.
          coverage_packages=$(go list ./... | awk '!/\/pkg\/proto\//' | paste -sd, -)
          test -n "$coverage_packages"
          go test -race -count=1 -coverpkg="$coverage_packages" -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tee coverage-summary.txt
          go tool cover -func=coverage.out | awk '$1=="total:" {gsub("%","",$3); if ($3<75) exit 1}'
      - name: Retain handwritten coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traceability-coverage
          path: |
            services/traceability-service/coverage.out
            services/traceability-service/coverage-summary.txt
      - name: Validate draft contracts
        run: |
          python3 -m venv /tmp/traceability-spec
          /tmp/traceability-spec/bin/python -m pip install -r scripts/spec-requirements.txt
          /tmp/traceability-spec/bin/python -m unittest discover -s scripts -p test_validate_specs.py -v
          /tmp/traceability-spec/bin/python scripts/validate_specs.py
      - name: Clean up runner containers without removing volumes
        if: always()
        run: |
          docker rm -f traceability-ci-db traceability-ci-kafka || true
          docker network rm traceability-ci || true
