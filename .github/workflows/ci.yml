name: CI

on:
  workflow_call:
  push:
    branches: [feature/catalog-service, dev, main]
  pull_request:
    branches: [feature/catalog-service, dev, main]

jobs:
  contract:
    name: Contract verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          python -m pip install -r packages/contracts/mvp/requirements.txt

      - name: Lint handoff OpenAPI contracts
        run: |
          npx --yes @redocly/cli lint docs/03_api_specs/customer-stable.openapi.yaml
          npx --yes @redocly/cli lint docs/03_api_specs/customer-draft-planned.openapi.yaml
          npx --yes @redocly/cli lint docs/03_api_specs/admin-stable.openapi.yaml
          npx --yes @redocly/cli lint docs/03_api_specs/admin-draft-planned.openapi.yaml

      - name: Run verify.py
        run: |
          python packages/contracts/mvp/verify.py

  test:
    name: Catalog service tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run Gradle tests
        run: |
          ./gradlew test
        working-directory: services/catalog-service
