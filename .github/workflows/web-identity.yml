name: Web Identity Gateway integration
on:
  pull_request:
    paths:
      - 'apps/web-user/**'
      - 'apps/mobile-app/**'
      - 'services/catalog-service/**'
      - 'services/identity-service/**'
      - 'services/profile-service/**'
      - 'services/api-gateway/**'
      - 'services/order-service/internal/app/identity*'
      - 'services/order-service/internal/app/catalog.go'
      - 'services/order-service/internal/app/core_checkout.go'
      - 'services/order-service/internal/app/base.go'
      - 'services/inventory-service/**'
      - 'services/order-service/internal/shippingprovider/**'
      - 'services/shipping-service/**'
      - 'services/order-service/tests/webidentityfixture/**'
      - 'scripts/mvp_native_checks.py'
      - 'scripts/test-web-identity.py'
      - 'scripts/mvp_customer_checks.py'
      - '.github/workflows/web-identity.yml'
  push:
    branches: [dev]
    paths:
      - 'apps/web-user/**'
      - 'apps/mobile-app/**'
      - 'services/order-service/**'
      - 'services/inventory-service/**'
      - 'services/catalog-service/**'
      - 'services/identity-service/**'
      - 'services/profile-service/**'
      - 'services/api-gateway/**'
      - 'scripts/mvp_native_checks.py'
      - 'scripts/test-web-identity.py'
      - 'scripts/mvp_customer_checks.py'
      - 'services/shipping-service/**'
jobs:
  web-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web-user/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: |
            services/profile-service/go.sum
            services/order-service/go.sum
            services/inventory-service/go.sum
            services/shipping-service/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native SDK for the live client contract test
        run: |
          git clone --depth 1 --branch 3.44.9 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Native dependencies
        working-directory: apps/mobile-app
        run: flutter pub get
      - name: Web regression and production build
        working-directory: apps/web-user
        run: npm ci && npm run verify:mvp && npm run build
      - name: Profile regression including JWT and forwarded identity rejection
        working-directory: services/profile-service
        run: go vet ./... && go test -race -count=1 ./...
      - name: Real Web OIDC, Keycloak, Gateway, Identity, Profile and Order
        run: |
          python -m pip install -r packages/contracts/mvp/requirements.txt
          python scripts/test-web-identity.py --gradle gradle --flutter flutter
      - name: Shipping regression and notification verification
        run: |
          cd services/shipping-service
          go vet ./... && go test -race -count=1 ./...
          cd ../order-service
          go test -race -count=1 ./internal/shippingprovider
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-identity-evidence
          path: |
            .system_generated/web-identity/result.json
            .system_generated/web-identity/identity-build.log
            .system_generated/web-identity/catalog-build.log
            .system_generated/web-identity/mobile-live.log
