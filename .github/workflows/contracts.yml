name: MVP contract gates

on:
  workflow_call:
  pull_request:
    branches: [dev, develop, main]
    paths:
      - 'packages/proto/**'
      - 'packages/events/**'
      - 'services/procurement-service/**'
      - 'scripts/verify-procurement-receipt-contract.py'
      - 'scripts/verify-procurement-admin-contract.py'
      - 'services/api-gateway/config/kong.yml'
      - 'packages/contracts/**'
      - 'docs/03_api_specs/**'
      - '.github/workflows/contracts.yml'
  push:
    branches: [dev, develop, main, integration/mvp-contracts]
    paths:
      - 'packages/proto/**'
      - 'packages/events/**'
      - 'services/procurement-service/**'
      - 'scripts/verify-procurement-receipt-contract.py'
      - 'scripts/verify-procurement-admin-contract.py'
      - 'services/api-gateway/config/kong.yml'
      - 'packages/contracts/**'
      - 'docs/03_api_specs/**'
      - '.github/workflows/contracts.yml'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: packages/contracts/mvp/requirements.txt
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: false
      - name: Install pinned contract and codegen tools
        run: |
          python -m pip install -r packages/contracts/mvp/requirements.txt
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.10
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
      - name: OpenAPI, event examples, registry and four wire baselines
        run: |
          python packages/contracts/mvp/verify.py --go-plugin "$(go env GOPATH)/bin/protoc-gen-go" --go-grpc-plugin "$(go env GOPATH)/bin/protoc-gen-go-grpc" --output .system_generated/mvp-contracts/verification.json
      - name: Order proof and negative contract regressions
        run: |
          python packages/contracts/verify_order_design.py --descriptor .system_generated/mvp-contracts/descriptor.pb --output .system_generated/mvp-contracts/order-design-verification.json
      - name: Procurement receipt producer contract and unit regressions
        run: |
          python scripts/verify-procurement-receipt-contract.py
          python scripts/verify-procurement-admin-contract.py
          cd services/procurement-service
          go test -race -count=1 ./...
          go vet ./...
      - name: Parse Kong configuration with the deployed version
        run: docker run --rm -e KONG_DATABASE=off -v "$PWD/services/api-gateway/config/kong.yml:/config/kong.yml:ro" kong:3.9.3 kong config parse /config/kong.yml
      - name: Procurement allowlist on a disposable Kong proxy
        run: |
          docker run -d --rm --name procurement-kong-contract \
            -e KONG_DATABASE=off -e KONG_DECLARATIVE_CONFIG=/config/kong.yml \
            -e KONG_ALLOW_DEBUG_HEADER=on -e KONG_ADMIN_LISTEN=off \
            -e KONG_PROXY_LISTEN=0.0.0.0:8000 -e KONG_NGINX_WORKER_PROCESSES=1 \
            --add-host procurement-service:127.0.0.1 -p 127.0.0.1::8000 \
            -v "$PWD/services/api-gateway/config/kong.yml:/config/kong.yml:ro" kong:3.9.3
          trap 'docker stop procurement-kong-contract > /dev/null' EXIT
          port="$(docker port procurement-kong-contract 8000 | cut -d: -f2)"
          python scripts/verify-procurement-admin-contract.py --gateway-url "http://127.0.0.1:$port"
      - name: Upload static contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mvp-contract-evidence
          path: .system_generated/mvp-contracts/
